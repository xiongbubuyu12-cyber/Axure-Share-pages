  @depth     L3

<html lang="zh-CN" data-brand="blue" data-theme="light" data-layout="L-D09-01">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>D09 退市管理 · 浅色顶栏页签</title>
<link rel="stylesheet" href="../../../03-设计体系/AI-PIM-Design-System/02-Design-Token/tokens/tokens.css" />
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  :root {
    --d-primary: #2D6CEE; --d-primary-hover: #4A82F2; --d-primary-active: #1F54C4; --d-primary-bg: #EAF1FE;
    --d-nav: #1F2D3D; --d-nav-hover: #2A3B50; --d-nav-active: #2D6CEE;
    --d-border: #DDE3EC; --d-page: #F2F4F8; --d-radius: 4px;
  }
  body { font-family: var(--font-family-base); font-size: var(--font-size-body-sm); color: var(--color-text-primary);
    background: var(--d-page); display: flex; flex-direction: column; overflow: hidden; }
  [x-cloak] { display: none !important; }
  button { font-family: inherit; cursor: pointer; background: none; border: 0; padding: 0; color: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--d-primary); outline-offset: 1px; }

  /* ===== 浅色顶栏 + 页签 ===== */
  .topbar { flex: 0 0 auto; height: 48px; background: #fff; border-bottom: 1px solid var(--d-border);
    display: flex; align-items: center; gap: 12px; padding: 0 16px; }
  .logo { width: 30px; height: 30px; border-radius: 6px; background: var(--d-primary); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .top-tab { height: 48px; display: inline-flex; align-items: center; gap: 6px; padding: 0 14px; font-size: var(--font-size-body);
    color: var(--color-text-secondary); border-bottom: 2px solid transparent; white-space: nowrap; }
  .top-tab:hover { color: var(--d-primary); }
  .top-tab.active { color: var(--d-primary); font-weight: var(--font-weight-medium); border-bottom-color: var(--d-primary); }
  .top-tab .x { font-size: 11px; color: var(--color-text-tertiary); padding: 1px 3px; border-radius: 3px; }
  .top-tab .x:hover { background: var(--color-bg-fill); color: var(--color-danger); }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--color-text-secondary); font-size: var(--font-size-body-sm); }
  .top-icon { position: relative; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: var(--color-text-secondary); }
  .top-icon:hover { background: var(--color-bg-fill); }
  .badge-dot { position: absolute; top: 2px; right: 0; min-width: 15px; height: 15px; border-radius: 999px; background: #F04A4A;
    color: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; padding: 0 3px; }
  .avatar { width: 28px; height: 28px; border-radius: 999px; background: var(--d-primary); color: #fff; font-size: 11px;
    display: flex; align-items: center; justify-content: center; font-weight: 600; }
  .role-sel { height: 28px; border: 1px solid var(--d-border); border-radius: 4px; font-size: var(--font-size-caption); color: var(--color-text-secondary); }

  .shell-body { flex: 1 1 auto; min-height: 0; display: flex; }
  .sidebar { flex: 0 0 88px; background: var(--d-nav); display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 2px; overflow-y: auto; }
  .side-item { width: 76px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 0; border-radius: 8px;
    color: rgba(255,255,255,.65); font-size: var(--font-size-body-sm); }
  .side-item:hover { background: var(--d-nav-hover); color: #fff; }
  .side-item.active { background: var(--d-nav-active); color: #fff; font-weight: var(--font-weight-medium); }
  .side-item svg { width: 18px; height: 18px; }
  .side-gap { height: 10px; }
  .main { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; }

  /* ===== 状态页签条 ===== */
  .status-tabs { flex: 0 0 auto; display: flex; align-items: center; background: #fff; padding: 0 16px; border-bottom: 1px solid var(--d-border); overflow-x: auto; }
  .status-tab { height: 40px; display: inline-flex; align-items: center; gap: 5px; padding: 0 14px; font-size: var(--font-size-body);
    color: var(--color-text-secondary); border-bottom: 2px solid transparent; white-space: nowrap; }
  .status-tab:hover { color: var(--d-primary); }
  .status-tab.active { color: var(--d-primary); font-weight: var(--font-weight-medium); border-bottom-color: var(--d-primary); }
  .status-tab .cnt { color: #F04A4A; font-size: var(--font-size-caption); font-variant-numeric: tabular-nums; }
  .status-tab.active .cnt { color: var(--d-primary); }
  .collapse-link { margin-left: auto; font-size: var(--font-size-caption); color: var(--color-text-tertiary); white-space: nowrap; padding: 0 4px; }
  .collapse-link:hover { color: var(--d-primary); }

  /* ===== 双行筛选条 ===== */
  .filterbar { flex: 0 0 auto; background: #fff; padding: 10px 16px 0; border-bottom: 1px solid var(--d-border); }
  .frow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-bottom: 10px; }
  .fselect { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--d-border);
    border-radius: var(--d-radius); background: #fff; font-size: var(--font-size-body-sm); color: var(--color-text-primary); }
  .fselect:hover { border-color: var(--d-primary); }
  .fselect select, .fselect input[type="date"] { border: 0; outline: none; font-size: inherit; color: inherit; background: transparent; max-width: 130px; }
  .finput { height: 30px; border: 1px solid var(--d-border); border-radius: var(--d-radius); padding: 0 10px; font-size: var(--font-size-body-sm); background: #fff; }
  .finput:focus { border-color: var(--d-primary); outline: none; box-shadow: 0 0 0 2px rgba(45,108,238,.15); }
  .kw-wrap { position: relative; }
  .kw-wrap .finput { padding-left: 28px; width: 220px; }
  .kw-wrap svg { position: absolute; left: 8px; top: 8px; width: 14px; height: 14px; color: var(--color-text-tertiary); }
  .fbtn { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 12px; border: 1px solid var(--d-border);
    border-radius: var(--d-radius); background: #fff; font-size: var(--font-size-body-sm); color: var(--color-text-secondary); }
  .fbtn:hover { color: var(--d-primary); border-color: var(--d-primary); }
  .fbtn-reset { border-color: var(--d-primary); color: var(--d-primary); }
  .fbtn-reset:hover { background: var(--d-primary-bg); }
  .flink { font-size: var(--font-size-caption); color: var(--color-text-tertiary); }
  .flink:hover { color: var(--d-primary); text-decoration: underline; }
  .sep { width: 1px; height: 16px; background: var(--d-border); margin: 0 2px; }

  /* ===== 工具条 ===== */
  .toolbar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--d-page); }
  .btn-primary { display: inline-flex; align-items: center; height: 32px; padding: 0 16px; border-radius: var(--d-radius);
    background: var(--d-primary); color: #fff; font-size: var(--font-size-body-sm); font-weight: var(--font-weight-medium); }
  .btn-primary:hover { background: var(--d-primary-hover); }
  .btn-primary[disabled] { opacity: .5; cursor: not-allowed; }
  .btn-plain { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: var(--d-radius);
    background: #fff; border: 1px solid var(--d-border); color: var(--color-text-secondary); font-size: var(--font-size-body-sm); }
  .btn-plain:hover { color: var(--d-primary); border-color: var(--d-primary); }
  .view-tabs { margin-left: auto; display: flex; align-items: center; gap: 2px; background: #fff; border: 1px solid var(--d-border); border-radius: var(--d-radius); padding: 2px; }
  .view-tab { height: 26px; padding: 0 12px; border-radius: 3px; font-size: var(--font-size-caption); color: var(--color-text-secondary); }
  .view-tab.active { background: var(--d-primary); color: #fff; }
  .tool-icon { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--d-border);
    border-radius: var(--d-radius); background: #fff; color: var(--color-text-secondary); font-size: 13px; }
  .tool-icon:hover { color: var(--d-primary); border-color: var(--d-primary); }
  .tool-icon.on { color: var(--d-primary); border-color: var(--d-primary); background: var(--d-primary-bg); }
  .tool-icon svg { width: 15px; height: 15px; }
  .tool-icon.spin svg { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .col-panel { position: absolute; right: 0; top: 100%; z-index: 60; width: 190px; background: #fff; border: 1px solid var(--d-border);
    border-radius: var(--d-radius); box-shadow: var(--shadow-2); padding: 10px 12px; }
  .col-panel .ttl { font-size: var(--font-size-body-sm); font-weight: var(--font-weight-medium); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .col-panel label { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: var(--font-size-body-sm); color: var(--color-text-primary); }
  .col-panel .acts { display: flex; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #EDF1F7; }
  .col-panel .acts button { font-size: var(--font-size-caption); color: var(--d-primary); }
  .dense tbody td { padding: 5px 12px; font-size: var(--font-size-body-sm); }
  .dense thead th { padding: 7px 12px; }
  .loose tbody td { padding: 14px 12px; }

  /* ===== 表格通用 ===== */
  .table-card { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; margin: 0 16px 16px; background: #fff;
    border: 1px solid var(--d-border); border-radius: var(--d-radius); overflow: hidden; }
  .table-wrap { flex: 1 1 auto; min-height: 160px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th { position: sticky; top: 0; z-index: 10; background: #F7F9FC; color: var(--color-text-secondary);
    font-weight: var(--font-weight-medium); font-size: var(--font-size-body-sm); text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--d-border); white-space: nowrap; }
  tbody td { padding: 10px 12px; border-bottom: 1px solid #EDF1F7; vertical-align: top; }
  tbody tr:hover { background: #F7FAFF; }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--font-family-mono); font-size: var(--font-size-caption); }
  .cell-main { color: var(--d-primary); font-size: var(--font-size-body-sm); font-weight: var(--font-weight-medium); text-align: left; }
  .cell-sub { color: var(--color-text-tertiary); font-size: var(--font-size-caption); margin-top: 3px; }
  .cell-strong { font-weight: var(--font-weight-medium); }
  .tag { display: inline-block; font-size: var(--font-size-caption); padding: 1px 8px; border-radius: 3px; white-space: nowrap; }
  .t-draft { color: var(--color-text-secondary); background: #F2F4F8; }
  .t-pending { color: var(--d-primary); background: var(--d-primary-bg); }
  .t-approved { color: #1E7A38; background: #E4F4E8; }
  .t-rejected { color: var(--color-danger); background: var(--color-danger-bg); }
  .t-cancelled { color: var(--color-text-tertiary); background: #F2F4F8; }
  .t-retired { color: var(--color-text-secondary); background: #EDF1F7; }
  .t-revival { color: #B97900; background: #FDF3E0; }
  .t-delisting { color: var(--d-primary-active); background: var(--d-primary-bg); border: 1px solid rgba(45,108,238,.3); }
  .op-link { display: block; color: var(--d-primary); font-size: var(--font-size-body-sm); padding: 2px 0; text-align: left; }
  .op-link:hover { text-decoration: underline; }
  .op-link.muted { color: var(--color-text-secondary); }
  .op-link.muted:hover { color: var(--d-primary); }
  .more-wrap { position: relative; }
  .more-menu { position: absolute; right: 0; top: 100%; z-index: 50; min-width: 110px; background: #fff; border: 1px solid var(--d-border);
    border-radius: var(--d-radius); box-shadow: var(--shadow-2); padding: 4px; }
  .more-menu button { display: block; width: 100%; text-align: left; padding: 6px 10px; font-size: var(--font-size-body-sm); border-radius: 3px; color: var(--color-text-primary); }
  .more-menu button:hover { background: #F2F6FF; color: var(--d-primary); }

  /* 展开态（截图样式） */
  .thumb { width: 44px; height: 44px; border-radius: 4px; background: linear-gradient(135deg,#E8EDF5,#D8E2F0);
    display: flex; align-items: center; justify-content: center; font-size: 11px; color: #7A8AA5; margin-bottom: 4px; }
  .sku-line { display: flex; align-items: baseline; gap: 6px; padding: 2px 0; white-space: nowrap; }
  .sku-line .qty { color: var(--d-primary); font-weight: var(--font-weight-medium); }
  .sku-line .price { color: var(--color-text-secondary); font-size: var(--font-size-caption); }
  .src-tag { display: inline-block; font-size: var(--font-size-caption); color: #B97900; background: #FDF3E0; border-radius: 3px; padding: 0 6px; }
  .note-inline { color: var(--color-text-secondary); }

  .empty { padding: 64px 0; text-align: center; color: var(--color-text-tertiary); font-size: var(--font-size-body); }
  .empty .sub { font-size: var(--font-size-body-sm); margin-top: 6px; }
  .skl { height: 14px; border-radius: 4px; background: linear-gradient(90deg, #eef1f6 25%, #e3e8f0 50%, #eef1f6 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  .pager { flex: 0 0 auto; display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 10px 12px;
    border-top: 1px solid var(--d-border); background: #fff; font-size: var(--font-size-body-sm); color: var(--color-text-secondary); }
  .pg-btn { min-width: 26px; height: 26px; border: 1px solid var(--d-border); border-radius: 3px; background: #fff; font-size: var(--font-size-caption); color: var(--color-text-secondary); }
  .pg-btn:hover { color: var(--d-primary); border-color: var(--d-primary); }
  .pg-btn.cur { border-color: var(--d-primary); color: var(--d-primary); font-weight: var(--font-weight-medium); }
  .pager select { height: 26px; border: 1px solid var(--d-border); border-radius: 3px; font-size: var(--font-size-caption); }
  .pager .go input { width: 40px; height: 26px; border: 1px solid var(--d-border); border-radius: 3px; text-align: center; font-size: var(--font-size-caption); }

  /* Toast / Modal */
  .toast-stack { position: fixed; top: 56px; left: 50%; transform: translateX(-50%); z-index: 500; display: flex; flex-direction: column; gap: 8px; }
  .toast { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--d-border); border-radius: 6px;
    box-shadow: var(--shadow-2); padding: 9px 16px; font-size: var(--font-size-body-sm); animation: tin .2s ease; }
  @keyframes tin { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  .toast.success { color: var(--color-success); } .toast.error { color: var(--color-danger); } .toast.info { color: var(--d-primary); }
  .mask { position: fixed; inset: 0; background: rgba(20,30,45,.45); z-index: 200; display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px 16px; }
  .modal { background: #fff; border-radius: 6px; box-shadow: var(--shadow-3); width: 660px; max-width: 100%; max-height: 90vh; display: flex; flex-direction: column; }
  .modal.wide { width: 860px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--color-divider); }
  .modal-title { font-size: var(--font-size-body-lg); font-weight: var(--font-weight-semibold); }
  .modal-body { padding: 14px 18px; overflow: auto; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 18px; border-top: 1px solid var(--color-divider); }
  .icon-x { font-size: 14px; color: var(--color-text-tertiary); padding: 4px 8px; border-radius: 4px; }
  .icon-x:hover { background: var(--color-bg-fill); color: var(--color-danger); }
  .modal .frow { padding: 0 0 10px; }
  .modal table { font-size: var(--font-size-body-sm); }
  .modal thead th { padding: 8px 10px; }
  .modal tbody td { padding: 8px 10px; }

  .flow { display: flex; align-items: center; margin: 6px 0 14px; }
  .flow-node { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 72px; }
  .flow-dot { width: 10px; height: 10px; border-radius: 999px; background: var(--d-border); }
  .flow-node.done .flow-dot { background: var(--d-primary); }
  .flow-node.cur .flow-dot { background: #fff; border: 2px solid var(--d-primary); }
  .flow-lab { font-size: var(--font-size-caption); color: var(--color-text-tertiary); white-space: nowrap; }
  .flow-node.done .flow-lab, .flow-node.cur .flow-lab { color: var(--color-text-primary); }
  .flow-line { flex: 1; height: 2px; background: var(--d-border); margin: 0 4px 18px; }
  .flow-line.done { background: var(--d-primary); }
  .opinion { border-left: 2px solid var(--d-border); padding: 4px 0 4px 10px; margin: 8px 0 0 4px; font-size: var(--font-size-caption); color: var(--color-text-secondary); }
  .opinion b { color: var(--color-text-primary); }
  .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 16px; font-size: var(--font-size-body-sm); margin-bottom: 12px; }
  .detail-grid .k { color: var(--color-text-tertiary); font-size: var(--font-size-caption); }
  .lines-table { width: 100%; border-collapse: collapse; font-size: var(--font-size-caption); margin-top: 8px; }
  .lines-table th { background: #F7F9FC; text-align: left; padding: 6px 10px; font-weight: var(--font-weight-medium); color: var(--color-text-secondary); }
  .lines-table td { padding: 6px 10px; border-bottom: 1px solid #EDF1F7; }

  /* 日志时间轴 */
  .log-rail { position: relative; }
  .log-rail::before { content: ''; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 2px; background: #EDF1F7; }
  .log-item { display: flex; gap: 12px; padding-bottom: 16px; }
  .log-dot { width: 12px; height: 12px; border-radius: 999px; background: var(--d-primary); border: 2px solid #fff; box-shadow: 0 0 0 2px var(--d-primary-bg); flex-shrink: 0; margin-top: 3px; position: relative; z-index: 1; }
  .log-dot.muted { background: #8C8C8C; box-shadow: 0 0 0 2px #EDF1F7; }
  .log-dot.warn { background: #B97900; box-shadow: 0 0 0 2px #FDF3E0; }
  .log-dot.ok { background: #1E7A38; box-shadow: 0 0 0 2px #E4F4E8; }

  /* 表单页 */
  .form-page { flex: 1 1 auto; overflow-y: auto; padding: 14px 16px 100px; }
  .form-card { background: #fff; border: 1px solid var(--d-border); border-radius: 6px; padding: 18px 22px; max-width: 960px; }
  .form-card h2 { font-size: var(--font-size-title-sm); font-weight: var(--font-weight-semibold); margin: 0 0 16px; }
  .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .form-item { display: flex; flex-direction: column; gap: 6px; }
  .form-item.wide { grid-column: 1 / -1; }
  .form-item label { font-size: var(--font-size-body-sm); font-weight: var(--font-weight-medium); }
  .req { color: var(--color-danger); margin-right: 2px; }
  .err { font-size: var(--font-size-caption); color: var(--color-danger); }
  .form-item input, .form-item select, .form-item textarea { border: 1px solid var(--d-border); border-radius: var(--d-radius); padding: 8px 10px; font-size: var(--font-size-body-sm); font-family: inherit; }
  .form-item input:focus, .form-item select:focus, .form-item textarea:focus { border-color: var(--d-primary); box-shadow: 0 0 0 2px rgba(45,108,238,.15); outline: none; }
  .form-item.has-err input, .form-item.has-err select, .form-item.has-err textarea { border-color: var(--color-danger); }
  .sticky-foot { position: sticky; bottom: 0; background: #fff; border-top: 1px solid var(--d-border); padding: 10px 16px; display: flex; justify-content: flex-end; gap: 8px; }
  .page-head { flex: 0 0 auto; background: #fff; border-bottom: 1px solid var(--d-border); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .page-title { font-size: var(--font-size-title); font-weight: var(--font-weight-semibold); margin: 2px 0 0; }

  /* 开关 + 渠道多选 */
  .switch { position: relative; width: 40px; height: 20px; border-radius: 999px; background: #CBD5E3; transition: background var(--motion-fast); border: 0; }
  .switch.on { background: var(--d-primary); }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 999px; background: #fff; transition: left var(--motion-fast); }
  .switch.on::after { left: 22px; }
  .ch-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .ch-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--d-border); border-radius: var(--d-radius); font-size: var(--font-size-body-sm); }
  @media (max-width: 992px) { .sidebar { display: none; } .form-grid { grid-template-columns: 1fr; } .detail-grid { grid-template-columns: 1fr; } .ch-grid { grid-template-columns: repeat(2,1fr); } }
</style>
</head>
<body x-data="d09()" x-cloak @keydown.escape.window="esc()">

  <!-- ===== 浅色顶栏（已删除 AI助手/多平台/新功能·帮助）===== -->
  <header class="topbar">
    <div class="logo">PIM</div>
    <button type="button" class="top-tab" @click="toast('首页不属于本演示范围','info')">首页</button>
    <button type="button" class="top-tab active">退市管理<span class="x" title="关闭">✕</span></button>
    <div class="top-right">
      <select class="role-sel" x-model="role" @change="onRoleChange()" aria-label="演示角色">
        <option value="BRAND_ADMIN">品牌管理员</option>
        <option value="BRAND_OPERATOR">品牌业务</option>
        <option value="DISTRIBUTOR">经销商（无入口）</option>
      </select>
      <button type="button" class="top-icon" aria-label="通知" @click="toast('暂无新通知','info')">🔔<span class="badge-dot">12</span></button>
      <div class="avatar">演</div>
    </div>
  </header>

  <div class="shell-body">
    <!-- ===== 藏青图标侧栏 ===== -->
    <aside class="sidebar" aria-label="模块导航">
      <button class="side-item" @click="toast('首页不属于本演示范围','info')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>首页</button>
      <button class="side-item" @click="toast('商品管理为 D07，不属于本演示范围','info')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/></svg>商品</button>
      <button class="side-item" :class="page==='applyList'||page==='applyDetail'||page==='applyEdit' ? 'active' : ''" @click="go('applyList')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2l-4 4 4 4M2 6h13a7 7 0 017 7v3"/></svg>退市申请</button>
      <div class="side-gap"></div>
      <button class="side-item" :class="page==='executeList'||page==='skuDetail' ? 'active' : ''" @click="go('executeList')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-14 9V3z"/></svg>退市执行</button>
      <button class="side-item" :class="page==='settings' ? 'active' : ''" @click="go('settings')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 01-.1 1.2l2 1.6-2 3.4-2.4-.9a7 7 0 01-2 1.2L14 21h-4l-.5-2.5a7 7 0 01-2-1.2l-2.4.9-2-3.4 2-1.6A7 7 0 015 12a7 7 0 01.1-1.2l-2-1.6 2-3.4 2.4.9a7 7 0 012-1.2L10 3h4l.5 2.5a7 7 0 012 1.2l2.4-.9 2 3.4-2 1.6A7 7 0 0119 12z"/></svg>退市配置</button>
    </aside>

    <main class="main">
      <!-- 无权限提示（经销商角色） -->
      <template x-if="!canDelist">
        <div style="flex:1;display:flex;align-items:center;justify-content:center;background:#fff;margin:16px;border:1px solid var(--d-border);border-radius:6px;">
          <div style="text-align:center;color:var(--color-text-tertiary);">
            <div style="font-size:var(--font-size-body);color:var(--color-text-primary);">当前角色无退市管理入口</div>
            <div class="cell-sub" style="margin-top:6px;">经销商默认无入口，请切换演示角色为「品牌管理员 / 品牌业务」。</div>
          </div>
        </div>
      </template>

      <!-- ================= 退市申请列表 ================= -->
      <template x-if="canDelist && page==='applyList'">
        <div style="display:flex;flex-direction:column;flex:1;min-height:0;">
          <nav class="status-tabs" aria-label="按状态筛选">
            <template x-for="t in statusTabs" :key="t.key">
              <button type="button" class="status-tab" :class="filters.status===t.key ? 'active' : ''" @click="filters.status=t.key; page=1;">
                <span x-text="t.label"></span><span class="cnt num" x-text="t.count"></span>
              </button>
            </template>
            <!-- 展开/收起：仅作用于筛选区，不改变表格形态 -->
            <button type="button" class="collapse-link" @click="filterExpanded=!filterExpanded" x-text="filterExpanded ? '收起 ▴' : '展开 ▾'"></button>
          </nav>

          <div class="filterbar">
            <div class="frow">
              <label class="fselect">退市原因
                <select x-model="filters.reason"><option value="">全部</option>
                  <template x-for="r in REASONS" :key="r"><option :value="r" x-text="r"></option></template></select> ▾</label>
              <span class="kw-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                <input class="finput" type="text" x-model="filters.kw" placeholder="申请单号 / SKU / 申请人">
              </span>
              <button data-action="common.search" class="fbtn fbtn-reset" @click="search()">查询</button>
              <button data-action="common.reset" class="fbtn fbtn-reset" @click="resetFilter()">重置</button>
              <span style="margin-left:auto;display:flex;gap:12px;align-items:center;">
                <button class="flink" data-action="RefreshList" @click="refresh()">列表状态刷新</button>
                <button class="flink" data-action="SimulateLoadFailure" @click="search(true)">模拟加载失败</button>
              </span>
            </div>
            <!-- 展开态：更多筛选条件 -->
            <div class="frow" x-show="filterExpanded" x-cloak>
              <label class="fselect">提交时间起 <input type="date" x-model="filters.ds"></label>
              <label class="fselect">提交时间止 <input type="date" x-model="filters.de"></label>
              <label class="fselect">申请人
                <select x-model="filters.applicant"><option value="">全部</option><option>张晓峰</option><option>李婷</option><option>王浩</option></select> ▾</label>
              <button class="fbtn" @click="toast('排序：提交时间 降序（演示占位）','info')">排序：提交时间 ▾</button>
              <span class="sep"></span>
              <button class="fbtn" @click="toast('更多筛选为演示占位','info')">更多筛选 ▾</button>
              <button class="fbtn" @click="toast('常用筛选为演示占位','info')">常用筛选 ▾</button>
            </div>
          </div>

          <div class="toolbar">
            <button data-action="product.create" class="btn-primary" @click="openNew()">新建退市申请</button>
            <button class="tool-icon" :class="{spin: refreshing}" title="刷新" aria-label="刷新" @click="refresh()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
            </button>
            <div class="view-tabs" role="tablist" aria-label="视图切换">
              <button class="view-tab active">申请单</button>
              <button class="view-tab" @click="go('executeList')">执行记录</button>
            </div>
            <!-- 列筛选（图标 + 浮层复选框） -->
            <span class="more-wrap">
              <button class="tool-icon" :class="colOpen ? 'on' : ''" title="列筛选" aria-label="列筛选" @click="colOpen=!colOpen">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></svg>
              </button>
              <div class="col-panel" x-show="colOpen" x-cloak @click.outside="colOpen=false">
                <div class="ttl">列显示 <button @click="resetColumns()">重置</button></div>
                <template x-for="c in columns" :key="c.key">
                  <label><input type="checkbox" x-model="c.on" :disabled="c.key==='op'"><span x-text="c.label"></span></label>
                </template>
                <div class="acts">
                  <button @click="columns.forEach(c=>c.on=true); colOpen=false">全选</button>
                  <button @click="colOpen=false">完成</button>
                </div>
              </div>
            </span>
            <!-- 密度切换（紧凑/标准/宽松 三档循环） -->
            <button class="tool-icon" :class="density!=='default' ? 'on' : ''" :title="'密度：' + densityLabel()" :aria-label="'密度：' + densityLabel()" @click="cycleDensity()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
            </button>
            <!-- 全屏 -->
            <button class="tool-icon" title="全屏" aria-label="全屏" @click="toggleFullscreen()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M8 21H5a2 2 0 01-2-2v-3M16 21h3a2 2 0 012-2v-3"/></svg>
            </button>
          </div>

          <div class="table-card">
            <div class="table-wrap">
              <template x-if="loading">
                <div style="padding:16px;display:flex;flex-direction:column;gap:12px;" aria-busy="true">
                  <div class="skl" style="width:60%"></div><div class="skl" style="width:80%"></div><div class="skl" style="width:50%"></div><div class="skl" style="width:70%"></div>
                </div>
              </template>
              <template x-if="!loading && listError">
                <div class="empty">
                  <div style="color:var(--color-text-primary);">列表加载失败</div>
                  <div class="sub">无法获取退市申请数据，请检查网络后重试。</div>
                  <div style="margin-top:12px;"><button class="btn-primary" @click="search(false)">重试</button></div>
                </div>
              </template>
              <template x-if="!loading && !listError && filtered.length===0">
                <div class="empty">
                  <template x-if="isFilterEmpty()"><div>
                    <div>暂无退市申请单</div><div class="sub">可新建申请，发起后在此追踪审批与执行进度。</div>
                    <div style="margin-top:12px;"><button class="btn-primary" @click="openNew()">新建退市申请</button></div>
                  </div></template>
                  <template x-if="!isFilterEmpty()"><div>
                    <div>未找到符合条件的申请单</div><div class="sub">建议调整筛选条件后重新查询。</div>
                    <div style="margin-top:12px;"><button class="fbtn fbtn-reset" @click="resetFilter()">清空筛选</button></div>
                  </div></template>
                </div>
              </template>

              <!-- ===== 收起态：信息块表格 ===== -->
              <!-- 单一信息块表格（形态固定；列显隐由列筛选控制，密度由密度切换控制） -->
              <table x-show="!loading && !listError && filtered.length" :class="density">
                <thead><tr>
                  <th x-show="col('info')">申请信息</th><th x-show="col('reason')">退市原因</th><th x-show="col('lines')">关联明细</th><th x-show="col('time')">时间信息</th><th x-show="col('status')">状态 · 当前节点</th><th style="position:sticky;right:0;">操作</th>
                </tr></thead>
                <tbody>
                  <template x-for="row in paged" :key="row.id">
                    <tr>
                      <td x-show="col('info')">
                        <button class="cell-main mono" :aria-label="'详情 ' + row.formNo" @click="openDetail(row)" x-text="row.formNo"></button>
                        <div class="cell-sub">申请人：<span x-text="row.applicant"></span></div>
                      </td>
                      <td x-show="col('reason')"><div class="cell-strong" x-text="row.reason"></div><div class="cell-sub" x-text="row.note ? row.note.slice(0,18) + (row.note.length>18?'…':'') : '—'"></div></td>
                      <td x-show="col('lines')"><div class="cell-strong num" x-text="row.skuCount + ' SKU'"></div><div class="cell-sub" x-text="sourceLabel(row.source)"></div></td>
                      <td x-show="col('time')"><div class="cell-sub">提交 <span class="num" x-text="row.submittedAt"></span></div><div class="cell-sub">预计 <span class="num" x-text="row.planDate"></span></div></td>
                      <td x-show="col('status')"><span class="tag" :class="statusClass(row.status)" x-text="STATUS[row.status].label"></span><div class="cell-sub" x-text="row.node || '—'"></div></td>
                      <td style="position:sticky;right:0;background:inherit;min-width:88px;">
                        <button class="op-link" @click="openDetail(row)">详情</button>
                        <button class="op-link muted" @click="openFlow(row)">进度</button>
                        <button class="op-link" x-show="row.status==='REJECTED'" @click="openEdit(row)">编辑</button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <div class="pager">
              <span>共 <b class="num" style="color:var(--color-text-primary);" x-text="filtered.length"></b> 条</span>
              <button class="pg-btn" @click="page1=Math.max(1,page1-1)" aria-label="上一页">‹</button>
              <button class="pg-btn cur" x-text="page1"></button>
              <button class="pg-btn" @click="page1=Math.min(totalPages(),page1+1)" aria-label="下一页">›</button>
              <select x-model.number="pageSize"><option :value="10">10条/页</option><option :value="20">20条/页</option><option :value="50">50条/页</option></select>
              <span class="go">前往 <input type="text" x-model="goPage" @keydown.enter="jump()"> 页</span>
            </div>
          </div>
        </div>
      </template>

      <!-- ================= 申请单详情（独立页） ================= -->
      <template x-if="canDelist && page==='applyDetail' && currentForm">
        <div style="display:flex;flex-direction:column;flex:1;min-height:0;">
          <div class="page-head">
            <div>
              <div class="cell-sub">首页 / 退市管理 / 退市申请 / <b style="color:var(--color-text-primary);" x-text="currentForm.formNo"></b></div>
              <div style="display:flex;align-items:center;gap:10px;margin-top:2px;">
                <h1 class="page-title mono" x-text="currentForm.formNo"></h1>
                <span class="tag" :class="statusClass(currentForm.status)" x-text="STATUS[currentForm.status].label"></span>
              </div>
            </div>
            <div style="display:flex;gap:8px;">
              <button class="btn-plain" @click="go('applyList')">← 返回</button>
              <button class="btn-plain" @click="openFlow(currentForm)">进度</button>
            </div>
          </div>
          <div class="form-page">
            <div class="form-card">
              <div class="detail-grid">
                <div><div class="k">退市原因</div><div x-text="currentForm.reason"></div></div>
                <div><div class="k">预计退市</div><div class="num" x-text="currentForm.planDate"></div></div>
                <div><div class="k">申请人</div><div x-text="currentForm.applicant"></div></div>
                <div><div class="k">提交时间</div><div class="num" x-text="currentForm.submittedAt"></div></div>
                <div><div class="k">当前节点</div><div x-text="currentForm.node || '—'"></div></div>
                <div><div class="k">来源</div><div x-text="sourceLabel(currentForm.source)"></div></div>
                <div style="grid-column:1/-1;"><div class="k">补充说明</div><div x-text="currentForm.note || '—'"></div></div>
              </div>
              <h2 style="font-size:var(--font-size-body);font-weight:var(--font-weight-semibold);margin:8px 0 4px;">关联 SKU 明细</h2>
              <table class="lines-table">
                <thead><tr><th>SKU</th><th>名称</th><th>数量</th><th>当前状态</th></tr></thead>
                <tbody>
                  <template x-for="l in currentForm.lines" :key="l.sku">
                    <tr><td class="mono" x-text="l.sku"></td><td x-text="l.name"></td><td class="num" x-text="l.qty"></td><td x-text="l.status"></td></tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </template>

      <!-- ================= 新建 / 修改申请单 ================= -->
      <template x-if="canDelist && page==='applyEdit'">
        <div style="display:flex;flex-direction:column;flex:1;min-height:0;">
          <div class="page-head">
            <div>
              <div class="cell-sub">首页 / 退市管理 / 退市申请 / <b style="color:var(--color-text-primary);" x-text="editingFormId ? '修改退市申请' : '新建退市申请'"></b></div>
              <h1 class="page-title" x-text="editingFormId ? '修改退市申请' : '新建退市申请'"></h1>
            </div>
          </div>
          <div class="form-page">
            <div class="form-card">
              <h2>申请信息</h2>
              <div class="form-grid">
                <div class="form-item wide">
                  <label>关联 SKU <span class="req">*</span>（至少 1 个；按 SKU 勾选后，其所属 SPU 全部 SKU 纳入本单并自动过滤非已发布）</label>
                  <div style="display:flex;gap:8px;align-items:center;">
                    <button data-action="product.pick" class="btn-plain" @click="pickerOpen=true" x-text="form.lines.length ? '更换' : '选择商品'"></button>
                    <button class="btn-plain" @click="importOpen=true">批量导入</button>
                    <span style="font-size:var(--font-size-caption);color:var(--color-text-tertiary);" x-text="form.lines.length ? '已选 ' + form.lines.length + ' 个 SKU' : '尚未选择商品'"></span>
                  </div>
                  <table class="lines-table" x-show="form.lines.length">
                    <thead><tr><th>SKU</th><th>名称</th><th>当前状态</th><th>操作</th></tr></thead>
                    <tbody>
                      <template x-for="(l,i) in form.lines" :key="l.sku">
                        <tr><td class="mono" x-text="l.sku"></td><td x-text="l.name"></td><td x-text="l.status"></td>
                          <td><button class="op-link" style="display:inline;" @click="form.lines.splice(i,1)">移除</button></td></tr>
                      </template>
                    </tbody>
                  </table>
                  <div class="err" x-show="errs.lines" x-text="errs.lines"></div>
                </div>
                <div class="form-item" :class="hasErr('reason')">
                  <label>退市原因 <span class="req">*</span></label>
                  <select x-model="form.reason"><option value="">请选择</option>
                    <template x-for="r in REASONS" :key="r"><option :value="r" x-text="r"></option></template></select>
                  <div class="err" x-show="errs.reason" x-text="errs.reason"></div>
                </div>
                <div class="form-item" :class="hasErr('planDate')">
                  <label>预计退市时间 <span class="req">*</span></label>
                  <input type="date" x-model="form.planDate">
                  <div class="err" x-show="errs.planDate" x-text="errs.planDate"></div>
                </div>
                <div class="form-item wide" :class="hasErr('note')">
                  <label>补充说明 <span x-show="form.reason==='其他'" class="req">*</span><span style="font-weight:400;color:var(--color-text-tertiary);font-size:var(--font-size-caption);" x-text="'（' + (form.note||'').length + '/500）'"></span></label>
                  <textarea rows="3" maxlength="500" x-model="form.note" placeholder="选「其他」原因时必填说明"></textarea>
                  <div class="err" x-show="errs.note" x-text="errs.note"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="sticky-foot">
            <button class="btn-plain" @click="cancelEdit()">取消</button>
            <button class="btn-primary" :disabled="submitting" @click="submitForm()">
              <span x-show="!submitting">提交审批</span><span x-show="submitting">提交中…</span>
            </button>
          </div>
        </div>
      </template>

      <!-- ================= 退市执行 ================= -->
      <template x-if="canDelist && page==='executeList'">
        <div style="display:flex;flex-direction:column;flex:1;min-height:0;">
          <div class="page-head">
            <div>
              <div class="cell-sub">首页 / 退市管理 / <b style="color:var(--color-text-primary);">退市执行</b></div>
              <h1 class="page-title">退市执行</h1>
            </div>
          </div>
          <div class="filterbar">
            <div class="frow">
              <label class="fselect">商品状态
                <select x-model="filters.exec.status"><option value="">全部</option><option value="RETIRED">已退市</option><option value="REVIVAL_PENDING">复活中</option></select> ▾</label>
              <label class="fselect">退市原因
                <select x-model="filters.exec.reason"><option value="">全部</option>
                  <template x-for="r in REASONS" :key="r"><option :value="r" x-text="r"></option></template></select> ▾</label>
              <span class="kw-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                <input class="finput" type="text" x-model="filters.exec.kw" placeholder="申请单号 / SKU / 名称">
              </span>
              <button class="fbtn fbtn-reset" @click="execSearch()">查询</button>
              <button class="fbtn fbtn-reset" @click="filters.exec={status:'',reason:'',kw:''}; toast('筛选条件已重置','info')">重置</button>
            </div>

const STATUS = {
  DRAFT:{label:'草稿'}, PENDING:{label:'退市中'}, APPROVED:{label:'已通过'}, REJECTED:{label:'已驳回'}, CANCELLED:{label:'已撤销'}

      const codes=this.importText.split(/[\s,，;；]+/).filter(Boolean);

    },

      this.errs=e; return !Object.keys(e).length;
    },

    },
    openSkuDetail(row){ this.currentSku=row; this.page='skuDetail'; },
    sameFormSkuCount(){ const f=this.forms.find(x=>x.formNo===this.currentSku.formNo); return f ? f.skuCount : 1; },
