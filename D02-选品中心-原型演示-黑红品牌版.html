  transform: rotate(24deg);
}

.inspiration-visual::before {
  bottom: -42px;
  left: 10%;
  width: 54%;
  height: 130px;
}

.inspiration-visual::after {
  right: 4%;
  bottom: -55px;
  width: 50%;
  height: 118px;
  opacity: .45;
  transform: rotate(-18deg);
}

.inspiration-visual .visual-sun {
  position: absolute;
  top: 30px;
  right: 24%;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--visual-accent, var(--module-red));
}

.inspiration-visual .visual-word {
  position: relative;
  z-index: 2;
  border: 1px solid rgba(255,255,255,.7);
  border-radius: 4px;
  padding: 4px 8px;
  background: rgba(255,255,255,.72);
  color: var(--module-ink);

}

.inspiration-card__body {

}

.inspiration-card__body h3 {

}

.inspiration-card__body p {
  min-height: 42px;

  color: var(--module-gray-700);
  font-size: 12px;
}

.palette-strip {
  display: flex;
  gap: 4px;
  margin: 12px 0;
}

.palette-strip i {
  width: 24px;
  height: 18px;

  background: var(--color);
}

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  border-top: 1px solid var(--module-gray-200);
  padding-top: 12px;
}

.studio-layout {
  display: grid;
  grid-template-columns: 276px minmax(420px, 1fr) 366px;
  gap: 12px;
  min-height: calc(100vh - 164px);
}

.studio-panel {

  border: 1px solid var(--module-gray-200);
  border-radius: 8px;
  background: #fff;
}

.studio-panel__header {
  display: flex;

  justify-content: space-between;
  gap: 8px;
  border-bottom: 1px solid var(--module-gray-200);
  padding: 14px;
}

.studio-panel__header h2 {
  margin: 0;
  font-size: 15px;
}

.studio-panel__header p {
  margin: 2px 0 0;
  color: var(--module-gray-500);

.studio-scroll {

.source-preview {

    radial-gradient(circle at 70% 25%, #C8102E 0 11px, transparent 12px),

    linear-gradient(28deg, #dedbd0 0 37%, transparent 38%), #f8f4e9;
}

.studio-summary {

.summary-block {

.summary-block:last-child {

}

.summary-block span,
.summary-block strong,
.summary-block small {

.summary-block span {

}

.summary-block strong {

}

.summary-block small {
  color: var(--module-gray-700);

.studio-canvas {

.canvas-stage {

    linear-gradient(45deg, #f7f7f7 25%, transparent 25%),
    linear-gradient(-45deg, #f7f7f7 25%, transparent 25%),

.lighter-mockup::before {
  position: absolute;
  z-index: 5;

  right: 0;
  left: 0;
  height: 2px;
  background: #242424;
  content: "";
}

.lighter-mockup::after {
  position: absolute;
  z-index: 5;
  top: 112px;
  right: -9px;
  width: 16px;
  height: 42px;
  border: 2px solid #242424;
  border-radius: 4px;
  background: #bdbdb8;

}

.mock-art {

.mock-art .sun {

.mock-art .mountain {

.mock-art .mountain.second {
  right: -60px;

  transform: rotate(-26deg);
}

.mock-art .birds {
  position: absolute;

}

.studio-generating {

.studio-generating i {

}

@keyframes module-spin { to { transform: rotate(360deg); } }

.variant-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  border-top: 1px solid var(--module-gray-200);
  padding: 12px;
}

.variant-thumb {
  position: relative;
  height: 86px;
  overflow: hidden;
  border: 1px solid var(--module-gray-300);
  border-radius: 6px;
  background: var(--thumb-bg, #f2eee4);
}

.variant-thumb.selected {
  border: 2px solid var(--module-red);
}

.variant-thumb::before {
  position: absolute;
  right: 17px;
  bottom: -20px;
  width: 58px;
  height: 68px;
  border-radius: 50% 50% 4px 4px;
  background: var(--thumb-line, #2d2d2d);
  content: "";
  opacity: .72;
  transform: rotate(-26deg);
}

.variant-thumb::after {
  position: absolute;
  top: 17px;
  right: 22px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--module-red);
  content: "";
}

.variant-thumb span {
  position: absolute;
  z-index: 2;
  top: 4px;
  left: 5px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: rgba(255,255,255,.88);
  font-size: 11px;
  line-height: 18px;
  text-align: center;
}

.studio-form-section {
  margin-bottom: 16px;
  border-bottom: 1px solid var(--module-gray-200);
  padding-bottom: 16px;
}

.studio-form-section:last-child {

}

.studio-form-section h3 {
  margin: 0 0 4px;
  font-size: 14px;
}

.studio-form-section > p {
  margin: 0 0 10px;
  color: var(--module-gray-500);
  font-size: 11px;
}

.choice-stack {
  display: grid;
  gap: 6px;
}

.choice-item {
  position: relative;
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--module-gray-300);
  border-radius: 6px;
  padding: 9px;
  background: #fff;
  text-align: left;
}

.choice-item.selected {
  border-color: var(--module-red);

}

.choice-radio {

  border: 1px solid var(--module-gray-500);
  border-radius: 50%;
}

.choice-item.selected .choice-radio {
  border: 4px solid var(--module-red);
}

.choice-item strong,
.choice-item small {
  display: block;
}

.choice-item strong {
  font-size: 12px;
}

.choice-item small {
  color: var(--module-gray-500);
  font-size: 11px;
}

.studio-footer {
  display: grid;
  gap: 8px;
  border-top: 1px solid var(--module-gray-200);
  padding: 12px 14px;
}

.studio-footer .module-button {
  width: 100%;
}

.studio-footer small {
  color: var(--module-gray-500);
  font-size: 11px;
  text-align: center;
}

.studio-mode-bar {
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 10px;
  padding: 10px;
}

.design-source-switch {
  display: grid;

  grid-template-columns: repeat(3, minmax(180px, 1fr));
  gap: 6px;
}

.design-source-option {

.design-source-option > span {
  display: grid;

.design-source-option strong,
.design-source-option small {

.design-source-option strong {

}

.design-source-option small {
  color: var(--module-gray-500);
  font-size: 11px;
}

.design-source-option.active {
  border-color: var(--module-red);

.design-source-option.active > span {

.design-source-option:disabled {

.ai-assist-copy strong,
.ai-assist-copy small {

}

.ai-assist-copy strong {
  margin-top: 4px;

}

.ai-assist-copy small {
  color: var(--module-gray-500);

.permission-badge {

.ai-assist-control.off .tag {

.mandatory-check-note {

.mandatory-check-note > span {
  display: grid;

.mandatory-check-note strong,
.mandatory-check-note small {
  display: block;
}

.mandatory-check-note strong {
  font-size: 12px;
}

.mandatory-check-note small {
  color: var(--module-gray-500);
  font-size: 11px;

.upload-design-layout {

  gap: 12px;

.upload-file-panel,

.upload-dropzone strong,
.upload-dropzone small,

.upload-dropzone strong {
  color: var(--module-ink);

.upload-dropzone small {
  color: var(--module-gray-500);
  font-size: 11px;

.upload-dropzone em {
  width: max-content;

  background: var(--module-red);

.upload-guidance {

  font-size: 14px;
}

.dialog-section p {
  margin: 0 0 6px;

  font-size: 12px;
}

.prompt-block {
  width: 100%;
  min-height: 126px;
  border: 1px solid var(--module-gray-300);
  border-radius: 6px;
  padding: 10px;
  background: #fff;
  color: var(--module-ink);
  font: 12px/20px var(--font-family-mono);
  resize: vertical;
}

.module-toast {
  position: fixed;
  z-index: 100;
  right: 24px;
  bottom: 24px;
  display: flex;
  min-width: 280px;
  align-items: center;
  gap: 8px;
  border: 1px solid #cde5d7;
  border-radius: 8px;
  padding: 12px 14px;
  background: #fff;
  color: #1f5d3f;
  box-shadow: 0 8px 24px rgba(0,0,0,.12);
  opacity: 0;
  pointer-events: none;
  transform: translateY(12px);
  transition: 180ms ease;
}

.module-toast.visible {
  opacity: 1;
  transform: translateY(0);
}

.toast-icon {
  display: grid;
  width: 22px;
  height: 22px;
  place-items: center;
  border-radius: 50%;
  background: #26734d;
  color: #fff;
  font-size: 12px;
}

.skeleton-row {
  animation: skeleton-pulse 1s ease-in-out infinite alternate;
  background: linear-gradient(90deg, #f1f1f1, #fafafa, #f1f1f1);
}

@keyframes skeleton-pulse { to { opacity: .62; } }

@media (max-width: 1280px) {
  .module-shell { min-width: 1024px; }

  .module-page-shell { margin-left: 210px; }

  .studio-layout { grid-template-columns: 240px minmax(380px, 1fr) 326px; }

  .ai-assist-control { width: 246px; flex-basis: 246px; }

  .candidate-card { grid-template-columns: 42px minmax(0, 1.3fr) repeat(3, 100px) auto; }
}

@media (max-width: 1080px) {
  .module-sidebar { width: 188px; }
  .module-page-shell { margin-left: 188px; }

  .global-search { display: none; }

}

(function(){
  const seed = poolRows.slice();
  const pools = ['未选中','未选中','未选中','待定','官旗','经销商'];
  const names = ['星影鎏金','山河如画','都市几何','黑曜徽章','曜石龙纹','夜行者'];
  const sources = ['华东经销商','华南经销商','华西经销商','华北经销商'];
  while (poolRows.length < 120) {
    const i = poolRows.length;
    const s = seed[i % seed.length];
    const pool = pools[i % pools.length];
    const refs = pool === '官旗' ? ['官旗'] : pool === '经销商' ? ['经销商'] : (s.refs || []).slice();
    poolRows.push(Object.assign({}, s, {
      id: 'P' + String(i + 1).padStart(3, '0'),
      no: 'PW202608' + String(10 + (i % 18)).padStart(2, '0') + String(1000 + i),
      name: names[i % names.length] + '·' + (i + 1),
      pool: (pool === '官旗' || pool === '经销商') ? '未选中' : pool,
      refs: refs,
      source: sources[i % sources.length],
      org: sources[i % sources.length],
      material: 'LSD-' + String(4000 + i),
      sku: (i % 5 === 0) ? ('SKU-1000' + String(i).padStart(3, '0')) : '未创建',
      push: (i % 5 === 0) ? '推送成功' : '未推送',
      update: '2026-08-' + String(1 + (i % 27)).padStart(2, '0') + ' 10:30'
    }));
  }
})();
let poolPage=1, poolPageSize=20;
function poolPagerHtml(total){
  const pages=Math.max(1, Math.ceil(total/poolPageSize));
  if(poolPage>pages)poolPage=pages;
  return `<div class="pager" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <span>共 ${total} 条 · 第 ${poolPage}/${pages} 页</span>
    <div style="display:flex;align-items:center;gap:8px">
      <select class="control" style="width:auto;height:28px" onchange="poolPageSize=+this.value;poolPage=1;renderPool()">
        <option value="20"${poolPageSize===20?' selected':''}>20条/页</option>
        <option value="50"${poolPageSize===50?' selected':''}>50条/页</option>
        <option value="100"${poolPageSize===100?' selected':''}>100条/页</option>
      </select>
      <button class="btn small" ${poolPage<=1?'disabled':''} onclick="poolPage--;renderPool()">上一页</button>
      <button class="btn small" ${poolPage>=pages?'disabled':''} onclick="poolPage++;renderPool()">下一页</button>
    </div>
  </div>`;
}

let poolRole='npi',poolTab='未选中',poolQuery='';

function poolMatches(p,tab){return tab==='官旗'||tab==='经销商'?p.refs.includes(tab):p.pool===tab}

/div><div class="stat"><span>已创建主档</span><strong>${dataAll.filter(p=>p.sku!=='未创建').length}</strong></div></div><div class="table-card"><div class="table-head"><strong>${poolTab}商品池</strong><span>物理池：待定/未选中二选一 · 官旗/经销商为可并存引用</span></div><div class="table-wrap"><table><thead><tr><th>商品信息</th><th>PW 提报单号</th><th>物料编码</th><th>主档 SKU 编码</th><th>审批结论</th><th>加工工艺 / 机底</th><th>物理池 / 引用池</th><th>更新时间</th><th>操作</th></tr></thead><tbody>${data.map(p=>`<tr><td><div><strong>${p.name}</strong><span class="sub">${p.source} · ${p.type}</span></div></td><td><span class="link">${p.no}</span></td><td>${p.material}</td><td>${p.sku==='未创建'?'<span style="color:#aaa">未创建</span>':`<span class="link">${p.sku}</span>`}</td><td>${poolTag(p.approval)}</td><td>${p.process}<span class="sub">${p.base}</span></td><td>${poolTag(p.pool+'商品池')}${p.refs.length?`<span class="sub">引用：${p.refs.join('、')}商品池</span>`:''}</td><td>${p.update}</td><td><button class="btn small" onclick="openPoolDetail('${p.id}')">详情</button>${poolRole==='npi'&&p.pool==='未选中'?`<button class="btn small" style="margin-left:6px" onclick="movePool('${p.id}','官旗')">增加官旗引用</button><button class="btn small" style="margin-left:6px" onclick="movePool('${p.id}','经销商')">增加经销商引用</button>`:''}${poolRole==='pw'&&p.pool==='待定'?`<button class="btn small primary" style="margin-left:6px" onclick="restorePendingPool('${p.id}')">恢复至未选池</button>`:''}${poolRole==='npi'?`<button class="btn small" style="margin-left:6px" onclick="pushPoolMaster('${p.id}')">推至主档</button>`:''}${(poolRole==='flagship'||poolRole==='dealer')?`<button class="btn small primary" style="margin-left:6px" onclick="openPoolFeedback('${p.id}')">反馈</button>`:''}</td></tr>`).join('')||'<tr><td colspan="9" style="text-align:center;padding:60px;color:#888">当前视角暂无商品</td></tr>'}</tbody></table></div>${poolPagerHtml(dataAll.length)}</div>`}

/* Spec §2.3 pager */
let pwPage=1, pwPageSize=20, pwFiltered=null;
function pwPagerHtml(total){
  const pages=Math.max(1, Math.ceil(total/pwPageSize));
  if(pwPage>pages)pwPage=pages;
  return `<div class="pager" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <span>共 ${total} 条 · 第 ${pwPage}/${pages} 页</span>
    <div style="display:flex;align-items:center;gap:8px">
      <label style="font-size:12px;color:var(--muted)">每页
        <select class="control" style="width:auto;height:28px;display:inline-block" onchange="pwChangePageSize(+this.value)">
          <option value="20"${pwPageSize===20?' selected':''}>20条/页</option>
          <option value="50"${pwPageSize===50?' selected':''}>50条/页</option>
          <option value="100"${pwPageSize===100?' selected':''}>100条/页</option>
        </select> 条
      </label>
      <button class="btn small" ${pwPage<=1?'disabled':''} onclick="pwGotoPage(${pwPage-1})">上一页</button>
      <button class="btn small" ${pwPage>=pages?'disabled':''} onclick="pwGotoPage(${pwPage+1})">下一页</button>
    </div>
  </div>`;
}
function pwChangePageSize(n){pwPageSize=n;pwPage=1;pwRefreshList();}
function pwGotoPage(p){pwPage=p;pwRefreshList();}
function pwRefreshList(){
  const all=pwFiltered||rows;
  const start=(pwPage-1)*pwPageSize;
  const slice=all.slice(start,start+pwPageSize);
  const pager=document.querySelector('#pw-app-content .pager');
  fillRows(slice);
  if(pager)pager.outerHTML=pwPagerHtml(all.length);
  else{
    const card=document.querySelector('#pw-app-content .table-card');
    if(card)card.insertAdjacentHTML('beforeend',pwPagerHtml(all.length));
  }
}

    });

  function handleTabs(button) {
    const container = button.closest(".page-tabs");
    if (!container) return;
    container.querySelectorAll("button").forEach((item) => item.classList.toggle("active", item === button));
    if (button.dataset.tableFilter) {
      document.querySelectorAll(".topic-table tbody tr").forEach((row) => {
        row.hidden = button.dataset.tableFilter !== "all" && row.dataset.kind !== button.dataset.tableFilter;
      });
    }
    if (button.dataset.cardFilter) {
      document.querySelectorAll("[data-inspiration-state]").forEach((card) => {
        card.hidden = button.dataset.cardFilter !== "all" && card.dataset.inspirationState !== button.dataset.cardFilter;
      });
    }
    if (button.dataset.studioSide) {
      state.studio.side = button.dataset.studioSide;
      const side = document.querySelector("#studio-canvas-side");
      if (side) side.textContent = state.studio.side;
    }
    if (button.dataset.platformBoard) {
      document.querySelectorAll("[data-platform-panel]").forEach((panel) => {
        panel.hidden = panel.dataset.platformPanel !== button.dataset.platformBoard;
      });
    }
    if (button.dataset.collectionSection) {
      document.querySelectorAll("[data-collection-panel]").forEach((panel) => {
        panel.hidden = panel.dataset.collectionPanel !== button.dataset.collectionSection;
      });
    }
    if (button.dataset.resultFilter) {
      document.querySelectorAll("[data-collection-status]").forEach((row) => {
        row.hidden = button.dataset.resultFilter !== "all" && row.dataset.collectionStatus !== button.dataset.resultFilter;
      });
    }
    if (button.dataset.previewMode) {
      state.uploadPreviewMode = button.dataset.previewMode;
      syncUploadPreviewMode();
      showToast(state.uploadPreviewMode === "3d" ? "已切换到 3D 模型效果预览" : "已切换到 2D 平面检查视图");
    }
  }

  function handleChoice(button) {
    const group = button.dataset.choice;
    document.querySelectorAll(`[data-choice="${group}"]`).forEach((item) => item.classList.toggle("selected", item === button));
    state.studio[group] = button.dataset.value;
    const art = document.querySelector("#studio-art");
    if (art && group === "craft") {
      if (button.dataset.value === "镭射倾向") {
        art.style.setProperty("--art-bg", "#d4d4d1");
        art.style.setProperty("--art-accent", "#5b5b5b");
        art.style.setProperty("--art-line", "#1f1f1f");
      } else {
        art.style.removeProperty("--art-bg");
        art.style.removeProperty("--art-accent");
        art.style.removeProperty("--art-line");
      }
    }
  }

  function updateUploadTransform() {
    const image = document.querySelector("#uploaded-design-image");
    if (!image) return;
    image.style.setProperty("--scale", state.uploadTransform.scale);
    image.style.setProperty("--rotate", `${state.uploadTransform.rotate}deg`);
  }

  function processDesignFile(file) {
    if (!file) return;
    const allowed = ["png", "jpg", "jpeg", "pdf", "ai", "psd"];
    const extension = file.name.split(".").pop().toLowerCase();
    if (!allowed.includes(extension)) {
      showToast("暂不支持该格式；请上传 PNG、JPG、AI、PSD 或 PDF");
      return;
    }

    state.uploadedFile = file;
    state.uploadPreviewAvailable = ["png", "jpg", "jpeg"].includes(extension);
    state.uploadTransform = { scale: 1, rotate: 0 };
    const title = document.querySelector("#upload-file-title");
    const help = document.querySelector("#upload-file-help");
    const audit = document.querySelector("#upload-file-audit");
    const actions = document.querySelector("#upload-file-actions");
    const addPreview = document.querySelector("#add-preview-action");
    const previewState = document.querySelector("#upload-preview-state");
    const empty = document.querySelector("#upload-empty-preview");
    const image = document.querySelector("#uploaded-design-image");
    const areaMessage = document.querySelector("#design-area-message");
    const nameInput = document.querySelector("#upload-design-name");
    if (title) title.textContent = file.name;
    if (help) help.textContent = `${(file.size / 1024 / 1024).toFixed(2)} MB · ${extension.toUpperCase()} · 点击可替换`;
    if (audit) audit.hidden = false;
    if (actions) actions.hidden = false;
    if (addPreview) addPreview.hidden = state.uploadPreviewAvailable;
    if (nameInput && nameInput.value === "我的原创设计") nameInput.value = file.name.replace(/\.[^.]+$/, "");

    if (state.uploadPreviewAvailable) {
      if (previewState) previewState.innerHTML = `<span class="data-tag complete">可以直接预览</span>`;
      state.uploadPreviewFile = file;
      if (areaMessage) areaMessage.textContent = "预览图已载入；当前未超出示例设计区域，仍需生产模板做最终校验。";
      const reader = new FileReader();
      reader.addEventListener("load", () => {
        if (!image) return;
        state.uploadPreviewUrl = String(reader.result);
        image.src = state.uploadPreviewUrl;
        image.hidden = false;
        if (empty) empty.hidden = true;
        updateUploadTransform();
      });
      reader.readAsDataURL(file);
    } else {
      state.uploadPreviewFile = null;
      state.uploadPreviewUrl = null;
      if (previewState) previewState.innerHTML = `<span class="data-tag partial">需补 PNG / JPG 预览图</span>`;
      if (image) { image.hidden = true; image.removeAttribute("src"); }
      if (empty) {
        empty.hidden = false;
        empty.innerHTML = `<span>▣</span><strong>${extension.toUpperCase()} 源文件已选择</strong><small>网页不直接编辑该格式，请补一张 PNG 或 JPG 预览图后进入工艺匹配</small>`;
      }
      if (areaMessage) areaMessage.textContent = "源文件无法在线预览，暂不能检查设计区域；请替换为或补充 PNG / JPG 预览图。";
    }
    showToast(state.uploadPreviewAvailable ? "设计稿已载入，可以调整摆放" : "生产源文件已选择，请补 PNG 或 JPG 预览图");
  }

  function processPreviewFile(file) {
    if (!file) return;
    const extension = file.name.split(".").pop().toLowerCase();
    if (!["png", "jpg", "jpeg"].includes(extension)) { showToast("预览图仅支持 PNG 或 JPG"); return; }
    state.uploadPreviewFile = file;
    state.uploadPreviewAvailable = true;
    const reader = new FileReader();
    reader.addEventListener("load", () => {
      state.uploadPreviewUrl = String(reader.result);
      const image = document.querySelector("#uploaded-design-image");
      const empty = document.querySelector("#upload-empty-preview");
      if (image) { image.src = state.uploadPreviewUrl; image.hidden = false; }
      if (empty) empty.hidden = true;
      updateUploadTransform();
    });
    reader.readAsDataURL(file);
    const previewState = document.querySelector("#upload-preview-state");
    const addPreview = document.querySelector("#add-preview-action");
    const areaMessage = document.querySelector("#design-area-message");
    if (previewState) previewState.innerHTML = `<span class="data-tag complete">已补充 ${safeText(file.name)}</span>`;
    if (addPreview) addPreview.hidden = true;
    if (areaMessage) areaMessage.textContent = "预览图已载入；当前未超出示例设计区域，仍需生产模板做最终校验。";
    showToast("预览图已补充，生产源文件仍保持不变");
  }

  function removeDesignFile() {
    state.uploadedFile = null;
    state.uploadPreviewFile = null;
    state.uploadPreviewUrl = null;
    state.uploadPreviewAvailable = false;
    state.uploadTransform = { scale: 1, rotate: 0 };
    const input = document.querySelector("#design-file-input");
    const previewInput = document.querySelector("#design-preview-input");
    const image = document.querySelector("#uploaded-design-image");
    const empty = document.querySelector("#upload-empty-preview");
    if (input) input.value = "";
    if (previewInput) previewInput.value = "";
    if (image) { image.hidden = true; image.removeAttribute("src"); }
    if (empty) { empty.hidden = false; empty.innerHTML = `<span>◇</span><strong>上传 PNG 或 JPG 后显示预览</strong><small>源文件会作为附件保留</small>`; }
    const title = document.querySelector("#upload-file-title");
    const help = document.querySelector("#upload-file-help");
    if (title) title.textContent = "点击或拖入设计稿";
    if (help) help.textContent = "PNG、JPG 可直接预览；AI、PSD、PDF 作为生产源文件保存";
    const audit = document.querySelector("#upload-file-audit");
    const actions = document.querySelector("#upload-file-actions");
    if (audit) audit.hidden = true;
    if (actions) actions.hidden = true;
    showToast("已移除设计文件，草稿中的其他信息已保留");
  }

  function adjustPlacement(value) {
    if (!state.uploadPreviewAvailable) {
      showToast("请先上传可预览的 PNG 或 JPG 设计稿");
      return;
    }
    if (value === "放大") state.uploadTransform.scale = Math.min(1.8, state.uploadTransform.scale + 0.1);
    if (value === "缩小") state.uploadTransform.scale = Math.max(0.5, state.uploadTransform.scale - 0.1);
    if (value === "左转") state.uploadTransform.rotate -= 5;
    if (value === "右转") state.uploadTransform.rotate += 5;
    if (value === "恢复" || value === "居中") state.uploadTransform = { scale: 1, rotate: 0 };
    updateUploadTransform();
    showToast(`已${value}设计稿；原始文件未被修改`);
  }

  function rotateUploadModel(direction) {
    if (direction === "left") state.uploadModelAngle = Math.max(-42, state.uploadModelAngle - 8);
    if (direction === "right") state.uploadModelAngle = Math.min(42, state.uploadModelAngle + 8);
    if (direction === "reset") state.uploadModelAngle = 0;
    syncUploadPreviewMode();
  }

      case "manual-refresh": {

      }
      case "view-topic": topicDialog(target.dataset.id); break;
      case "view-inspiration": inspirationDialog(target.dataset.id); break;

    if (tabTarget) {
      handleTabs(tabTarget);

      handleChoice(choiceTarget);

      const total = ranges.reduce((sum, input) => sum + Number(input.value), 0);

      if (totalNode) totalNode.textContent = String(total);
      const score = document.querySelector("#strategy-preview-score");
      if (score) score.textContent = String(Math.max(64, Math.min(96, 89 + Math.round((total - 100) / 5))));

      state.studio.model = event.target.value;
      const labels = { "205": "205｜磨砂铬色", "207": "207｜街铬", "250": "250｜镜面铬色" };
      const model = document.querySelector("#studio-canvas-model");
      if (model) model.textContent = labels[state.studio.model];
    }
    if (event.target.id === "expert-edit") {
      const prompt = document.querySelector("#creative-prompt");
      if (prompt) {
        prompt.readOnly = !event.target.checked;
        if (event.target.checked) showToast("已进入专业编辑；产品和安全限制仍不可修改");
      }
    }
  });

  document.addEventListener("dragover", (event) => {
    const dropzone = event.target.closest?.("#upload-dropzone");
    if (!dropzone) return;
    event.preventDefault();
    dropzone.classList.add("dragging");
  });

  document.addEventListener("dragleave", (event) => {
    const dropzone = event.target.closest?.("#upload-dropzone");
    if (dropzone) dropzone.classList.remove("dragging");
  });

  document.addEventListener("drop", (event) => {
    const dropzone = event.target.closest?.("#upload-dropzone");
    if (!dropzone) return;
    event.preventDefault();
    dropzone.classList.remove("dragging");
    processDesignFile(event.dataTransfer?.files?.[0]);
  });

  if (globalSearch) globalSearch.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && globalSearch.value.trim()) {
      const keyword = safeText(globalSearch.value.trim());
      openDialog({ eyebrow: "全局搜索", title: `“${keyword}”的搜索结果`, body: `<div class="audit-list"><div class="audit-row"><span>热点</span><strong>2 个相关结果</strong></div><div class="audit-row"><span>灵感卡</span><strong>1 张相关灵感</strong></div><div class="audit-row"><span>设计包</span><strong>0 个结果</strong></div></div><p style="margin:14px 0 0;color:#8a8a8a;font-size:12px">原型仅展示搜索交互，结果为示例。</p>` });
    }
  });

  document.addEventListener("keydown", (event) => {
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
      event.preventDefault();
      if (globalSearch) globalSearch.focus();
    }
    if (event.key === "Escape") closeDialog();
  });

  dialog.addEventListener("click", (event) => {
    if (event.target === dialog) closeDialog();
  });

  window.addEventListener("hashchange", () => { const h = window.location.hash.slice(1); if (h.startsWith("insight/")) render(h.slice(8)); });
  window.__insightGo = go;
}());

</script>
  <script>

(function () {
  const tabs = [];
  let activeTabId = "pw-list";
  const pwPanel = document.getElementById("pw-panel");
  const insightPanel = document.getElementById("insight-panel");
  const tabBar = document.getElementById("open-tabs");
  const sidebar = document.getElementById("d02-sidebar");
  const crumb = document.getElementById("pw-breadcrumb");

  const PW_LABEL = { list: "PW 经销商提报", approval: "审批工作台", pool: "商品池协同" };

  function renderTabs() {
    tabBar.innerHTML = tabs.map((t) =>
      `<button type="button" class="open-tab ${t.id === activeTabId ? "active" : ""}" data-tab-id="${t.id}">
        <span>${t.label}</span>
        <span class="tab-close" data-close-tab="${t.id}" title="关闭">✕</span>
      </button>`
    ).join("");
  }

  function syncSidebar(module, insightRoute, pwView) {
    sidebar.querySelectorAll(".proto-nav-item[data-shell-route]").forEach((btn) => {
      let on = false;
      if (module === "pw" && btn.dataset.shellRoute === "pw") {
        const v = btn.dataset.pwView || "list";
        on = v === (pwView || "list");
      }
      if (module === "insight" && btn.dataset.insightRoute === insightRoute) on = true;
      btn.classList.toggle("active", on);
    });
  }

  function showModule(module, insightRoute, pwView) {
    pwPanel.classList.toggle("active", module === "pw");
    insightPanel.classList.toggle("active", module === "insight");
    if (module === "pw") {
      document.title = (PW_LABEL[pwView] || "PW 经销商提报") + "｜选品中心";
      if (window.location.hash.indexOf("insight/") === 1) {
        history.replaceState(null, "", location.pathname + location.search);
      }
      if (typeof currentView !== "undefined") currentView = pwView || "list";
      if (crumb) {
        const title = PW_LABEL[pwView || "list"] || "PW 经销商提报";
        crumb.innerHTML = `选品中心 <b>/</b> <strong>${title}</strong>`;
      }
      if (typeof render === "function") render();
    } else {
      const route = insightRoute || "dashboard";
      if (typeof window.__insightGo === "function") window.__insightGo(route);
    }
  }

  function openTab(id, label, module, insightRoute, pwView) {
    let tab = tabs.find((t) => t.id === id);
    if (!tab) {
      tab = { id, label, module, insightRoute, pwView };
      tabs.push(tab);
    } else {
      tab.label = label;
      tab.pwView = pwView;
      tab.insightRoute = insightRoute;
    }
    activeTabId = id;
    renderTabs();
    showModule(module, insightRoute, pwView);
    syncSidebar(module, insightRoute, pwView);
  }

  function closeTab(id) {
    if (tabs.length <= 1) return;
    const idx = tabs.findIndex((t) => t.id === id);
    if (idx < 0) return;
    tabs.splice(idx, 1);
    if (activeTabId === id) {
      const next = tabs[Math.max(0, idx - 1)];
      activeTabId = next.id;
      showModule(next.module, next.insightRoute, next.pwView);
      syncSidebar(next.module, next.insightRoute, next.pwView);
    }
    renderTabs();
  }

  sidebar.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-shell-route]");
    if (!btn) return;
    if (btn.dataset.shellRoute === "pw") {
      if (btn.dataset.pwToast) {
        if (typeof showToast === "function") showToast(btn.dataset.pwToast);
        return;
      }
      const view = btn.dataset.pwView || "list";
      const id = view === "list" ? "pw-list" : "pw-" + view;
      openTab(id, PW_LABEL[view] || btn.querySelector("span:nth-child(2)").textContent.trim(), "pw", null, view);
    } else {
      const route = btn.dataset.insightRoute || "dashboard";
      const label = (btn.querySelector("span:nth-child(2)") || btn).textContent.trim();
      openTab("insight-" + route, label, "insight", route, null);
    }
  });

  tabBar.addEventListener("click", (e) => {
    const closeEl = e.target.closest("[data-close-tab]");
    if (closeEl) { e.stopPropagation(); closeTab(closeEl.dataset.closeTab); return; }
    const tabBtn = e.target.closest("[data-tab-id]");
    if (!tabBtn) return;
    const tab = tabs.find((t) => t.id === tabBtn.dataset.tabId);
    if (tab) openTab(tab.id, tab.label, tab.module, tab.insightRoute, tab.pwView);
  });

  window.D02Shell = {
    syncInsightTab(label) {
      const tab = tabs.find((t) => t.id === activeTabId);
      if (tab && tab.module === "insight") { tab.label = label; renderTabs(); }
      document.title = label + "｜选品中心";
    },
    openPwTab(id, label, view) {
      openTab(id, label, "pw", null, view);
    }
  };

  // Bridge help/notifications for header
  document.getElementById("d02-help")?.addEventListener("click", () => {
    document.dispatchEvent(new MouseEvent("click", { bubbles: true }));
    const fake = document.createElement("button");
    fake.setAttribute("data-action", "help");
    fake.style.display = "none";
    document.body.appendChild(fake);
    fake.click();
    fake.remove();
  });
  document.getElementById("d02-bell")?.addEventListener("click", () => {
    const fake = document.createElement("button");
    fake.setAttribute("data-action", "notifications");
    fake.style.display = "none";
    document.body.appendChild(fake);
    fake.click();
    fake.remove();
  });

  
document.getElementById('d02-role')?.addEventListener('change', function(){
  const v=this.value;
  if(v==='npi'||v==='dealer'||v==='pw'){ if(typeof changePoolRole==='function') changePoolRole(v); }
  if(typeof showToast==='function') showToast('已切换角色演示：'+this.options[this.selectedIndex].text);
});

  openTab("pw-list", "PW 经销商提报", "pw", null, "list");
})();

  </script>

<script>
/* ZIPPO_GLOBAL_SHELL_V2 */
(function(){
  if(window.__zippoShellV2) return;
  window.__zippoShellV2 = 1;
  document.querySelectorAll('.card').forEach(function(card){
    if(card.querySelector('.table-wrap table')) card.classList.add('has-table');
  });
  document.querySelectorAll('.pager, .pagination').forEach(function(p){
    p.classList.add('zippo-pager-sticky');
  });
  function wrapAvatar(el){
    if(!el || el.closest('.zippo-user-menu')) return;
    var wrap = document.createElement('div');
    wrap.className = 'zippo-user-menu';
    var panel = document.createElement('div');
    panel.className = 'zippo-user-menu-panel';
    panel.innerHTML = '<button type="button" data-act="profile">个人中心</button><button type="button" data-act="logout">退出登录</button>';
    el.parentNode.insertBefore(wrap, el);
    wrap.appendChild(el);
    wrap.appendChild(panel);
    el.style.cursor = 'pointer';
    el.addEventListener('click', function(e){ e.stopPropagation(); wrap.classList.toggle('open'); });
    panel.querySelector('[data-act=profile]').onclick = function(){
      wrap.classList.remove('open');
      var t=document.getElementById('toast'); if(t){t.textContent='个人中心';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);} else alert('个人中心');
    };
    panel.querySelector('[data-act=logout]').onclick = function(){
      wrap.classList.remove('open');
      var t=document.getElementById('toast'); if(t){t.textContent='已退出登录';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);} else alert('已退出登录');
    };
    document.addEventListener('click', function(){ wrap.classList.remove('open'); });
  }
  document.querySelectorAll('[aria-label="账号"], [title="管理员"], .d05-avatar, .d03-avatar, .zippo-avatar-trigger').forEach(wrapAvatar);
  document.querySelectorAll('.top-right span[title], .global-topbar .top-right > span[style*="border-radius:50%"]').forEach(function(el){
    if(el.textContent && el.textContent.length<=2) wrapAvatar(el);
  });
  document.querySelectorAll('.w-8.h-8.rounded-full, .rounded-full.bg-primary').forEach(function(el){
    if(el.closest('header') && !el.closest('.zippo-user-menu')) wrapAvatar(el);
  });
})();
</script>
