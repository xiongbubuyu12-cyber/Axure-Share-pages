<html lang="zh-CN">
<head>

  <title>D02 选品中心 · 黑红品牌版原型</title>
  <style>

:root {
  --color-primary: #C8102E;
  --color-primary-hover: #A00D25;
  --color-primary-active: #7A0A1C;
  --color-primary-bg: #FDE8EC;
  --color-success: #2F6B3A;
  --color-success-bg: #EAF5EC;
  --color-warning: #8A6A1A;
  --color-warning-bg: #F7F1DE;
  --color-danger: #DC2626;
  --color-danger-bg: #FEF2F2;
  --color-ink: #0A0A0A;
  --color-ink-secondary: #4A4A4A;
  --color-ink-tertiary: #8A8A8A;
  --color-ink-disabled: #B8B8B8;
  --color-line: #D4D4D4;
  --color-line-soft: #EBEBEB;
  --color-bg-page: #EDEDED;
  --color-bg-fill: #F7F7F7;
  --color-brand-black: #0A0A0A;
  --color-brand-white: #FFFFFF;
  --shadow-1: 0 1px 2px rgba(0,0,0,.06), 0 1px 4px rgba(0,0,0,.04);
  --shadow-2: 0 4px 12px rgba(0,0,0,.08);
  --shadow-focus: 0 0 0 2px rgba(200,16,46,.25);
  --header-h: 56px;
  --proto-nav-w: 240px;
  --ink: #0A0A0A;
  --muted: #8A8A8A;
  --line: #EBEBEB;
  --danger: #C8102E;
  --danger-soft: #FDE8EC;
  --success: #2F6B3A;
  --success-soft: #EAF5EC;
  --warn: #8A6A1A;
  --warn-soft: #F7F1DE;
  --shadow: 0 4px 12px rgba(0,0,0,.08);
  --brand-red-5: #C8102E;
  --brand-red-6: #C8102E;
  --brand-red-7: #A00D25;
  --brand-red-1: #FDE8EC;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--color-bg-page); color: var(--color-ink); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; font-size: 14px; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: none; box-shadow: var(--shadow-focus); }
.brand-stripe { height: 4px; background: linear-gradient(90deg, var(--color-brand-black) 0 72%, var(--color-primary) 72% 100%); }
.d02-app-shell { display: flex; height: calc(100vh - var(--header-h) - 4px); overflow: hidden; }
.proto-sidebar { width: var(--proto-nav-w); background: #0A0A0A; border-right: 0; flex-shrink: 0; overflow-y: auto; color: #cfcfcf; }
.proto-nav-group { padding: 8px 12px 4px; font-size: 11px; font-weight: 600; color: #8f8f8f; letter-spacing: .04em; }
.proto-nav-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 8px 12px; min-height: 40px; border-radius: 4px; font-size: 13px; color: #cfcfcf; transition: background .15s, color .15s; border: 0; background: transparent; border-left: 3px solid transparent; }
.proto-nav-item:hover { background: #2d2d2d; color: #fff; }
.proto-nav-item.active { background: #2d2d2d; color: #fff; font-weight: 600; border-left-color: var(--color-primary); }
.proto-nav-item .ui-icon { width: 18px; text-align: center; opacity: .75; font-style: normal; flex-shrink: 0; }
.proto-nav-item em.nav-count { margin-left: auto; font-style: normal; font-size: 11px; padding: 1px 6px; border-radius: 10px; background: #434343; color: #fff; }
.proto-nav-item.active em.nav-count { background: #C8102E; color: #fff; }
.open-tab { display: inline-flex; align-items: center; gap: 6px; max-width: 180px; padding: 6px 10px; font-size: 13px; border-radius: 4px; color: rgba(255,255,255,.72); white-space: nowrap; border: 0; background: transparent; border-bottom: 2px solid transparent; }
.open-tab:hover { color: #fff; background: rgba(255,255,255,.08); }
.open-tab.active { color: #fff; font-weight: 600; border-bottom-color: var(--color-primary); background: rgba(200,16,46,.18); }
.open-tab .tab-close { opacity: .55; font-size: 12px; padding: 2px 4px; border-radius: 3px; border: 0; background: transparent; color: inherit; }
.open-tab .tab-close:hover { opacity: 1; background: rgba(255,255,255,.15); }
.d02-header { height: var(--header-h); background: var(--color-brand-black); color: #fff; position: sticky; top: 0; z-index: 50; }
.d02-header-inner { display: flex; align-items: center; height: 100%; padding: 0 16px 0 24px; gap: 12px; }
.d02-logo { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.d02-logo-mark { width: 32px; height: 32px; border-radius: 4px; background: var(--color-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
.d02-logo-text { font-size: 15px; font-weight: 700; letter-spacing: .04em; }
.d02-header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.d02-icon-btn { width: 32px; height: 32px; border: 0; border-radius: 4px; background: transparent; color: rgba(255,255,255,.7); }
.d02-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--color-primary); color: #fff; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.d02-role { border: 1px solid rgba(255,255,255,.2); border-radius: 6px; padding: 4px 8px; font-size: 12px; background: rgba(0,0,0,.4); color: #fff; max-width: 130px; }

:root{--ink:#0A0A0A;--muted:#737373;--line:#e6e6e6;--soft:#f6f6f6;--panel:#fff;--danger:#C8102E;--danger-soft:#FDE8EC;--success:#2F6B3A;--success-soft:#EAF5EC;--warn:#9a5a00;--warn-soft:#fff7e6;--shadow:0 14px 38px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
#pw-panel .nav-label, #pw-root .nav-label{font-size:11px;color:#8f8f8f;padding:0 12px 10px}
#pw-panel .avatar, #pw-root .avatar{display:inline-flex;width:28px;height:28px;border-radius:50%;background:#fff;color:#222;align-items:center;justify-content:center;font-weight:700;margin-right:8px}
#pw-panel .content, #pw-root .content{padding:26px 30px 50px;max-width:1600px;margin:auto}
#pw-panel .page-title, #pw-root .page-title{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px}
#pw-panel .page-title h1, #pw-root .page-title h1{font-size:25px;margin:0 0 7px;letter-spacing:-.4px}
#pw-panel .page-title p, #pw-root .page-title p{margin:0;color:var(--muted)}
#pw-panel .actions, #pw-root .actions{display:flex;gap:10px}
#pw-panel .btn, #pw-root .btn{border:1px solid #cfcfcf;background:#fff;color:#333;border-radius:5px;height:36px;padding:0 15px}
#pw-panel .btn:hover, #pw-root .btn:hover{border-color:#9d9d9d}
#pw-panel .btn.primary, #pw-root .btn.primary{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
#pw-panel .btn.primary:hover, #pw-root .btn.primary:hover{background:#a80d27}
#pw-panel .btn.ghost, #pw-root .btn.ghost{border-color:transparent;background:transparent}
#pw-panel .btn.danger, #pw-root .btn.danger{color:var(--danger);border-color:#e3b0b8;background:#fff7f8}
#pw-panel .btn.small, #pw-root .btn.small{height:30px;padding:0 10px;font-size:12px}
#pw-panel .filter, #pw-root .filter{background:#fff;border:1px solid var(--line);border-radius:7px;padding:18px 20px 15px;box-shadow:0 2px 8px rgba(0,0,0,.025)}
#pw-panel .filter-grid, #pw-root .filter-grid{display:grid;grid-template-columns:1.5fr 1.5fr 1.2fr auto;gap:15px;align-items:end}
#pw-panel .field label, #pw-root .field label{display:block;font-size:12px;color:#555;margin-bottom:7px}
#pw-panel .required:after, #pw-root .required:after{content:' *';color:var(--danger)}
#pw-panel .control, #pw-root .control{width:100%;height:36px;border:1px solid #d8d8d8;border-radius:5px;padding:0 11px;outline:none;background:#fff;color:#333}
#pw-panel .control:focus, #pw-root .control:focus{border-color:var(--danger);box-shadow:0 0 0 2px rgba(200,16,46,.12)}
#pw-panel .filter-actions, #pw-root .filter-actions{display:flex;gap:8px}
#pw-panel .stats, #pw-root .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
#pw-panel .stat, #pw-root .stat{background:#fff;border:1px solid var(--line);border-radius:7px;padding:18px 20px;position:relative;overflow:hidden}
#pw-panel .stat:after, #pw-root .stat:after{content:'';position:absolute;right:0;top:0;width:4px;height:100%;background:var(--danger)}
#pw-panel .stat:nth-child(2):after, #pw-root .stat:nth-child(2):after{background:#222}
#pw-panel .stat:nth-child(3):after, #pw-root .stat:nth-child(3):after{background:#999}
#pw-panel .stat span, #pw-root .stat span{color:var(--muted);font-size:12px}
#pw-panel .stat strong, #pw-root .stat strong{display:block;font-size:27px;margin-top:9px}
#pw-panel .table-card, #pw-root .table-card{background:#fff;border:1px solid var(--line);border-radius:7px;overflow:hidden}
#pw-panel .table-head, #pw-root .table-head{padding:15px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
#pw-panel .table-head strong, #pw-root .table-head strong{font-size:15px}
#pw-panel .table-head span, #pw-root .table-head span{color:var(--muted);font-size:12px}
#pw-panel .table-wrap, #pw-root .table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:1050px}
th{background:#fafafa;color:#666;font-size:12px;font-weight:600;text-align:left;height:42px;padding:0 15px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px 15px;border-bottom:1px solid #eee;white-space:nowrap;vertical-align:middle}
tbody tr:hover{background:#fffafa}
#pw-panel .thumb, #pw-root .thumb{width:42px;height:42px;border:1px solid #ddd;border-radius:5px;background:linear-gradient(135deg,#eee,#c9c9c9);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px}
#pw-panel .thumb.red, #pw-root .thumb.red{background:linear-gradient(135deg,#b6112b,#241b1d)}
#pw-panel .thumb.dark, #pw-root .thumb.dark{background:linear-gradient(135deg,#181818,#7a7a7a)}
#pw-panel .link, #pw-root .link{color:var(--danger);font-weight:600;text-decoration:none}
#pw-panel .sub, #pw-root .sub{display:block;color:var(--muted);font-size:11px;margin-top:4px}
#pw-panel .tag, #pw-root .tag{display:inline-flex;align-items:center;padding:4px 8px;border-radius:4px;font-size:12px;border:1px solid transparent}
#pw-panel .tag.gray, #pw-root .tag.gray{background:#f1f1f1;color:#555;border-color:#e4e4e4}
#pw-panel .tag.red, #pw-root .tag.red{background:var(--danger-soft);color:var(--danger);border-color:#f2c1c8}
#pw-panel .tag.green, #pw-root .tag.green{background:var(--success-soft);color:var(--success);border-color:#b9e7cc}
#pw-panel .tag.orange, #pw-root .tag.orange{background:var(--warn-soft);color:var(--warn);border-color:#f1d19b}
#pw-panel .pager, #pw-root .pager{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}
#pw-panel .pages, #pw-root .pages{display:flex;gap:6px}
#pw-panel .pages button, #pw-root .pages button{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:4px}
#pw-panel .pages button.active, #pw-root .pages button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
#pw-panel .modal-backdrop, #pw-root .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.46);z-index:20;display:none;align-items:center;justify-content:center}
#pw-panel .modal-backdrop.show, #pw-root .modal-backdrop.show{display:flex}
#pw-panel .modal, #pw-root .modal{background:#fff;border-radius:8px;box-shadow:var(--shadow);width:min(1120px,calc(100vw - 60px));max-height:calc(100vh - 50px);overflow:auto}
#pw-panel .modal-header, #pw-root .modal-header{height:62px;padding:0 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
#pw-panel .modal-header h2, #pw-root .modal-header h2{font-size:18px;margin:0}
#pw-panel .close, #pw-root .close{border:0;background:transparent;font-size:22px;color:#777}
#pw-panel .modal-body, #pw-root .modal-body{padding:22px 26px}
#pw-panel .modal-footer, #pw-root .modal-footer{padding:16px 26px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
#pw-panel .stepper, #pw-root .stepper{display:flex;align-items:center;margin-bottom:24px}
#pw-panel .step, #pw-root .step{display:flex;align-items:center;gap:8px;color:#888}
#pw-panel .step .num, #pw-root .step .num{width:25px;height:25px;border-radius:50%;border:1px solid #bbb;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
#pw-panel .step.active, #pw-root .step.active{color:var(--ink);font-weight:600}
#pw-panel .step.active .num, #pw-root .step.active .num{background:var(--danger);color:#fff;border-color:var(--danger)}
#pw-panel .step.done .num, #pw-root .step.done .num{background:#222;color:#fff;border-color:#222}
#pw-panel .step-line, #pw-root .step-line{width:58px;border-top:1px dashed #ccc;margin:0 12px}
#pw-panel .section, #pw-root .section{border:1px solid var(--line);border-radius:6px;margin-bottom:15px}
#pw-panel .section-title, #pw-root .section-title{padding:11px 14px;background:#fafafa;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
#pw-panel .section-title:before, #pw-root .section-title:before{content:'';display:inline-block;width:3px;height:14px;background:var(--danger);vertical-align:-2px;margin-right:8px}
#pw-panel .form-grid, #pw-root .form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:16px}
#pw-panel .span-2, #pw-root .span-2{grid-column:span 2}
#pw-panel .span-3, #pw-root .span-3{grid-column:span 3}
#pw-panel .readonly, #pw-root .readonly{background:#f6f6f6;color:#777}
#pw-panel .upload, #pw-root .upload{border:1px dashed #c9c9c9;border-radius:5px;min-height:84px;padding:12px;display:flex;gap:10px;align-items:center;background:#fcfcfc}
#pw-panel .upload button, #pw-root .upload button{border:1px solid #ccc;background:#fff;border-radius:4px;height:30px;padding:0 11px}
#pw-panel .upload em, #pw-root .upload em{font-style:normal;color:#888;font-size:12px}
#pw-panel .help, #pw-root .help{color:#999;font-size:12px;margin-left:4px}
#pw-panel .notice, #pw-root .notice{padding:11px 13px;background:#fff8e9;border:1px solid #f1d7a4;border-radius:5px;color:#7b5600;font-size:12px}
#pw-panel .detail, #pw-root .detail{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}
#pw-panel .detail-card, #pw-root .detail-card{background:#fff;border:1px solid var(--line);border-radius:7px;overflow:hidden}
#pw-panel .detail-card h3, #pw-root .detail-card h3{font-size:15px;margin:0;padding:16px 18px;border-bottom:1px solid var(--line)}
#pw-panel .detail-body, #pw-root .detail-body{padding:18px}
#pw-panel .kv, #pw-root .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:15px 20px}
#pw-panel .kv-item label, #pw-root .kv-item label{display:block;color:#888;font-size:12px;margin-bottom:5px}
#pw-panel .kv-item strong, #pw-root .kv-item strong{font-weight:500}
#pw-panel .evidence, #pw-root .evidence{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#pw-panel .evidence-card, #pw-root .evidence-card{border:1px solid var(--line);border-radius:5px;padding:13px}
#pw-panel .evidence-card h4, #pw-root .evidence-card h4{margin:0 0 9px;font-size:13px}
#pw-panel .evidence-card p, #pw-root .evidence-card p{color:#666;font-size:12px;line-height:1.7;margin:0}
#pw-panel .evidence-card .result, #pw-root .evidence-card .result{margin-bottom:8px}
#pw-panel .timeline, #pw-root .timeline{position:relative;padding-left:23px}
#pw-panel .timeline:before, #pw-root .timeline:before{content:'';position:absolute;left:5px;top:4px;bottom:4px;border-left:1px solid #ddd}
#pw-panel .event, #pw-root .event{position:relative;margin-bottom:21px}
#pw-panel .event:before, #pw-root .event:before{content:'';position:absolute;left:-22px;top:3px;width:9px;height:9px;border-radius:50%;background:#aaa;border:2px solid #fff;box-shadow:0 0 0 1px #aaa}
#pw-panel .event.current:before, #pw-root .event.current:before{background:var(--danger);box-shadow:0 0 0 1px var(--danger)}
#pw-panel .event strong, #pw-root .event strong{display:block;font-size:13px}
#pw-panel .event small, #pw-root .event small{color:#999}
#pw-panel .event p, #pw-root .event p{margin:6px 0 0;color:#666;font-size:12px}
#pw-panel .columns-menu, #pw-root .columns-menu{position:absolute;right:18px;top:56px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:6px;padding:14px;width:210px;z-index:5;display:none}
#pw-panel .columns-menu.show, #pw-root .columns-menu.show{display:block}
#pw-panel .columns-menu label, #pw-root .columns-menu label{display:flex;gap:8px;align-items:center;margin:9px 0;font-size:12px}
#pw-panel .toast, #pw-root .toast{position:fixed;right:28px;bottom:28px;background:#222;color:#fff;padding:12px 17px;border-radius:5px;box-shadow:var(--shadow);z-index:40;display:none}
#pw-panel .toast.show, #pw-root .toast.show{display:block;animation:fade 2.6s both}
@keyframes fade{0%,100%{opacity:0;transform:translateY(8px)}
15%,80%{opacity:1;transform:none}
}
@media(max-width:960px){.side{width:66px}
#pw-panel .content, #pw-root .content{padding:20px}
#pw-panel .filter-grid, #pw-root .filter-grid{grid-template-columns:1fr 1fr}
#pw-panel .detail, #pw-root .detail{grid-template-columns:1fr}
#pw-panel .form-grid, #pw-root .form-grid{grid-template-columns:1fr 1fr}
#pw-panel .span-3, #pw-root .span-3{grid-column:span 2}
}

/* globals.css */
:root {
  --brand-red-1: #FDE8EC;
  --brand-red-2: #ffd8d9;
  --brand-red-5: #C8102E;
  --brand-red-6: #C8102E;
  --brand-red-7: #A00D25;
  --gray-1: #ffffff;
  --gray-2: #f7f7f7;
  --gray-3: #ededed;
  --gray-4: #dedede;
  --gray-5: #c7c7c7;
  --gray-7: #8a8a8a;
  --gray-9: #595959;
  --gray-11: #2d2d2d;
  --gray-13: #141414;

  --color-primary: var(--brand-red-6);
  --color-primary-hover: var(--brand-red-5);

  --color-border: var(--gray-4);

  --font-family-base: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;

  --font-size-display: 28px;

  --font-weight-regular: 400;

  --shadow-0: none;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.06), 0 1px 4px rgba(0, 0, 0, 0.04);
  --shadow-2: 0 2px 8px rgba(0, 0, 0, 0.08), 0 1px 4px rgba(0, 0, 0, 0.04);
  --shadow-3: 0 4px 16px rgba(0, 0, 0, 0.1), 0 2px 6px rgba(0, 0, 0, 0.06);
  --shadow-4: 0 8px 24px rgba(0, 0, 0, 0.12), 0 4px 8px rgba(0, 0, 0, 0.08);
  --motion-fast: 140ms;
  --motion-normal: 220ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --focus-ring: 0 0 0 3px rgba(215, 25, 32, 0.18);
  --sidebar-width: 216px;
  --topbar-height: 64px;
  --control-panel-width: 382px;
  --source-panel-width: 252px;
  --canvas-min-height: 520px;
}

* {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

html {
  background: var(--color-bg-page);
}

body {
  min-width: 320px;
  margin: 0;
  background: var(--color-bg-page);
  color: var(--color-text-primary);
  font-family: var(--font-family-base);
  font-size: var(--font-size-body);
  line-height: var(--line-height-body);
  text-rendering: optimizeLegibility;
}

button,
input,
select,
textarea {
  font: inherit;
}

button,
select,
input[type="radio"] {
  cursor: pointer;
}

button:focus-visible,
select:focus-visible,
textarea:focus-visible,
input:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 2px;
  box-shadow: var(--focus-ring);
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.56;
}

::selection {
  background: var(--color-primary-bg);
  color: var(--color-text-primary);
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}




/* editor.css */
.app-shell {
  min-height: 100vh;
  background: var(--color-bg-page);
}

.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 20;
  display: flex;
  width: var(--sidebar-width);
  flex-direction: column;
  background: var(--gray-13);
  color: var(--color-text-inverse);
}

.brand-block {
  display: flex;
  min-height: var(--topbar-height);
  align-items: center;
  gap: var(--spacing-sm);
  border-bottom: 1px solid var(--gray-11);
  padding: 0 var(--spacing-md);
}

.brand-mark {
  display: grid;
  width: 32px;
  height: 32px;
  place-items: center;
  border-radius: var(--radius-md);
  background: var(--color-primary);
  color: var(--color-text-inverse);
  font-size: var(--font-size-body-sm);
  font-weight: var(--font-weight-semibold);
  letter-spacing: 0.04em;
}

.brand-block strong,
.brand-block span,
.sidebar-footer strong,
.sidebar-footer small {
  display: block;
}

.brand-block strong {
  font-size: var(--font-size-body-lg);
  line-height: var(--line-height-body-lg);
  letter-spacing: 0.04em;
}

.brand-block span,
.sidebar-footer small {
  color: var(--gray-5);
  font-size: var(--font-size-caption);
  line-height: var(--line-height-caption);
}

.sidebar nav {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: var(--spacing-xs);
  padding: var(--spacing-lg) var(--spacing-sm);
}

.sidebar nav > p {
  margin: 0 0 var(--spacing-sm);
  padding: 0 var(--spacing-sm);
  color: var(--gray-7);
  font-size: var(--font-size-caption);
  line-height: var(--line-height-caption);
}

.nav-item {
  position: relative;
  display: flex;
  min-height: 40px;
  align-items: center;
  gap: var(--spacing-sm);
  border: 0;
  border-radius: var(--radius-md);
  padding: var(--spacing-sm);
  background: transparent;
  color: var(--gray-4);
  text-align: left;
  transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}

.nav-item:hover {
  background: var(--gray-11);
  color: var(--color-text-inverse);
}

.nav-item.active {
  background: var(--color-primary);
  color: var(--color-text-inverse);
  font-weight: var(--font-weight-medium);
}

.nav-item .ui-icon {
  width: 24px;
  font-size: var(--font-size-body-lg);
  text-align: center;
}

.sidebar-footer {
  display: flex;
  align-items: center;
  gap: var(--spacing-sm);
  border-top: 1px solid var(--gray-11);
  padding: var(--spacing-md);
}

.sidebar-footer strong {
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
}

.avatar {
  display: grid;
  width: 32px;
  height: 32px;
  flex: 0 0 32px;
  place-items: center;
  border: 1px solid var(--gray-9);
  border-radius: var(--radius-full);
  background: var(--gray-11);
  color: var(--color-text-inverse);
}

.page-shell {
  min-height: 100vh;
  margin-left: var(--sidebar-width);
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 15;
  display: flex;
  min-height: var(--topbar-height);
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--color-divider);
  padding: 0 var(--spacing-lg);
  background: var(--color-bg-container);
}

.breadcrumb,
.topbar-actions,
.button-group,
.canvas-meta,
.title-row,
.section-title-row,
.evidence-summary,
.field-source,
.textarea-meta {
  display: flex;
  align-items: center;
}

.breadcrumb {
  gap: var(--spacing-sm);
  color: var(--color-text-tertiary);
  font-size: var(--font-size-body-sm);
}

.breadcrumb b {
  color: var(--color-border);
  font-weight: var(--font-weight-regular);
}

.breadcrumb strong {
  color: var(--color-text-primary);
  font-weight: var(--font-weight-medium);
}

.topbar-actions {
  gap: var(--spacing-sm);
}

.prototype-tag,
.draft-tag,
.source-label,
.status-tag,
.source-badge,
.evidence-count,
.preview-tag,
.editable-tag,
.locked-tag {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-xs);
  border-radius: var(--radius-sm);
  padding: 2px var(--spacing-sm);
  font-size: var(--font-size-caption);
  line-height: var(--line-height-caption);
  white-space: nowrap;
}

.prototype-tag {
  border: 1px solid var(--color-border);
  background: var(--color-bg-fill);
  color: var(--color-text-secondary);
}

.icon-button,
.back-button {
  display: inline-grid;
  width: 32px;
  height: 32px;
  place-items: center;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-bg-container);
  color: var(--color-text-primary);
  transition: border-color var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard);
}

.icon-button:hover,
.back-button:hover {
  border-color: var(--color-border-hover);
  background: var(--color-bg-fill);
}

.primary-button,
.secondary-button,
.text-action {
  min-height: 32px;
  border-radius: var(--radius-md);
  font-weight: var(--font-weight-medium);
  transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}

.primary-button,
.secondary-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-xs);
  padding: var(--spacing-xs) var(--spacing-md);
}

.primary-button {
  border: 1px solid var(--color-primary);
  background: var(--color-primary);
  color: var(--color-text-inverse);
}

.primary-button:hover:not(:disabled) {
  border-color: var(--color-primary-hover);
  background: var(--color-primary-hover);
}

.secondary-button {
  border: 1px solid var(--color-border);
  background: var(--color-bg-container);
  color: var(--color-text-primary);
}

.secondary-button:hover:not(:disabled) {
  border-color: var(--color-text-primary);
  background: var(--color-bg-fill);
}

.text-action {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-xs);
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--color-link);
}

.text-action:hover {
  color: var(--color-primary-active);
  text-decoration: underline;
}

.save-button {
  min-width: 96px;
}

.full-width {
  width: 100%;
}

.main-content {
  padding: var(--spacing-lg);
}

.page-header {
  display: flex;
  align-items: flex-start;
  gap: var(--spacing-md);
  margin-bottom: var(--spacing-md);
}

.page-title-group {
  min-width: 0;
}

.title-row {
  gap: var(--spacing-sm);
}

.page-header h1 {
  margin: 0;
  font-size: var(--font-size-title-lg);
  font-weight: var(--font-weight-semibold);
  line-height: var(--line-height-title-lg);
}

.page-header p {
  margin: var(--spacing-xs) 0 0;
  color: var(--color-text-secondary);
}

.status-tag {
  border: 1px solid var(--color-border);
  background: var(--color-bg-fill);
  color: var(--color-text-secondary);
}

.status-tag-success {
  border-color: var(--color-success);
  background: var(--color-success-bg);
  color: var(--color-success);
}

.flow-steps {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  margin: 0 0 var(--spacing-lg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--spacing-md) var(--spacing-lg);
  background: var(--color-bg-container);
  list-style: none;
}

.flow-steps li {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--spacing-sm);
  color: var(--color-text-tertiary);
  font-size: var(--font-size-body-sm);
}

.flow-steps li:not(:last-child)::after {
  position: absolute;
  top: 50%;
  right: var(--spacing-md);
  left: calc(100% - var(--spacing-xl));
  height: 1px;
  background: var(--color-divider);
  content: "";
}

.flow-steps li > span {
  display: grid;
  width: 28px;
  height: 28px;
  flex: 0 0 28px;
  place-items: center;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-full);
  background: var(--color-bg-container);
  font-variant-numeric: tabular-nums;
}

.flow-steps li.done,
.flow-steps li.current {
  color: var(--color-text-primary);
}

.flow-steps li.done > span {
  border-color: var(--color-text-primary);
  background: var(--color-text-primary);
  color: var(--color-text-inverse);
}

.flow-steps li.current > span {
  border-color: var(--color-primary);
  background: var(--color-primary);
  color: var(--color-text-inverse);
}

.flow-steps li.current strong {
  color: var(--color-primary);
}

.editor-grid {
  display: grid;
  grid-template-columns: var(--source-panel-width) minmax(440px, 1fr) var(--control-panel-width);
  align-items: start;
  gap: var(--spacing-md);
}

.panel {
  min-width: 0;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  background: var(--color-bg-container);
  box-shadow: var(--shadow-0);
}

.source-panel,
.canvas-panel,
.control-panel {
  min-height: 680px;
}

.source-panel {
  padding: var(--spacing-md);
}

.panel-heading,
.control-heading,
.canvas-heading,
.dialog-header,
.dialog-footer,
.prompt-section-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--spacing-md);
}

.eyebrow {
  margin: 0 0 var(--spacing-xs);
  color: var(--color-text-tertiary);
  font-size: var(--font-size-caption);
  font-weight: var(--font-weight-medium);
  letter-spacing: 0.08em;
  line-height: var(--line-height-caption);
  text-transform: uppercase;
}

.panel h2,
.dialog-header h2 {
  margin: 0;
  font-size: var(--font-size-title-sm);
  font-weight: var(--font-weight-semibold);
  line-height: var(--line-height-title-sm);
}

.source-cover {
  position: relative;
  height: 168px;
  margin-top: var(--spacing-md);
  overflow: hidden;
  border: 1px solid var(--color-divider);
  border-radius: var(--radius-md);
  background: #f4f0e9;
}

.cover-sun {
  position: absolute;
  top: var(--spacing-lg);
  right: var(--spacing-xl);
  width: 28px;
  height: 28px;
  border-radius: var(--radius-full);
  background: var(--color-primary);
}

.cover-mountain {
  position: absolute;
  right: -8%;
  bottom: -2%;
  left: -8%;
  display: block;
  background: var(--gray-7);
  clip-path: polygon(0 100%, 13% 58%, 22% 76%, 39% 19%, 51% 60%, 64% 35%, 78% 70%, 88% 42%, 100% 100%);
}

.cover-mountain-one {
  height: 82%;
  opacity: 0.24;
}

.cover-mountain-two {
  height: 58%;
  background: var(--gray-11);
  opacity: 0.5;
  transform: translateX(12%);
}

.evidence-summary {
  justify-content: space-between;
  margin: var(--spacing-md) 0 var(--spacing-sm);
}

.source-badge {
  background: var(--color-primary-bg);
  color: var(--color-primary-active);
}

.evidence-count,
.source-label {
  background: var(--color-bg-fill);
  color: var(--color-text-secondary);
}

.section-divider {
  height: 1px;
  margin: var(--spacing-md) 0;
  background: var(--color-divider);
}

.section-title-row {
  justify-content: space-between;
  gap: var(--spacing-sm);
}

.section-title-row h3,
.risk-note h3,
.control-section h3,
.prompt-section h3 {
  margin: 0;
  font-size: var(--font-size-body);
  font-weight: var(--font-weight-semibold);
  line-height: var(--line-height-body);
}

.extraction-list {
  margin: var(--spacing-sm) 0 0;
}

.extraction-list > div {
  padding: var(--spacing-sm) 0;
  border-bottom: 1px solid var(--color-divider);
}

.extraction-list > div:last-child {
  border-bottom: 0;
}

.extraction-list dt {
  color: var(--color-text-tertiary);
  font-size: var(--font-size-caption);
  line-height: var(--line-height-caption);
}

.extraction-list dd {
  margin: var(--spacing-xs) 0 0;
  color: var(--color-text-primary);
}

.inline-palette {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--spacing-xs);
}

.dot {
  display: inline-block;
  width: 12px;
  height: 12px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-full);
}

.dot.paper {
  background: #f4f0e9;
}

.dot.ink {
  background: var(--gray-13);
}

.dot.cinnabar {
  background: var(--color-primary);
}

.risk-note {
  display: flex;
  gap: var(--spacing-sm);
  margin: var(--spacing-md) 0;
  border: 1px solid var(--brand-red-2);
  border-radius: var(--radius-md);
  padding: var(--spacing-sm);
  background: var(--color-primary-bg);
}

.risk-icon {
  display: grid;
  width: 24px;
  height: 24px;
  flex: 0 0 24px;
  place-items: center;
  color: var(--color-primary-active);
}

.risk-note p {
  margin: var(--spacing-xs) 0;
  color: var(--color-text-secondary);
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
}

.risk-note span {
  color: var(--color-primary-active);
  font-size: var(--font-size-caption);
  line-height: var(--line-height-caption);
}

.canvas-panel {
  padding: var(--spacing-md);
}

.canvas-heading {
  align-items: center;
}

.canvas-meta {
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: var(--spacing-xs);
  color: var(--color-text-secondary);
  font-size: var(--font-size-caption);
}

.canvas-meta > span:not(.preview-tag) {
  border-right: 1px solid var(--color-divider);
  padding-right: var(--spacing-sm);
}

.preview-tag {
  background: var(--color-bg-fill);
  color: var(--color-text-tertiary);
}

.main-canvas {
  position: relative;
  display: grid;
  min-height: var(--canvas-min-height);
  margin-top: var(--spacing-md);
  place-items: center;
  overflow: hidden;
  border: 1px solid var(--color-divider);
  border-radius: var(--radius-md);
  background: #f1f1f1;
}

.main-canvas::before {
  position: absolute;
  inset: var(--spacing-lg);
  border: 1px dashed var(--color-border);
  border-radius: var(--radius-md);
  content: "";
  pointer-events: none;
}

.generation-overlay {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  background: rgba(255, 255, 255, 0.9);
}

.generation-overlay strong,
.generation-overlay small {
  display: block;
}

.generation-overlay strong {
  margin-top: var(--spacing-md);
  font-size: var(--font-size-body-lg);
}

.generation-overlay small {
  margin-top: var(--spacing-xs);
  color: var(--color-text-secondary);
}

.spinner {
  width: 32px;
  height: 32px;
  border: 3px solid var(--brand-red-2);
  border-top-color: var(--color-primary);
  border-radius: var(--radius-full);
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.preview-art {
  --art-paper: #f4f0e9;
  --art-ink: #1a1a1a;
  --art-mid: #8a8a8a;
  --art-light: #d8d2c9;
  --art-accent: var(--color-primary);
  position: relative;
  display: grid;
  width: 100%;
  height: 100%;
  place-items: center;
}

.lighter-shell {
  position: relative;
  width: 258px;
  height: 368px;
  border: 3px solid var(--gray-13);
  border-radius: var(--radius-lg);
  background: var(--art-paper);
  box-shadow: var(--shadow-1);
}

.lighter-shell::before {
  position: absolute;
  inset: var(--spacing-xs);
  z-index: 2;
  border: 1px solid rgba(20, 20, 20, 0.4);
  border-radius: var(--radius-md);
  content: "";
  pointer-events: none;
}

.shell-lid-line {
  position: absolute;
  top: 108px;
  right: 0;
  left: 0;
  z-index: 3;
  height: 2px;
  background: var(--gray-13);
}

.shell-hinge {
  position: absolute;
  top: 104px;
  left: -12px;
  width: 12px;
  height: 22px;
  border: 3px solid var(--gray-13);
  border-right: 0;
  border-radius: var(--radius-sm) 0 0 var(--radius-sm);
  background: var(--gray-3);
}

.shell-side-label {
  position: absolute;
  right: var(--spacing-sm);
  bottom: var(--spacing-sm);
  z-index: 4;
  border-radius: var(--radius-sm);
  padding: 0 var(--spacing-xs);
  background: rgba(255, 255, 255, 0.72);
  color: var(--color-text-tertiary);
  font-size: var(--font-size-caption);
  line-height: var(--line-height-caption);
}

.artwork {
  position: absolute;
  inset: var(--spacing-sm);
  overflow: hidden;
  border-radius: var(--radius-sm);
}

.art-sun {
  position: absolute;
  top: 44px;
  right: 42px;
  z-index: 2;
  width: 38px;
  height: 38px;
  border-radius: var(--radius-full);
  background: var(--art-accent);
}

.art-bird {
  position: absolute;
  top: 86px;
  z-index: 3;
  width: 12px;
  height: 6px;
  border-top: 2px solid var(--art-ink);
  border-radius: var(--radius-full);
  transform: rotate(12deg);
}

.art-bird::after {
  position: absolute;
  top: -2px;
  left: 8px;
  width: 12px;
  height: 6px;
  border-top: 2px solid var(--art-ink);
  border-radius: var(--radius-full);
  content: "";
  transform: rotate(-22deg);
}

.bird-one { left: 108px; }
.bird-two { top: 100px; left: 139px; transform: scale(0.72); }

.mountain {
  position: absolute;
  right: -12%;
  bottom: 8%;
  left: -12%;
  display: block;
  transform-origin: center bottom;
  clip-path: polygon(0 100%, 10% 70%, 18% 82%, 32% 34%, 44% 72%, 57% 22%, 70% 69%, 80% 44%, 91% 78%, 100% 56%, 100% 100%);
}

.mountain-back {
  height: 56%;
  background: var(--art-light);
  opacity: 0.7;
}

.mountain-mid {
  height: 45%;
  background: var(--art-mid);
  opacity: 0.44;
  transform: translateX(8%) scale(0.94);
}

.mountain-front {
  height: 36%;
  background: var(--art-ink);
  opacity: 0.72;
  transform: translateX(28%) scale(0.84);
}

.ink-line {
  position: absolute;
  right: 0;
  bottom: 50px;
  left: 0;
  height: 1px;
  background: var(--art-ink);
  opacity: 0.52;
}

.line-two {
  bottom: 38px;
  left: 28%;
  opacity: 0.28;
}

.pixel-grid,
.sparkle-field {
  display: none;
}

.palette-mono {
  --art-paper: #dedede;
  --art-ink: #1a1a1a;
  --art-mid: #777777;
  --art-light: #bfbfbf;
  --art-accent: #3b3b3b;
}

.palette-warm {
  --art-paper: #eee5d7;
  --art-ink: #2a211c;
  --art-mid: #796558;
  --art-light: #cbbbab;
  --art-accent: #8f2428;
}

.style-line .mountain-back,
.style-line .mountain-mid {

}

.style-line .mountain-front {

}

.style-pixel .pixel-grid {

.style-pixel .mountain {

}

.style-sparkle .sparkle-field {

  inset: 28% 8% 10%;

  background-image: radial-gradient(circle, var(--art-accent) 0 2px, transparent 3px), radial-gradient(circle, var(--art-mid) 0 1px, transparent 2px);
  background-position: 0 0, 11px 13px;
  background-size: 22px 22px, 18px 18px;

.style-sparkle .mountain {

}

.layout-center .artwork {

.layout-full .artwork {

}

.layout-full .mountain {

}

.layout-full .art-sun {

  right: 28px;
}

.craft-laser .art-sun {

}

.craft-laser .mountain-back,
.craft-laser .mountain-mid {

}

.craft-laser .mountain-front {
  opacity: 0.86;
}

.preview-art-compact .lighter-shell {

  height: 88px;
  border-width: 1px;
  border-radius: var(--radius-sm);

}

.preview-art-compact .lighter-shell::before {

  border-radius: 2px;
}

.preview-art-compact .shell-lid-line {
  top: 26px;
  height: 1px;
}

.preview-art-compact .shell-hinge,
.preview-art-compact .shell-side-label,
.preview-art-compact .art-bird {
  display: none;
}

.preview-art-compact .artwork {
  inset: 3px;
}

.preview-art-compact .art-sun {
  top: 10px;
  right: 10px;
  width: 10px;
  height: 10px;
}

.preview-art-compact .ink-line {
  bottom: 8px;
}

.variant-header {
  display: flex;
  align-items: baseline;
  gap: var(--spacing-sm);
  margin: var(--spacing-md) 0 var(--spacing-sm);
}

.variant-header strong {
  font-weight: var(--font-weight-semibold);
}

.variant-header span {
  color: var(--color-text-tertiary);
  font-size: var(--font-size-caption);
}

.variant-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--spacing-sm);
}

.variant-card {
  position: relative;
  min-height: 124px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--spacing-sm);
  background: var(--color-bg-container);
}

.variant-card:hover {
  border-color: var(--color-text-secondary);
}

.variant-card.selected {
  border: 2px solid var(--color-primary);
  padding: 7px;
  background: var(--color-primary-bg);
}

.variant-number {
  position: absolute;
  top: var(--spacing-xs);
  left: var(--spacing-xs);
  z-index: 3;
  display: grid;
  width: 20px;
  height: 20px;
  place-items: center;
  border-radius: var(--radius-full);
  background: var(--color-text-primary);
  color: var(--color-text-inverse);
  font-size: var(--font-size-caption);
  font-variant-numeric: tabular-nums;
}

.variant-card.selected .variant-number {
  background: var(--color-primary);
}

.selected-label {
  position: absolute;
  right: var(--spacing-xs);
  bottom: var(--spacing-xs);
  display: inline-flex;
  align-items: center;
  gap: 2px;
  border-radius: var(--radius-sm);
  padding: 0 var(--spacing-xs);
  background: var(--color-primary);
  color: var(--color-text-inverse);
  font-size: var(--font-size-caption);
  line-height: var(--line-height-caption);
}

.canvas-actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--spacing-xs);
  margin-top: var(--spacing-sm);
  border-top: 1px solid var(--color-divider);
  padding-top: var(--spacing-sm);
}

.canvas-actions button {
  display: inline-flex;
  min-height: 32px;
  align-items: center;
  gap: var(--spacing-xs);
  border: 0;
  border-radius: var(--radius-md);
  padding: var(--spacing-xs) var(--spacing-sm);
  background: transparent;
  color: var(--color-text-secondary);
}

.canvas-actions button:hover {
  background: var(--color-bg-fill);
  color: var(--color-text-primary);
}

.control-panel {
  position: sticky;
  top: calc(var(--topbar-height) + var(--spacing-md));
  display: flex;
  max-height: calc(100vh - var(--topbar-height) - (var(--spacing-md) * 2));
  flex-direction: column;
  overflow: hidden;
}

.control-heading {
  align-items: center;
  border-bottom: 1px solid var(--color-divider);
  padding: var(--spacing-md);
}

.draft-tag {
  background: var(--color-success-bg);
  color: var(--color-success);
}

.control-scroll {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-color: var(--color-border) transparent;
  scrollbar-width: thin;
}

.control-section {
  padding: var(--spacing-md);
  border-bottom: 1px solid var(--color-divider);
}

.control-section-title {
  display: flex;
  align-items: flex-start;
  gap: var(--spacing-sm);
  margin-bottom: var(--spacing-md);
}

.control-section-title p {
  margin: 2px 0 0;
  color: var(--color-text-secondary);
  font-size: var(--font-size-caption);
  line-height: var(--line-height-caption);
}

.step-number,
.number-badge {
  display: grid;
  width: 24px;
  height: 24px;
  flex: 0 0 24px;
  place-items: center;
  border-radius: var(--radius-full);
  background: var(--color-text-primary);
  color: var(--color-text-inverse);
  font-size: var(--font-size-caption);
  font-weight: var(--font-weight-semibold);
  font-variant-numeric: tabular-nums;
}

.mode-choice {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--spacing-sm);
  margin-bottom: var(--spacing-md);
}

.mode-option {
  display: flex;
  min-height: 72px;
  align-items: flex-start;
  gap: var(--spacing-sm);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--spacing-sm);
  background: var(--color-bg-container);
}

.mode-option:has(input:checked) {
  border-color: var(--color-primary);
  background: var(--color-primary-bg);
}

.mode-option input {
  width: 16px;
  height: 16px;
  margin: 2px 0 0;
  accent-color: var(--color-primary);
}

.mode-option strong,
.mode-option small,
.visual-choice strong,
.visual-choice small,
.visual-choice em,
.palette-option strong,
.palette-option small,
.craft-option strong,
.craft-option small {
  display: block;
}

.mode-option strong,
.visual-choice strong,
.palette-option strong,
.craft-option strong {
  font-size: var(--font-size-body-sm);
  font-style: normal;
  line-height: var(--line-height-body-sm);
}

.mode-option small,
.visual-choice small,
.palette-option small,
.craft-option small {
  margin-top: 2px;
  color: var(--color-text-tertiary);
  font-size: var(--font-size-caption);
  line-height: var(--line-height-caption);
}

.field-label {
  display: block;
  margin: var(--spacing-sm) 0 var(--spacing-xs);
  color: var(--color-text-secondary);
  font-size: var(--font-size-body-sm);
  font-weight: var(--font-weight-medium);
  line-height: var(--line-height-body-sm);
}

.select-wrap {
  position: relative;
}

.select-wrap select {
  width: 100%;
  height: 40px;
  appearance: none;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: 0 var(--spacing-xl) 0 var(--spacing-sm);
  background: var(--color-bg-container);
  color: var(--color-text-primary);
}

.select-wrap .ui-icon {
  position: absolute;
  top: 50%;
  right: var(--spacing-sm);
  color: var(--color-text-secondary);
  pointer-events: none;
  transform: translateY(-50%);
}

.field-source {
  justify-content: space-between;
  margin-top: var(--spacing-xs);
  color: var(--color-text-tertiary);
  font-size: var(--font-size-caption);
  line-height: var(--line-height-caption);
}

.field-source span {
  border-radius: var(--radius-sm);
  padding: 0 var(--spacing-xs);
  background: var(--color-bg-fill);
}

.field-source b {
  font-weight: var(--font-weight-regular);
}

.segmented-control {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: 2px;
  background: var(--color-bg-fill);
}

.segmented-control button {
  min-height: 32px;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--color-text-secondary);
}

.segmented-control button.active {
  background: var(--color-bg-container);
  color: var(--color-text-primary);
  font-weight: var(--font-weight-medium);
  box-shadow: var(--shadow-1);
}

.visual-choice-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--spacing-sm);
}

.visual-choice {
  position: relative;
  display: grid;
  min-height: 104px;
  grid-template-columns: 72px 1fr;
  align-items: center;
  gap: var(--spacing-sm);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--spacing-sm);
  background: var(--color-bg-container);
  color: var(--color-text-primary);
  text-align: left;
}

.visual-choice:hover,
.layout-choice:hover,
.palette-option:hover,
.craft-option:hover {
  border-color: var(--color-text-secondary);
}

.visual-choice.selected,
.layout-choice.selected,
.palette-option.selected,
.craft-option.selected {
  border-color: var(--color-primary);
  background: var(--color-primary-bg);
}

.style-sample {
  position: relative;
  display: block;
  width: 72px;
  height: 72px;
  overflow: hidden;
  border: 1px solid var(--color-divider);
  border-radius: var(--radius-sm);
  background: #f4f0e9;
}

.style-sample i {
  position: absolute;
  right: -8px;
  bottom: -2px;
  left: -8px;
  display: block;
  height: 54px;
  background: var(--gray-9);
  clip-path: polygon(0 100%, 10% 70%, 24% 82%, 40% 22%, 56% 76%, 70% 40%, 88% 80%, 100% 55%, 100% 100%);
  opacity: 0.52;
}

.style-sample i:nth-child(2) {
  height: 40px;
  background: var(--gray-13);
  opacity: 0.42;
  transform: translateX(16px);
}

.style-sample i:nth-child(3) {
  top: 10px;
  right: 12px;
  bottom: auto;
  left: auto;
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
  background: var(--color-primary);
  clip-path: none;
  opacity: 1;
}

.style-sample-line i:first-child,
.style-sample-line i:nth-child(2) {
  opacity: 0.18;
}

.style-sample-pixel i:first-child {
  background-image: linear-gradient(90deg, transparent 50%, var(--gray-1) 50%), linear-gradient(transparent 50%, var(--gray-1) 50%);
  background-size: 10px 10px;
  clip-path: polygon(0 100%, 0 70%, 20% 70%, 20% 48%, 40% 48%, 40% 28%, 60% 28%, 60% 54%, 80% 54%, 80% 74%, 100% 74%, 100% 100%);
}

.style-sample-sparkle i:first-child {
  background-image: radial-gradient(circle, var(--gray-1) 0 1px, transparent 2px);
  background-size: 8px 8px;
  opacity: 0.72;
}

.visual-choice em {
  margin-top: var(--spacing-xs);
  color: var(--color-primary-active);
  font-size: var(--font-size-caption);
  font-style: normal;
  line-height: var(--line-height-caption);
}

.choice-check {
  position: absolute;
  top: var(--spacing-xs);
  right: var(--spacing-xs);
  display: grid;
  width: 20px;
  height: 20px;
  place-items: center;
  border-radius: var(--radius-full);
  background: var(--color-primary);
  color: var(--color-text-inverse);
}

.layout-choice-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--spacing-sm);
}

.layout-choice {
  display: flex;
  min-height: 86px;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: var(--spacing-xs);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--spacing-sm);
  background: var(--color-bg-container);
  color: var(--color-text-primary);
}

.layout-sample {
  position: relative;
  display: block;
  width: 44px;
  height: 48px;
  border: 1px solid var(--color-text-secondary);
  border-radius: var(--radius-sm);
  background: var(--color-bg-container);
}

.layout-sample i {
  position: absolute;
  display: block;
  background: var(--color-text-secondary);
  clip-path: polygon(0 100%, 24% 58%, 42% 78%, 60% 36%, 100% 100%);
}

.layout-sample-whitespace i {
  right: 5px;
  bottom: 4px;
  left: 5px;
  height: 18px;
}

.layout-sample-center i {
  inset: 10px 7px;
}

.layout-sample-full i {
  inset: 3px;
}

.layout-choice strong {
  font-size: var(--font-size-caption);
  line-height: var(--line-height-caption);
}

.palette-list,
.craft-list {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-xs);
}

.palette-option,
.craft-option {
  display: flex;
  min-height: 48px;
  align-items: center;
  gap: var(--spacing-sm);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--spacing-sm);
  background: var(--color-bg-container);
  color: var(--color-text-primary);
  text-align: left;
}

.palette-option > span:nth-child(2),
.craft-option > span:first-child {
  min-width: 0;
  flex: 1;
}

.palette-dots {
  display: flex;
  flex: 0 0 auto;
}

.palette-dots i {
  display: block;
  width: 20px;
  height: 20px;
  margin-left: -4px;
  border: 2px solid var(--color-bg-container);
  border-radius: var(--radius-full);
  background: var(--gray-13);
}

.palette-dots i:first-child { margin-left: 0; background: #f4f0e9; }
.palette-dots-classic i:nth-child(2) { background: var(--gray-13); }
.palette-dots-classic i:nth-child(3) { background: var(--color-primary); }
.palette-dots-mono i:first-child { background: var(--gray-4); }
.palette-dots-mono i:nth-child(2) { background: var(--gray-11); }
.palette-dots-mono i:nth-child(3) { background: var(--gray-7); }
.palette-dots-warm i:first-child { background: #eee5d7; }
.palette-dots-warm i:nth-child(2) { background: #2a211c; }
.palette-dots-warm i:nth-child(3) { background: #8f2428; }

.craft-label {
  margin-top: var(--spacing-md);
}

.craft-option em {
  border-radius: var(--radius-sm);
  padding: 0 var(--spacing-xs);
  background: var(--color-primary);
  color: var(--color-text-inverse);
  font-size: var(--font-size-caption);
  font-style: normal;
  line-height: var(--line-height-caption);
}

.quick-note,
.prompt-textarea {
  width: 100%;
  resize: vertical;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-bg-container);
  color: var(--color-text-primary);
}

.quick-note {
  min-height: 88px;
  padding: var(--spacing-sm);
}

.quick-note::placeholder {
  color: var(--color-text-disabled);
}

.textarea-meta {
  justify-content: space-between;
  margin-top: var(--spacing-xs);
  color: var(--color-text-tertiary);
  font-size: var(--font-size-caption);
  font-variant-numeric: tabular-nums;
  line-height: var(--line-height-caption);
}

.parse-button {
  width: 100%;
  margin-top: var(--spacing-sm);
}

.parsed-result {
  margin-top: var(--spacing-sm);
  border: 1px solid var(--color-success);
  border-radius: var(--radius-md);
  padding: var(--spacing-sm);
  background: var(--color-success-bg);
}

.parsed-result > div {
  display: flex;
  align-items: center;
  gap: var(--spacing-xs);
  color: var(--color-success);
}

.parsed-result > span {
  display: inline-flex;
  margin: var(--spacing-xs) var(--spacing-xs) 0 0;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: 0 var(--spacing-xs);
  background: var(--color-bg-container);
  color: var(--color-text-secondary);
  font-size: var(--font-size-caption);
  line-height: var(--line-height-caption);
}

.parsed-result .text-action {
  margin-top: var(--spacing-sm);
  font-size: var(--font-size-caption);
}

.control-footer {
  border-top: 1px solid var(--color-divider);
  padding: var(--spacing-md);
  background: var(--color-bg-container);
}

.prompt-button,
.generate-button {
  width: 100%;
}

.generate-button {
  min-height: 40px;
  margin-top: var(--spacing-sm);
}

.control-footer p {
  margin: var(--spacing-xs) 0 0;
  color: var(--color-text-tertiary);
  font-size: var(--font-size-caption);
  line-height: var(--line-height-caption);
  text-align: center;
}

.prompt-dialog {
  width: min(760px, calc(100vw - var(--spacing-xl)));
  max-height: calc(100vh - var(--spacing-xl));
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);
  padding: 0;
  background: var(--color-bg-container);
  color: var(--color-text-primary);
  box-shadow: var(--shadow-3);
}

.prompt-dialog::backdrop {
  background: var(--color-mask);
}

.dialog-header {
  border-bottom: 1px solid var(--color-divider);
  padding: var(--spacing-lg);
}

.dialog-header p:not(.eyebrow) {
  margin: var(--spacing-xs) 0 0;
  color: var(--color-text-secondary);
}

.dialog-body {
  max-height: calc(100vh - 240px);
  overflow-y: auto;
  padding: var(--spacing-lg);
}

.prompt-section {
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--spacing-md);
}

.prompt-section + .prompt-section {
  margin-top: var(--spacing-md);
}

.prompt-section-heading {
  align-items: center;
  margin-bottom: var(--spacing-sm);
}

.prompt-section-heading > div {
  display: flex;
  align-items: center;
  gap: var(--spacing-sm);
}

.editable-tag {
  background: var(--color-primary-bg);
  color: var(--color-primary-active);
}

.locked-tag {
  background: var(--color-bg-fill);
  color: var(--color-text-secondary);
}

.expert-switch {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-xs);
  font-size: var(--font-size-body-sm);
}

.expert-switch input {
  width: 16px;
  height: 16px;
  accent-color: var(--color-primary);
}

.prompt-textarea {
  min-height: 128px;
  padding: var(--spacing-sm);
  font-family: var(--font-family-base);
  line-height: var(--line-height-body);
}

.prompt-textarea[readonly] {
  background: var(--color-bg-fill);
  color: var(--color-text-secondary);
}

.locked-section {
  background: var(--color-bg-fill);
}

.danger-lock {
  border-color: var(--brand-red-2);
  background: var(--color-primary-bg);
}

.prompt-readonly {
  border-left: 3px solid var(--color-text-primary);
  padding-left: var(--spacing-sm);
}

.danger-lock .prompt-readonly {
  border-left-color: var(--color-primary);
}

.prompt-readonly p {
  margin: var(--spacing-xs) 0;
  color: var(--color-text-secondary);
}

.dialog-footer {
  align-items: center;
  border-top: 1px solid var(--color-divider);
  padding: var(--spacing-md) var(--spacing-lg);
  background: var(--color-bg-fill);
}

.dialog-footer > p {
  display: flex;
  max-width: 420px;
  align-items: center;
  gap: var(--spacing-xs);
  margin: 0;
  color: var(--color-text-secondary);
  font-size: var(--font-size-caption);
  line-height: var(--line-height-caption);
}

.button-group {
  gap: var(--spacing-sm);
}

.toast {
  position: fixed;
  right: var(--spacing-lg);
  bottom: var(--spacing-lg);
  z-index: 80;
  display: flex;
  min-height: 44px;
  align-items: center;
  gap: var(--spacing-sm);
  border-radius: var(--radius-md);
  padding: var(--spacing-sm) var(--spacing-md);
  background: var(--gray-13);
  color: var(--color-text-inverse);
  box-shadow: var(--shadow-4);
  opacity: 0;
  pointer-events: none;
  transform: translateY(var(--spacing-md));
  transition: opacity var(--motion-normal) var(--ease-standard), transform var(--motion-normal) var(--ease-standard);
}

.toast.visible {
  opacity: 1;
  transform: translateY(0);
}

.ui-icon {
  display: inline-grid;
  min-width: 16px;
  place-items: center;
  font-style: normal;
  line-height: 1;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
}

@media (max-width: 1440px) {
  :root {
    --sidebar-width: 80px;
    --source-panel-width: 236px;
    --control-panel-width: 360px;
  }

  .brand-block {
    justify-content: center;
  }

  .brand-block > div:last-child,
  .nav-item span:not(.ui-icon),
  .sidebar nav > p,
  .sidebar-footer > div {
    display: none;
  }

  .nav-item {
    justify-content: center;
  }

  .sidebar-footer {
    justify-content: center;
  }

  .main-content {
    padding: var(--spacing-md);
  }

  .editor-grid {
    gap: var(--spacing-sm);
  }
}

@media (max-width: 1180px) {
  .editor-grid {
    grid-template-columns: var(--source-panel-width) minmax(420px, 1fr);
  }

  .control-panel {
    position: static;
    grid-column: 1 / -1;
    max-height: none;
  }

  .control-scroll {
    display: grid;
    grid-template-columns: 1fr 1fr;
    overflow: visible;
  }

  .control-section {
    border-right: 1px solid var(--color-divider);
  }

  .control-footer {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--spacing-sm);
  }

  .generate-button,
  .control-footer p {
    margin-top: 0;
  }

  .control-footer p {
    grid-column: 1 / -1;
  }
}

@media (max-width: 820px) {
  :root {
    --sidebar-width: 0px;
  }

  .sidebar {
    display: none;
  }

  .topbar {
    padding: 0 var(--spacing-md);
  }

  .breadcrumb span:not(:last-child),
  .breadcrumb b,
  .prototype-tag {
    display: none;
  }

  .flow-steps {
    overflow-x: auto;
    grid-template-columns: repeat(5, minmax(132px, 1fr));
  }

  .editor-grid {
    grid-template-columns: 1fr;
  }

  .source-panel,
  .canvas-panel,
  .control-panel {
    min-height: auto;
  }

  .control-scroll {
    grid-template-columns: 1fr;
  }

  .control-section {
    border-right: 0;
  }
}

@media (max-width: 560px) {
  .main-content {
    padding: var(--spacing-sm);
  }

  .save-button {
    width: 40px;
    min-width: 40px;
    padding: 0;
    font-size: 0;
  }

  .page-header {
    margin-top: var(--spacing-sm);
  }

  .flow-steps {
    margin-bottom: var(--spacing-sm);
    padding: var(--spacing-sm);
  }

  .canvas-heading,
  .dialog-footer,
  .prompt-section-heading {
    align-items: flex-start;
    flex-direction: column;
  }

  .canvas-meta {
    justify-content: flex-start;
  }

  .main-canvas {
    min-height: 420px;
  }

  .lighter-shell {
    width: 220px;
    height: 314px;
  }

  .shell-lid-line {
    top: 92px;
  }

  .shell-hinge {
    top: 88px;
  }

  .variant-grid,
  .visual-choice-grid,
  .mode-choice {
    grid-template-columns: 1fr 1fr;
  }

  .variant-card {
    min-height: 116px;
  }

  .visual-choice {
    grid-template-columns: 1fr;
  }

  .style-sample {
    width: 100%;
  }

  .control-footer {
    grid-template-columns: 1fr;
  }

  .dialog-footer .button-group {
    width: 100%;
  }

  .dialog-footer .button-group button {
    flex: 1;
  }
}




/* module.css */
.module-shell {
  --module-red: #C8102E;
  --module-red-dark: #A00D25;
  --module-red-soft: #FDE8EC;
  --module-ink: #141414;
  --module-gray-900: #2d2d2d;
  --module-gray-700: #595959;
  --module-gray-500: #8a8a8a;
  --module-gray-300: #dedede;
  --module-gray-200: #ededed;
  --module-gray-100: #f7f7f7;
  min-width: 1180px;
}

.module-sidebar {
  width: 232px;
}

.module-sidebar .brand-block {
  padding-inline: 20px;
}

.module-identity {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 16px 12px 4px;
  border: 1px solid #3a3a3a;
  border-radius: 8px;
  padding: 10px;
  background: #222;
}

.module-identity__icon {
  display: grid;
  width: 32px;
  height: 32px;
  flex: 0 0 32px;
  place-items: center;
  border-radius: 6px;
  background: var(--module-red);
  color: #fff;
  font-size: 16px;
}

.module-identity strong,
.module-identity small {
  display: block;
}

.module-identity strong {
  color: #fff;
  font-size: 13px;
  line-height: 20px;
}

.module-identity small {
  color: #8a8a8a;
  font-size: 11px;
  line-height: 18px;
}

.module-sidebar nav {
  overflow-y: auto;
  gap: 2px;
  padding: 10px 8px 16px;
  scrollbar-width: thin;
}

.module-sidebar nav > p {
  margin: 12px 0 4px;
  padding-left: 12px;
  color: #727272;
  font-size: 11px;
  letter-spacing: .08em;
}

.module-sidebar .nav-item {
  min-height: 36px;
  padding: 7px 10px;
  font-size: 13px;
}

.module-sidebar .nav-item.active {
  background: #fff;
  color: #141414;
}

.module-sidebar .nav-item.active::before {
  position: absolute;
  left: 0;
  width: 3px;
  height: 18px;
  border-radius: 0 2px 2px 0;
  background: var(--module-red);
  content: "";
}

.module-sidebar .nav-item.active .ui-icon {
  color: var(--module-red);
}

.nav-count {
  min-width: 20px;
  margin-left: auto;
  border-radius: 10px;
  padding: 0 6px;
  background: var(--module-red);
  color: #fff;
  font-size: 11px;
  font-style: normal;
  line-height: 18px;
  text-align: center;
}

.nav-count.muted {
  background: #3b3b3b;
  color: #c7c7c7;
}

.nav-item.active .nav-count.muted {
  background: #ededed;
  color: #595959;
}

.sidebar-more {
  margin-left: auto;
  border: 0;
  background: transparent;
  color: #8a8a8a;
}

.module-page-shell {
  margin-left: 232px;
}

.module-topbar {
  min-width: 948px;
  padding-inline: 24px;
}

.global-search {
  display: flex;
  width: 280px;
  height: 36px;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--module-gray-300);
  border-radius: 6px;
  padding: 0 10px;
  background: var(--module-gray-100);
  color: var(--module-gray-500);
}

.global-search:focus-within {
  border-color: var(--module-red);
  box-shadow: var(--focus-ring);
  background: #fff;
}

.global-search input {
  width: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--module-ink);
  font-size: 13px;
}

.global-search kbd {
  border: 1px solid var(--module-gray-300);
  border-radius: 4px;
  padding: 0 5px;
  background: #fff;
  color: var(--module-gray-500);
  font: 11px/18px var(--font-family-base);
  white-space: nowrap;
}

.notification-button {
  position: relative;
}

.notification-button i {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 6px;
  height: 6px;
  border: 1px solid #fff;
  border-radius: 50%;
  background: var(--module-red);
}

.module-main {
  min-height: calc(100vh - 64px);
  padding: 24px;
  background: #f5f5f5;
}

.page-container {
  max-width: 1540px;
  margin: 0 auto;
}

.page-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 20px;
}

.page-heading h1 {
  margin: 0;
  color: var(--module-ink);
  font-size: 24px;
  line-height: 32px;
}

.page-heading p {
  margin: 4px 0 0;
  color: var(--module-gray-700);
}

.heading-actions,
.inline-actions,
.filter-row,
.section-heading,
.card-heading,
.table-toolbar,
.page-tabs,
.tag-row,
.metric-inline,
.footer-actions {
  display: flex;
  align-items: center;
}

.heading-actions,
.inline-actions,
.footer-actions {
  gap: 8px;
}

.module-button {
  display: inline-flex;
  min-height: 36px;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid var(--module-gray-300);
  border-radius: 6px;
  padding: 7px 14px;
  background: #fff;
  color: var(--module-ink);
  font-weight: 500;
  transition: 140ms ease;
}

.module-button:hover {
  border-color: var(--module-gray-700);
  background: var(--module-gray-100);
}

.module-button.primary {
  border-color: var(--module-red);
  background: var(--module-red);
  color: #fff;
}

.module-button.primary:hover {
  border-color: var(--module-red-dark);
  background: var(--module-red-dark);
}

.module-button.soft {
  border-color: #ffd8d9;
  background: var(--module-red-soft);
  color: var(--module-red-dark);
}

.module-button.small {
  min-height: 30px;
  padding: 4px 10px;
  font-size: 12px;
}

.module-button.icon-only {
  width: 36px;
  padding: 0;
}

.module-link {
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--module-red);
  font-weight: 500;
}

.module-link:hover {
  text-decoration: underline;
}

.notice-strip {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  border: 1px solid #ead6af;
  border-radius: 6px;
  padding: 10px 12px;
  background: #fffaf0;
  color: #684b1a;
  font-size: 13px;
}

.notice-strip strong {
  color: #3f3014;
}

.notice-strip button {
  margin-left: auto;
}

.status-dot {
  width: 8px;
  height: 8px;
  flex: 0 0 8px;
  border-radius: 50%;
  background: #d9a441;
}

.status-dot.success {
  background: #26734d;
}

.status-dot.danger {
  background: var(--module-red);
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}

.stat-card {
  position: relative;
  overflow: hidden;
  border: 1px solid var(--module-gray-200);
  border-radius: 8px;
  padding: 16px;
  background: #fff;
}

.stat-card::after {
  position: absolute;
  top: 0;
  right: 0;
  width: 56px;
  height: 4px;
  background: var(--accent, var(--module-red));
  content: "";
}

.stat-card__top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--module-gray-700);
  font-size: 13px;
}

.stat-card__icon {
  display: grid;
  width: 28px;
  height: 28px;
  place-items: center;
  border-radius: 6px;
  background: var(--module-gray-100);
  color: var(--module-gray-900);
}

.stat-card strong {
  display: block;
  margin-top: 8px;
  font-size: 28px;
  line-height: 36px;
}

.stat-card__delta {
  margin-top: 4px;
  color: var(--module-gray-500);
  font-size: 12px;
}

.stat-card__delta b {
  color: #26734d;
}

.dashboard-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.7fr) minmax(320px, .8fr);
  gap: 16px;
  margin-bottom: 16px;
}

.content-card {
  border: 1px solid var(--module-gray-200);
  border-radius: 8px;
  background: #fff;
}

.content-card.pad {
  padding: 18px;
}

.section-heading,
.card-heading,
.table-toolbar {
  justify-content: space-between;
  gap: 16px;
}

.section-heading {
  margin-bottom: 14px;
}

.section-heading h2,
.card-heading h2,
.card-heading h3 {
  margin: 0;
  color: var(--module-ink);
  font-size: 16px;
  line-height: 24px;
}

.section-heading p,
.card-heading p {
  margin: 2px 0 0;
  color: var(--module-gray-500);
  font-size: 12px;
}

.tag,
.stage-tag,
.source-tag,
.risk-tag,
.data-tag {
  display: inline-flex;
  min-height: 22px;
  align-items: center;
  gap: 4px;
  border-radius: 4px;
  padding: 1px 7px;
  background: var(--module-gray-100);
  color: var(--module-gray-700);
  font-size: 12px;
  line-height: 20px;
  white-space: nowrap;
}

.tag.red,
.stage-tag.rising {
  background: var(--module-red-soft);
  color: var(--module-red-dark);
}

.tag.green,
.data-tag.complete,
.risk-tag.low {
  background: #edf8f2;
  color: #26734d;
}

.tag.amber,
.stage-tag.watch,
.risk-tag.medium,
.data-tag.partial {
  background: #fff7ed;
  color: #8a4b12;
}

.tag.gray,
.stage-tag.stable {
  background: #f0f0f0;
  color: #595959;
}

.tag.dark {
  background: #2d2d2d;
  color: #fff;
}

.risk-tag.high {
  background: #fff1f0;
  color: #b42318;
}

.cluster-list {
  display: grid;
  gap: 8px;
}

.cluster-row {
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr) 120px 72px auto;
  align-items: center;
  gap: 12px;
  border: 1px solid transparent;
  border-radius: 6px;
  padding: 10px;
  transition: 140ms ease;
}

.cluster-row:hover {
  border-color: var(--module-gray-200);
  background: var(--module-gray-100);
}

.cluster-rank {
  color: var(--module-gray-500);
  font-weight: 600;
  text-align: center;
}

.cluster-rank.top {
  color: var(--module-red);
}

.cluster-title strong,
.cluster-title small {
  display: block;
}

.cluster-title strong {
  font-size: 14px;
}

.cluster-title small {
  overflow: hidden;
  color: var(--module-gray-500);
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mini-spark {
  display: flex;
  height: 34px;
  align-items: flex-end;
  gap: 3px;
}

.mini-spark i {
  display: block;
  width: 8px;
  height: var(--h);
  border-radius: 2px 2px 0 0;
  background: #dedede;
}

.mini-spark i:last-child,
.mini-spark.red i:nth-last-child(-n+3) {
  background: var(--module-red);
}

.score-cell strong {
  display: block;
  font-size: 16px;
}

.score-cell small {
  color: var(--module-gray-500);
  font-size: 11px;
}

.lifecycle-chart {
  position: relative;
  min-height: 190px;
  margin-top: 4px;
  border-left: 1px solid var(--module-gray-300);
  border-bottom: 1px solid var(--module-gray-300);
  background: repeating-linear-gradient(to top, transparent 0, transparent 42px, #f0f0f0 43px);
}

.lifecycle-line {
  position: absolute;
  inset: 18px 10px 12px 16px;
}

.lifecycle-line span {
  position: absolute;
  left: var(--x);
  bottom: var(--y);
  width: 10px;
  height: 10px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: var(--module-red);
  box-shadow: 0 0 0 1px var(--module-red);
}

.lifecycle-line span::before {
  position: absolute;
  right: 4px;
  bottom: 3px;
  width: var(--w, 42px);
  height: 2px;
  background: var(--module-red);
  content: "";
  transform: rotate(var(--r));
  transform-origin: right center;
}

.lifecycle-line span:first-child::before {
  display: none;
}

.chart-caption {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  color: var(--module-gray-500);
  font-size: 11px;
}

.chart-legend {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 16px;
}

.legend-item {
  border: 1px solid var(--module-gray-200);
  border-radius: 6px;
  padding: 8px;
}

.legend-item strong,
.legend-item small {
  display: block;
}

.legend-item strong {
  font-size: 13px;
}

.legend-item small {
  color: var(--module-gray-500);
  font-size: 11px;
}

.table-card {
  overflow: hidden;
  border: 1px solid var(--module-gray-200);
  border-radius: 8px;
  background: #fff;
}

.table-toolbar {
  min-height: 64px;
  border-bottom: 1px solid var(--module-gray-200);
  padding: 12px 16px;
}

.table-toolbar h2 {
  margin: 0;
  font-size: 16px;
}

.table-toolbar p {
  margin: 2px 0 0;
  color: var(--module-gray-500);
  font-size: 12px;
}

.page-tabs {
  gap: 4px;
  padding: 4px;
  border-radius: 6px;
  background: var(--module-gray-100);
}

.page-tabs button {
  border: 0;
  border-radius: 4px;
  padding: 5px 10px;
  background: transparent;
  color: var(--module-gray-700);
  font-size: 12px;
}

.page-tabs button.active {
  background: #fff;
  color: var(--module-ink);
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(0,0,0,.06);
}

.data-layer-guide {
  display: grid;
  grid-template-columns: minmax(0,1fr) 28px minmax(0,1fr) 28px minmax(0,1fr);
  align-items: center;
  margin: 16px 0;
}

.data-layer-guide > i {
  color: var(--module-gray-400);
  font-style: normal;
  text-align: center;
}

.data-layer-card {
  display: flex;
  gap: 12px;
  align-items: center;
  min-height: 66px;
  padding: 12px 14px;
  border: 1px solid var(--module-gray-200);
  border-radius: 8px;
  background: #fff;
}

.data-layer-card.active {
  border-color: #efb8ba;
  background: #fff8f8;
}

.data-layer-card > span {
  display: grid;
  width: 28px;
  height: 28px;
  place-items: center;
  border-radius: 50%;
  background: var(--module-ink);
  color: #fff;
  font-size: 11px;
}

.data-layer-card.active > span { background: var(--module-red); }
.data-layer-card strong,
.data-layer-card small { display: block; }
.data-layer-card small { margin-top: 3px; color: var(--module-gray-500); }

.platform-tabs {
  width: max-content;
  margin: 14px 0;
}

.raw-board-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.raw-board-meta > div {
  display: flex;
  gap: 10px;
  align-items: center;
}

.raw-board-meta h2,
.raw-board-meta p { margin: 0; }
.raw-board-meta h2 { font-size: 16px; }
.raw-board-meta p { margin-top: 3px; color: var(--module-gray-500); font-size: 12px; }
.notice-strip.compact { margin: 0 0 12px; }
.raw-board-table th:nth-child(1) { width: 86px; }
.raw-board-table th:nth-child(3) { width: 105px; }
.raw-board-table th:nth-child(4) { width: 88px; }
.raw-board-table th:nth-child(5) { width: 100px; }
.raw-board-table th:nth-child(7) { width: 108px; }

.empty-inline {
  display: flex;
  min-height: 150px;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  justify-content: center;
  color: var(--module-gray-500);
  text-align: center;
}

.empty-inline strong { color: var(--module-ink); }
.section-divider { position: relative; margin: 22px 0 16px; border-top: 1px dashed var(--module-gray-300); text-align: center; }
.section-divider span { position: relative; top: -9px; padding: 0 12px; background: #f7f7f7; color: var(--module-gray-500); font-size: 12px; }

.collection-main-tabs {
  width: max-content;
  margin: 16px 0;
  padding: 5px;
}

.collection-main-tabs button { padding: 8px 16px; font-size: 13px; }
.collection-main-tabs b { color: var(--module-red); }
.collection-main-tabs .tag { margin-left: 4px; padding: 2px 5px; font-size: 10px; }

.collection-funnel {
  display: grid;
  grid-template-columns: minmax(120px,1fr) 26px minmax(120px,1fr) 26px repeat(3,minmax(120px,1fr));
  gap: 8px;
  align-items: stretch;
  margin-bottom: 16px;
}

.collection-funnel > i { align-self: center; color: var(--module-gray-400); font-style: normal; text-align: center; }
.collection-funnel article { padding: 14px; border: 1px solid var(--module-gray-200); border-radius: 8px; background: #fff; }
.collection-funnel article.success { border-top: 3px solid var(--module-red); }
.collection-funnel article.watch { border-top: 3px solid #d9a441; }
.collection-funnel article.muted { border-top: 3px solid var(--module-gray-400); }
.collection-funnel span,
.collection-funnel strong,
.collection-funnel small { display: block; }
.collection-funnel span { color: var(--module-gray-700); }
.collection-funnel strong { margin: 4px 0; font-size: 26px; }
.collection-funnel small { color: var(--module-gray-500); }
.collection-result-table th:nth-child(1) { width: 22%; }
.collection-result-table th:nth-child(2) { width: 95px; }
.collection-result-table th:nth-child(3) { width: 98px; }
.collection-result-table th:nth-child(4) { width: 105px; }

.data-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

.data-table th {
  border-bottom: 1px solid var(--module-gray-200);

  background: #fafafa;
  color: var(--module-gray-700);
  font-size: 12px;
  font-weight: 500;
  text-align: left;
}

.data-table td {
  border-bottom: 1px solid #f0f0f0;
  padding: 12px;
  vertical-align: middle;
}

.data-table tr:last-child td {
  border-bottom: 0;
}

.data-table tbody tr:hover {
  background: #fafafa;
}

.rank-number {
  display: inline-grid;
  width: 24px;
  height: 24px;
  place-items: center;
  border-radius: 4px;
  background: #f0f0f0;
  color: #595959;
  font-size: 12px;
  font-weight: 600;
}

.rank-number.top {
  background: var(--module-red);
  color: #fff;
}

.topic-cell strong,
.topic-cell small {
  display: block;
}

.topic-cell strong {

  white-space: nowrap;
}

.topic-cell small {
  color: var(--module-gray-500);
  font-size: 12px;
}

.trend-positive {
  color: #26734d;
  font-weight: 600;
}

.trend-neutral {
  color: var(--module-gray-500);
}

.completeness {

  align-items: center;
  gap: 6px;
}

.progress-track {

  border-radius: 3px;
  background: #ededed;
}

.progress-track i {
  display: block;
  width: var(--value);
  height: 100%;
  border-radius: inherit;
  background: var(--bar, #26734d);
}

.completeness small {
  color: var(--module-gray-500);
  font-size: 11px;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.source-card,
.inspiration-card,
.workflow-card,
.strategy-card,
.package-card {
  border: 1px solid var(--module-gray-200);
  border-radius: 8px;
  background: #fff;
}

.source-card,
.workflow-card,
.strategy-card,
.package-card {
  padding: 16px;
}

.source-card__header {
  display: flex;
  align-items: center;
  gap: 10px;
}

.source-logo {
  display: grid;
  width: 38px;
  height: 38px;
  place-items: center;
  border: 1px solid var(--module-gray-200);
  border-radius: 8px;
  background: var(--module-gray-100);
  color: var(--module-red);
  font-weight: 700;
}

.source-card__header strong,
.source-card__header small {
  display: block;
}

.source-card__header small {
  color: var(--module-gray-500);
  font-size: 12px;
}

.source-card__header .tag {
  margin-left: auto;
}

.capability-list {
  display: grid;
  gap: 7px;
  margin: 14px 0;
  padding: 12px;
  border-radius: 6px;
  background: var(--module-gray-100);
}

.capability-list div {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--module-gray-700);
  font-size: 12px;
}

.capability-list b {
  color: var(--module-ink);
  font-weight: 500;
}

.source-card__footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--module-gray-500);
  font-size: 12px;
}

.split-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 16px;
}

.form-card {
  border: 1px solid var(--module-gray-200);
  border-radius: 8px;
  background: #fff;
}

.form-card__header,
.form-card__body,
.form-card__footer {
  padding: 16px;
}

.form-card__header {
  border-bottom: 1px solid var(--module-gray-200);
}

.form-card__header h2 {
  margin: 0;
  font-size: 16px;
}

.form-card__header p {
  margin: 4px 0 0;
  color: var(--module-gray-500);
  font-size: 12px;
}

.form-card__footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  border-top: 1px solid var(--module-gray-200);
}

.field-grid {
  display: grid;

  gap: 14px;
}

.field {
  display: grid;
  gap: 6px;
}

.field.full {

}

.field label,
.field > span {

  font-weight: 500;
}

.field label em,
.field > span em {
  color: var(--module-red);

}

.field input,
.field select,
.field textarea {
  width: 100%;
  border: 1px solid var(--module-gray-300);
  border-radius: 6px;
  padding: 8px 10px;
  background: #fff;
  color: var(--module-ink);
}

.field textarea {
  min-height: 88px;

}

.field small {
  color: var(--module-gray-500);
  font-size: 11px;
}

.filter-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.filter-chip {
  border: 1px solid var(--module-gray-300);
  border-radius: 4px;
  padding: 5px 9px;
  background: #fff;
  color: var(--module-gray-700);
  font-size: 12px;
}

.filter-chip.active {
  border-color: var(--module-red);
  background: var(--module-red-soft);
  color: var(--module-red-dark);
}

.timeline {
  display: grid;
  gap: 0;
  padding: 4px 0;
}

.timeline-item {
  position: relative;
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr);
  gap: 10px;
  padding-bottom: 18px;
}

.timeline-item::before {
  position: absolute;
  top: 18px;
  bottom: 0;
  left: 7px;
  width: 1px;
  background: var(--module-gray-300);
  content: "";
}

.timeline-item:last-child::before {
  display: none;
}

.timeline-dot {
  position: relative;
  z-index: 1;
  width: 15px;
  height: 15px;
  margin-top: 3px;
  border: 3px solid #fff;
  border-radius: 50%;
  background: var(--module-gray-500);
  box-shadow: 0 0 0 1px var(--module-gray-300);
}

.timeline-dot.red {
  background: var(--module-red);
  box-shadow: 0 0 0 1px var(--module-red);
}

.timeline-copy strong,
.timeline-copy small {
  display: block;
}

.timeline-copy small {
  color: var(--module-gray-500);
  font-size: 12px;
}

.trend-detail-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(300px, .75fr);
  gap: 16px;
}

.score-breakdown {
  display: grid;
  gap: 10px;
}

.score-line {
  display: grid;
  grid-template-columns: 92px minmax(0, 1fr) 46px;
  align-items: center;
  gap: 10px;
  font-size: 12px;
}

.score-line b {
  text-align: right;
}

.inspiration-card {
  overflow: hidden;
}

.inspiration-visual {
  position: relative;

  height: 176px;

}

.inspiration-visual::after {
  position: absolute;

  background: var(--visual-line, #2d2d2d);
