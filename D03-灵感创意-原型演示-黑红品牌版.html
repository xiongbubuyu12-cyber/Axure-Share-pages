<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI-PIM | 灵感任务池</title>
  <style>
    :root {
      --color-primary: #bb0f2c;
      --color-primary-hover: #97071f;
      --color-primary-bg: #fff0f2;
      --color-danger: #bb0f2c;
      --color-danger-bg: #fff0f2;
      --color-success: #28724f;
      --color-success-bg: #edf8f1;
      --color-warning: #9a641b;
      --color-warning-bg: #fff7e9;
      --color-text-primary: #141414;
      --color-text-secondary: #5d5d5d;
      --color-text-tertiary: #8d8d8d;
      --color-border: #dedede;
      --color-divider: #ededed;
      --color-bg-page: #f5f5f5;
      --color-bg-container: #ffffff;
      --color-bg-fill: #f7f7f7;
      --color-mask: rgba(0, 0, 0, .52);
      --shadow-2: 0 10px 30px rgba(0, 0, 0, .1);
      --shadow-3: 0 20px 50px rgba(0, 0, 0, .18);
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 1180px; color: var(--color-text-primary); background: var(--color-bg-page); font: 14px/1.55 "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app-shell { min-height: 100vh; }
    .topbar { height: 58px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; background: #111; color: #fff; }
    .brand { display: flex; align-items: center; gap: 14px; font-family: Georgia, "Songti SC", serif; letter-spacing: .4px; font-size: 22px; font-weight: 700; }
    .brand-mark { position: relative; width: 31px; height: 31px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.65); font: 700 18px/1 Georgia, serif; }
    .brand-mark::after { content: ""; position: absolute; left: 5px; right: 5px; bottom: 5px; height: 2px; background: var(--color-primary); }
    .top-actions { display: flex; align-items: center; gap: 18px; color: #dedede; }
    .role-select { border: 1px solid #5a5a5a; border-radius: 4px; padding: 5px 10px; background: #212121; color: #fff; }
    .avatar { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 50%; background: #d9d9d9; color: #222; font-size: 12px; font-weight: 700; }
    .main-nav { height: 52px; display: flex; align-items: center; gap: 4px; padding: 0 28px; background: #fff; border-bottom: 1px solid var(--color-border); }
    .nav-item { height: 52px; padding: 0 17px; border: 0; border-bottom: 3px solid transparent; color: #4f4f4f; background: transparent; }
    .nav-item.active { border-bottom-color: var(--color-primary); color: var(--color-text-primary); font-weight: 700; }
    .page { padding: 28px; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; }
    .crumb { margin-bottom: 5px; color: var(--color-text-tertiary); font-size: 12px; }
    h1 { margin: 0; font-size: 26px; line-height: 1.2; letter-spacing: -.4px; }
    .subhead { margin-top: 7px; color: var(--color-text-secondary); }
    .head-actions, .toolbar, .button-row { display: flex; align-items: center; gap: 10px; }
    .btn { height: 34px; padding: 0 14px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); color: #252525; background: #fff; transition: .18s ease; }
    .btn:hover { border-color: #929292; background: #fafafa; }
    .btn-primary { border-color: var(--color-primary); color: #fff; background: var(--color-primary); }
    .btn-primary:hover { border-color: var(--color-primary-hover); background: var(--color-primary-hover); }
    .btn-danger { border-color: var(--color-danger); color: var(--color-danger); background: #fff; }
    .btn-text { border-color: transparent; color: var(--color-primary); background: transparent; }
    .btn[disabled] { cursor: not-allowed; opacity: .44; }
    .filter-panel { display: flex; align-items: center; gap: 12px; padding: 15px 18px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: #fff; }
    .field { display: flex; flex-direction: column; gap: 6px; min-width: 148px; }
    .field label, .label { color: #353535; font-size: 13px; font-weight: 600; }
    .required::before { content: "*"; margin-right: 4px; color: var(--color-danger); }
    .control { width: 100%; height: 34px; padding: 0 10px; border: 1px solid #d2d2d2; border-radius: var(--radius-sm); outline: none; background: #fff; }
    textarea.control { height: auto; min-height: 86px; padding: 9px 10px; resize: vertical; }
    .control:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(187,15,44,.1); }
    .search { flex: 1; min-width: 240px; }
    .workspace { margin-top: 18px; border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; background: #fff; }
    .workspace-head { display: flex; align-items: center; justify-content: space-between; min-height: 58px; padding: 0 18px; border-bottom: 1px solid var(--color-divider); }
    .tabs { display: flex; align-items: stretch; gap: 24px; height: 58px; }
    .tab { position: relative; border: 0; padding: 0; color: var(--color-text-secondary); background: transparent; }
    .tab.active { color: var(--color-text-primary); font-weight: 700; }
    .tab.active::after { content: ""; position: absolute; right: 0; bottom: 0; left: 0; height: 3px; background: var(--color-primary); }
    .count { display: inline-grid; min-width: 18px; height: 18px; place-items: center; margin-left: 4px; padding: 0 5px; border-radius: 9px; color: #666; background: #eee; font-size: 11px; font-weight: 500; }
    .content { padding: 20px; }
    .task-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .task-card { position: relative; min-height: 300px; overflow: hidden; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: #fff; transition: transform .18s, box-shadow .18s; }
    .task-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }
    .card-banner { position: relative; height: 110px; padding: 15px 16px; overflow: hidden; color: #fff; background: #202020; }
    .card-banner::before, .card-banner::after { content: ""; position: absolute; width: 150px; height: 150px; border: 1px solid rgba(255,255,255,.18); transform: rotate(31deg); }
    .card-banner::before { top: -110px; right: 14px; } .card-banner::after { right: -70px; bottom: -105px; border-color: rgba(187,15,44,.9); }
    .card-banner.red { background: linear-gradient(130deg, #171717 0%, #171717 54%, #8f0922 54%, #bc0e2d 100%); }
    .card-banner.light { color: #1b1b1b; background: linear-gradient(130deg, #f4f3f0 0%, #e5e2de 55%, #c3b5a1 55%, #b99571 100%); }
    .card-code { position: relative; z-index: 1; font-size: 11px; opacity: .75; }
    .card-banner h3 { position: relative; z-index: 1; max-width: 76%; margin: 7px 0 0; font: 700 20px/1.25 Georgia, "Songti SC", serif; }
    .card-body { padding: 15px 16px 17px; }
    .tag { display: inline-flex; align-items: center; gap: 4px; min-height: 22px; padding: 0 8px; border-radius: 12px; color: #595959; background: #f0f0f0; font-size: 12px; }
    .tag.red { color: #9d0925; background: var(--color-primary-bg); } .tag.green { color: var(--color-success); background: var(--color-success-bg); } .tag.amber { color: var(--color-warning); background: var(--color-warning-bg); }
    .card-info { display: grid; gap: 8px; margin: 13px 0; color: #555; font-size: 13px; }
    .card-info b { display: inline-block; min-width: 60px; color: #888; font-weight: 400; }
    .card-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--color-divider); }
    .faces { display: flex; align-items: center; }
    .face { width: 22px; height: 22px; margin-left: -5px; display: grid; place-items: center; border: 2px solid #fff; border-radius: 50%; color: #444; background: #dcdcdc; font-size: 9px; }
    .face:first-child { margin-left: 0; background: #d3b6aa; } .face:nth-child(2) { background: #becbd0; } .face:nth-child(3) { background: #d8cfab; }
    .muted { color: var(--color-text-tertiary); }
    .table { width: 100%; border-collapse: collapse; }
    .table th { height: 42px; padding: 0 12px; color: #666; background: #f7f7f7; font-size: 12px; text-align: left; font-weight: 600; }
    .table td { padding: 14px 12px; border-bottom: 1px solid var(--color-divider); vertical-align: middle; }
    .table tr:hover td { background: #fff7f8; }
    .mini-cover { width: 45px; height: 45px; display: inline-grid; place-items: center; margin-right: 9px; vertical-align: middle; border-radius: 4px; color: #fff; background: #272727; font-family: Georgia, serif; }
    .pagination { display: flex; justify-content: flex-end; gap: 6px; padding: 16px 0 0; }
    .page-num { width: 30px; height: 30px; border: 1px solid var(--color-border); border-radius: 3px; color: #555; background: #fff; }
    .page-num.active { border-color: var(--color-primary); color: #fff; background: var(--color-primary); }
    .modal-mask { position: fixed; z-index: 30; inset: 0; display: none; align-items: center; justify-content: center; padding: 30px; background: var(--color-mask); }
    .modal-mask.open { display: flex; }
    .modal { width: 760px; max-height: calc(100vh - 60px); display: flex; flex-direction: column; overflow: hidden; border-radius: var(--radius-lg); background: #fff; box-shadow: var(--shadow-3); animation: in .2s ease; }
    .modal.wide { width: 1080px; } .modal.small { width: 500px; }
    @keyframes in { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
    .modal-header { display: flex; align-items: center; justify-content: space-between; min-height: 61px; padding: 0 22px; border-bottom: 1px solid var(--color-divider); }
    .modal-title { font-size: 18px; font-weight: 700; }
    .modal-close { width: 30px; height: 30px; border: 0; color: #666; background: transparent; font-size: 23px; }
    .modal-body { overflow: auto; padding: 22px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px; border-top: 1px solid var(--color-divider); }
    .section { margin-bottom: 23px; padding: 18px; border: 1px solid var(--color-divider); border-radius: var(--radius-md); }
    .section:last-child { margin-bottom: 0; }
    .section-title { display: flex; align-items: center; gap: 9px; margin-bottom: 15px; font-size: 15px; font-weight: 700; }
    .section-title::before { content: ""; width: 3px; height: 16px; background: var(--color-primary); }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; }
    .form-grid .span-2 { grid-column: span 2; }
    .template-select { display: grid; grid-template-columns: 132px 1fr; gap: 14px; padding: 12px; border: 1px solid var(--color-primary); border-radius: var(--radius-md); background: #fffafb; }
    .template-thumb { position: relative; height: 94px; overflow: hidden; border-radius: 5px; background: linear-gradient(135deg,#2d2d2d,#121212); }
    .lighter { position: absolute; top: 13px; left: 43px; width: 45px; height: 66px; border: 2px solid rgba(255,255,255,.75); border-radius: 4px 4px 7px 7px; }
    .lighter::after { content: ""; position: absolute; top: -8px; left: 5px; width: 30px; height: 10px; border: 2px solid rgba(255,255,255,.75); border-bottom: 0; border-radius: 3px 3px 0 0; }
    .design-zone { position: absolute; top: 25px; left: 51px; width: 29px; height: 32px; border: 1px dashed #e93551; background: rgba(187,15,44,.18); }
    .template-meta h4 { margin: 0 0 4px; } .template-meta p { margin: 3px 0; color: #666; font-size: 12px; }
    .upload-box { min-height: 116px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 7px; border: 1px dashed #b5b5b5; border-radius: var(--radius-md); color: #777; background: #fafafa; }
    .upload-box strong { color: #333; } .upload-box:hover { border-color: var(--color-primary); background: #fffafa; }
    .file-ok { display: none; align-items: center; gap: 11px; padding: 10px; border: 1px solid #cfe7d7; border-radius: 5px; color: #286244; background: var(--color-success-bg); }
    .file-icon { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 4px; color: #fff; background: #d3475f; font-weight: 700; }
    .preview-panel { display: none; grid-template-columns: 1fr 230px; gap: 18px; align-items: stretch; margin-top: 16px; padding: 16px; border: 1px solid #e4d1d5; border-radius: var(--radius-md); background: #fffafb; }
    .preview-panel.open { display: grid; }
    .canvas { position: relative; min-height: 176px; overflow: hidden; border-radius: 6px; background: linear-gradient(135deg, #dedbd5 25%, #f2eee9 25%, #f2eee9 50%, #dedbd5 50%, #dedbd5 75%, #f2eee9 75%); background-size: 18px 18px; }
    .canvas .lighter { top: 20px; left: calc(50% - 36px); width: 72px; height: 115px; border-color: #363636; background: #f6f4ef; }
    .canvas .lighter::after { top: -14px; left: 9px; width: 50px; height: 16px; border-color: #363636; }
    .canvas .design-zone { top: 39px; left: calc(50% - 23px); width: 46px; height: 58px; border-color: var(--color-primary); background: linear-gradient(135deg, #f1b2ba, #b70d2a); }
    .preview-note { padding: 5px 0; color: #555; font-size: 12px; } .preview-note p { margin: 0 0 8px; }

    .drawer-mask.open { display: block; }

    @keyframes slide { from { transform: translateX(100%); } to { transform: translateX(0); } }
    .drawer-head { position: sticky; z-index: 1; top: 0; display: flex; align-items: center; justify-content: space-between; padding: 17px 24px; border-bottom: 1px solid var(--color-divider); background: #fff; }
    .drawer-body { padding: 23px 26px 40px; }

    .detail-hero::after { content: ""; position: absolute; right: 20px; bottom: -72px; width: 270px; height: 270px; border: 2px solid rgba(187,15,44,.8); transform: rotate(35deg); }

    .submission-card .form-grid { grid-template-columns: 1fr 1fr; }
    .empty-tip { padding: 14px; border-left: 3px solid var(--color-primary); color: #6b5559; background: #fff6f7; font-size: 13px; }

    .template-card { overflow: hidden; border: 1px solid var(--color-border); border-radius: var(--radius-md); }
    .template-cover { height: 135px; position: relative; background: #222; }.template-cover.silver { background: linear-gradient(135deg,#d8dbde,#7b8186); }.template-cover.gold { background: linear-gradient(135deg,#e4ca97,#895d28); }
    .template-cover .lighter { top: 27px; left: calc(50% - 32px); width: 64px; height: 90px; }.template-cover .lighter::after { top:-12px; left: 8px; width: 44px; height: 14px; }

    .template-card-foot { display:flex; justify-content:space-between; align-items:center; padding-top: 10px; border-top:1px solid var(--color-divider); }

  function sampleEngineeringZip(){
    const name=new TextEncoder().encode('README.txt'),body=new TextEncoder().encode('Prototype sample only. Not a student engineering source file.');
    let crc=0xffffffff;for(const b of body){crc^=b;for(let j=0;j<8;j++)crc=(crc>>>1)^((crc&1)?0xedb88320:0)}crc=(crc^0xffffffff)>>>0;
    const local=30+name.length+body.length,central=46+name.length,buffer=new Uint8Array(local+central+22),v=new DataView(buffer.buffer);
    const w=(o,n)=>v.setUint16(o,n,true),d=(o,n)=>v.setUint32(o,n,true);
    d(0,0x04034b50);w(4,20);d(14,crc);d(18,body.length);d(22,body.length);w(26,name.length);buffer.set(name,30);buffer.set(body,30+name.length);
    d(local,0x02014b50);w(local+4,20);w(local+6,20);d(local+16,crc);d(local+20,body.length);d(local+24,body.length);w(local+28,name.length);buffer.set(name,local+46);
    const end=local+central;d(end,0x06054b50);w(end+8,1);w(end+10,1);d(end+12,central);d(end+16,local);
    return 'data:application/zip;base64,'+btoa(String.fromCharCode(...buffer));
  }

  function processError(form){

    const sheets=[['作品汇总',[['投稿编号','学校','班级','姓名','学号','作品名称','作品描述','基底','表面工艺','装饰工艺','状态','商品编码','缩略图'],...records.map(s=>{let snap={};try{snap=JSON.parse(s.extraFields?.['任务要求快照']||'{}')}catch{}return[s.code,snap.学校,snap.班级,s.name,s.studentId,s.workName,s.extraFields?.['作品描述'],snap.基底,snap.表面工艺,s.extraFields?.['装饰工艺'],s.status,visibleSku(s),'']})]],['工艺明细',[['投稿编号','所属工艺','加工面','镭射层数','对应工程文件名'],...records.flatMap(s=>{try{return JSON.parse(s.extraFields?.['工艺明细']||'[]').map(r=>[s.code,r.process,r.face,r.layer,r.file])}catch{return[]}})]],['失败清单',[['投稿编号','原因'],...failures.map(f=>[f.code,f.reason])]]];
    const files=[],column=n=>{let s='';for(n++;n;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s};
    sheets.forEach(([name,rows],i)=>files.push({name:`xl/worksheets/sheet${i+1}.xml`,bytes:`<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="${ns}" xmlns:r="${rel}"><cols><col min="1" max="13" width="22" customWidth="1"/></cols><sheetData>${rows.map((row,j)=>`<row r="${j+1}" ht="${i===0&&images.length&&j?72:24}" customHeight="1">${row.map((v,k)=>`<c r="${column(k)}${j+1}" t="inlineStr"><is><t xml:space="preserve">${xml(v)}</t></is></c>`).join('')}</row>`).join('')}</sheetData>${i===0&&images.length?'<drawing r:id="rId1"/>':''}</worksheet>`}));
    if(images.length){files.push({name:'xl/worksheets/_rels/sheet1.xml.rels',bytes:`<Relationships xmlns="${pkg}"><Relationship Id="rId1" Type="${rel}/drawing" Target="../drawings/drawing1.xml"/></Relationships>`},{name:'xl/drawings/_rels/drawing1.xml.rels',bytes:`<Relationships xmlns="${pkg}">${images.map((img,i)=>`<Relationship Id="rId${i+1}" Type="${rel}/image" Target="../media/image${i+1}.png"/>`).join('')}</Relationships>`},{name:'xl/drawings/drawing1.xml',bytes:`<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="${rel}">${images.map((img,i)=>`<xdr:oneCellAnchor><xdr:from><xdr:col>12</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>${img.row+1}</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:from><xdr:ext cx="1143000" cy="857250"/><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="${i+1}" name="缩略图${i+1}"/><xdr:cNvPicPr/></xdr:nvPicPr><xdr:blipFill><a:blip r:embed="rId${i+1}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill><xdr:spPr><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor>`).join('')}</xdr:wsDr>`});images.forEach((img,i)=>files.push({name:`xl/media/image${i+1}.png`,bytes:img.bytes}))}
    files.push({name:'[Content_Types].xml',bytes:`<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}${images.length?'<Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>':''}</Types>`},{name:'_rels/.rels',bytes:`<Relationships xmlns="${pkg}"><Relationship Id="rId1" Type="${rel}/officeDocument" Target="xl/workbook.xml"/></Relationships>`},{name:'xl/workbook.xml',bytes:`<workbook xmlns="${ns}" xmlns:r="${rel}"><sheets>${sheets.map(([name],i)=>`<sheet name="${name}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`},{name:'xl/_rels/workbook.xml.rels',bytes:`<Relationships xmlns="${pkg}">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="${rel}/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}</Relationships>`});return zipBytes(files);
  }
  const downloadBlobs=new Map();
  async function queueDownload(records,mode,parentId){
    const sourceTask=data.tasks.find(t=>t.id===records[0]?.taskId);if(!sourceTask||!records.length)return false;
    const job={id:id('DL'),taskId:sourceTask.id,title:sourceTask.title,role:currentRole(),mode,records:JSON.parse(JSON.stringify(records)),status:'排队中',createdAt:Date.now(),success:0,failures:[],parentId};
    data.downloadJobs=data.downloadJobs||[];data.downloadJobs.push(job);if(!await persist()){data.downloadJobs.pop();return false}renderJobMessages();setTimeout(()=>runDownload(job),100);return true;
  }
  async function runDownload(job){
    if(job.running)return;job.running=true;job.status='处理中';job.success=0;job.failures=[];renderJobMessages();const files=[],images=[];
    try{
      for(const [row,s] of job.records.entries()){
        const reasons=[];const get=key=>data.attachments.find(a=>a.id===s[key+'AttachmentId'])||s[key];
        if(job.mode!=='info'){const thumb=get('thumb');if(!thumb?.dataUrl)reasons.push('缩略图不存在');else try{images.push({row,bytes:await thumbnailPng(thumb.dataUrl)})}catch(e){reasons.push(e.message)}}
        if(job.mode==='all'){const pack=get('package');if(!pack?.dataUrl||pack.demoPlaceholder)reasons.push('工程包原文件不可用');else{let snap={};try{snap=JSON.parse(s.extraFields?.['任务要求快照']||'{}')}catch{}files.push({name:[`${safeName(snap.学校)}_${safeName(snap.班级)}_${safeName(s.studentId)}_${safeName(s.name)}`,`${safeName(s.code)}_${safeName(s.workName)}`,safeName(pack.name)].join('/'),bytes:dataBytes(pack.dataUrl)})}}
        if(reasons.length)job.failures.push({id:s.id,code:s.code,reason:reasons.join('；')});else job.success++;await new Promise(resolve=>setTimeout(resolve,0));
      }
      files.unshift({name:'作品汇总.xlsx',bytes:workbookBytes(job.records,images,job.failures)});
      downloadBlobs.set(job.id,new Blob([zipBytes(files)],{type:'application/zip'}));job.status=job.failures.length?'部分完成':'已完成';
    }catch(e){job.status='失败';job.success=0;job.failures=job.records.map(s=>({id:s.id,code:s.code,reason:'打包失败，请重试'}))}
    finally{delete job.running;await persist();renderJobMessages()}
  }
  function renderJobMessages(){
    const pop=$('#notifications-pop');pop.querySelector('[data-download-notices]')?.remove();const section=document.createElement('div');section.dataset.downloadNotices='';
    (data.downloadJobs||[]).filter(j=>j.role===currentRole()).slice(-8).reverse().forEach(job=>{const b=document.createElement('button');b.type='button';b.innerHTML=`<strong>作品下载 · ${esc(job.status)}</strong><small>应打包 ${job.records.length}，完整打包 ${job.success}，失败 ${job.failures.length}</small>`;b.onclick=()=>{pop.hidden=true;showDownloadResult(job)};section.append(b)});pop.insertBefore(section,pop.querySelector('.pop-foot'));
    if(section.children.length){$('#unread-count').hidden=false;$('#unread-count').textContent=section.children.length}
  }
  function showDownloadResult(job){
    const dialog=reviewDialog('下载结果',`<p>${esc(job.title)} · ${esc(job.status)}</p><p>应打包 ${job.records.length} 份，完整打包 ${job.success} 份，失败 ${job.failures.length} 份。</p><p>打包数量不代表文件已保存到本机。</p>${job.failures.length?`<div class="table-wrap"><table class="table"><thead><tr><th>投稿编号</th><th>失败原因</th></tr></thead><tbody>${job.failures.map(f=>`<tr><td>${esc(f.code)}</td><td>${esc(f.reason)}</td></tr>`).join('')}</tbody></table></div>`:''}<div class="toolbar" data-download-actions></div>`);
    const actions=dialog.querySelector('[data-download-actions]'),blob=downloadBlobs.get(job.id);
    if(blob){const a=document.createElement('a');a.className='btn btn-primary';a.textContent='下载压缩包';a.href=URL.createObjectURL(blob);a.download=`${safeName(job.title)}_${new Date(job.createdAt).toISOString().slice(0,10).replaceAll('-','')}_${job.id}.zip`;actions.append(a);dialog.addEventListener('close',()=>URL.revokeObjectURL(a.href))}
    else if(!['处理中','排队中'].includes(job.status)){const b=document.createElement('button');b.className='btn';b.textContent='重新生成下载链接';b.onclick=()=>{dialog.close();dialog.remove();runDownload(job)};actions.append(b)}
    if(job.failures.length){const retry=document.createElement('button');retry.className='btn';retry.textContent='重试失败作品';retry.onclick=async()=>{const ids=new Set(job.failures.map(f=>f.id));if(await queueDownload(job.records.filter(s=>ids.has(s.id)),job.mode,job.id)){dialog.close();dialog.remove();toast('失败作品已重新加入下载队列')}};actions.append(retry)}
  }
  function openMasterBatch(records,onAccepted){
    const entries=records.map(s=>({id:s.id,code:s.code,name:s.workName,reason:masterBlock(s)})),allowed=entries.filter(e=>!e.reason);
    reviewDialog('批量推送至主数据',`<p>已选 ${entries.length} 条，可推送 ${allowed.length} 条，跳过 ${entries.length-allowed.length} 条。</p><div class="table-wrap"><table class="table"><thead><tr><th>投稿编号</th><th>作品名称</th><th>预检结果</th></tr></thead><tbody>${entries.map(e=>`<tr><td>${esc(e.code)}</td><td>${esc(e.name)}</td><td>${esc(e.reason||'可推送')}</td></tr>`).join('')}</tbody></table></div>`,allowed.length?async()=>{
      const batch={id:id('PUSH'),time:now(),role:currentRole(),items:[]};
      for(const e of entries){const s=data.submissions.find(x=>x.id===e.id),reason=masterBlock(s);if(reason){batch.items.push({...e,result:'跳过',reason});continue}
        const old=s.masterStatus,logs=(s.logs||[]).length;s.logs=s.logs||[];s.masterStatus='处理中';s.logs.push({stage:'主数据创建',result:'已受理',actor:roles[currentRole()],time:now(),reason:'批次 '+batch.id+'，等待主数据反馈'});
        if(await persist()){batch.items.push({...e,result:'已受理',reason:'等待主数据处理，不代表建档完成'});onAccepted?.(s.id)}else{s.masterStatus=old;s.logs.length=logs;batch.items.push({...e,result:'失败',reason:'请求未保存，可重试'})}
      }
      data.masterBatches=data.masterBatches||[];data.masterBatches.push(batch);await persist();retainedMasterSelection=batch.items.filter(i=>i.result!=='已受理').map(i=>i.id);render();setTimeout(()=>showMasterBatch(batch),0);return true;
    }:null,'确认推送');
  }
  function showMasterBatch(batch){reviewDialog('推送结果',`<p>${esc(batch.id)} · ${esc(batch.time)}</p><p>选中 ${batch.items.length}，已受理 ${batch.items.filter(i=>i.result==='已受理').length}，失败 ${batch.items.filter(i=>i.result==='失败').length}，跳过 ${batch.items.filter(i=>i.result==='跳过').length}。</p><div class="table-wrap"><table class="table"><thead><tr><th>投稿编号</th><th>结果</th><th>原因</th></tr></thead><tbody>${batch.items.map(i=>`<tr><td>${esc(i.code)}</td><td>${i.result}</td><td>${esc(i.reason)}</td></tr>`).join('')}</tbody></table></div>`,batch.items.some(i=>i.result==='失败')?()=>{setTimeout(()=>openMasterBatch(batch.items.filter(i=>i.result==='失败').map(i=>data.submissions.find(s=>s.id===i.id)).filter(Boolean)),0);return true}:null,'重试失败项')}
  let taskPaging={key:'',page:1};
  function paginateTaskView(){
    const area=$('#contentArea');if((area.dataset.route||'list')!=='list'||currentRole()==='college')return;
    const grid=area.querySelector('.task-grid'),table=area.querySelector('table');const host=grid||table;
    if(!host||host.dataset.paged)return;host.dataset.paged='true';
    const q=$('#taskSearch').value.trim().toLowerCase(),status=$('#statusFilter').value,tab=$('#workspaceTabs .active')?.dataset.tab||'current';
    const filters=document.querySelector('[aria-label="任务筛选"]');
    if(!$('#taskSchoolFilter')){
      const oldTime=[...filters.querySelectorAll('.field')].find(x=>x.querySelector('label')?.textContent==='时间范围');if(oldTime)oldTime.remove();
      filters.insertAdjacentHTML('beforeend',`<div class="field"><label>学校</label><input class="control" id="taskSchoolFilter"></div><div class="field"><label>班级</label><input class="control" id="taskClassFilter"></div>${[['created','创建时间'],['start','征集开始'],['deadline','投稿截止']].map(([key,label])=>`<div class="field"><label>${label}</label><div style="display:flex;gap:8px"><input aria-label="${label}起" class="control" type="date" id="task-${key}-from"><input aria-label="${label}止" class="control" type="date" id="task-${key}-to"></div></div>`).join('')}`);
      filters.append(filters.querySelector('.button-row'));filters.style.flexWrap='wrap';
      $('#resetBtn').addEventListener('click',()=>{filters.querySelectorAll('input').forEach(x=>x.value='');render()});
    }
    const school=$('#taskSchoolFilter').value.trim(),className=$('#taskClassFilter').value.trim();
    const ranges=['created','start','deadline'].map(k=>[k,$('#task-'+k+'-from').value,$('#task-'+k+'-to').value]);
    const schoolOf=t=>t.school||t.schoolName||t.publishFields?.['学校']||'';
    const classOf=t=>t.className||t.class||t.publishFields?.['班级']||'';
    const timeOf=(t,k)=>k==='created'?t.createdAt:t[k];
    const dateOf=v=>{if(!v)return '';const d=new Date(v);return isNaN(d)?'':`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
    const key=[currentRole(),tab,q,status,school,className,JSON.stringify(ranges)].join('|');if(key!==taskPaging.key)taskPaging={key,page:1};
    const items=grid?[...grid.children]:[...table.tBodies[0].rows];
    const taskFor=item=>data.tasks.find(x=>x.id===item.querySelector('[data-act="task-detail"]')?.dataset.id);
    const fields=[['学校',schoolOf],['班级',classOf],['创建时间',t=>t.createdAt?formatListTime(t.createdAt):'—'],['征集开始',t=>t.start?formatListTime(t.start):'—'],['投稿截止',t=>t.deadline?formatListTime(t.deadline):'—']];
    if(tab==='drafts')fields.push(['最后修改时间',t=>t.updatedAt?formatListTime(t.updatedAt):'—']);
    if(table){const header=table.tHead.rows[0],mode=[...header.cells].findIndex(c=>c.textContent.trim()==='模式');if(mode>=0){header.deleteCell(mode);items.forEach(row=>row.deleteCell(mode))}fields.forEach(([name])=>{const th=document.createElement('th');th.textContent=name;header.insertBefore(th,header.lastElementChild)});items.forEach(row=>{const t=taskFor(row);if(!t)return;fields.forEach(([,get])=>{const td=document.createElement('td');td.textContent=get(t)||'—';td.style.whiteSpace='nowrap';row.insertBefore(td,row.lastElementChild)})})}
    else items.forEach(card=>{const t=taskFor(card);if(!t)return;const info=document.createElement('div');info.className='card-info';fields.forEach(([label,get])=>{const line=document.createElement('div');line.textContent=label+'：'+(get(t)||'—');info.append(line)});card.querySelector('.card-body')?.append(info)});
    const filtered=items.filter(item=>{const t=taskFor(item);return t&&(!q||(t.title+t.code+t.mode).toLowerCase().includes(q))&&(status==='all'||t.status===status)&&schoolOf(t).includes(school)&&classOf(t).includes(className)&&ranges.every(([k,a,b])=>{const d=dateOf(timeOf(t,k));return (!a||d&&d>=a)&&(!b||d&&d<=b)})});
    const pages=Math.max(1,Math.ceil(filtered.length/10));taskPaging.page=Math.min(taskPaging.page,pages);
    $('#resultCount').textContent=`共 ${filtered.length} 条任务`;
    $$('#workspaceTabs [data-tab]').forEach(el=>{const count=el.querySelector('.count');if(count)count.textContent=data.tasks.filter(t=>el.dataset.tab==='drafts'?t.draft:!t.draft).length});
    const pager=document.createElement('div');pager.className='toolbar';pager.style.cssText='display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:16px';
    (grid||table.closest('.table-wrap')).after(pager);
    const paint=()=>{items.forEach(item=>item.hidden=!filtered.slice((taskPaging.page-1)*10,taskPaging.page*10).includes(item));pager.innerHTML=`<span>共 ${filtered.length} 条</span><button class="btn" data-prev ${taskPaging.page===1?'disabled':''}>上一页</button><span>第 ${taskPaging.page} / ${pages} 页 · 每页10条</span><button class="btn" data-next ${taskPaging.page===pages?'disabled':''}>下一页</button>`;pager.querySelector('[data-prev]').onclick=()=>{taskPaging.page--;paint()};pager.querySelector('[data-next]').onclick=()=>{taskPaging.page++;paint()}};paint();
    if(!filtered.length){const empty=document.createElement('p');empty.className='empty-tip';empty.textContent='没有符合筛选条件的任务';pager.before(empty)}
  }
  async function ensureTaskPagingFixtures(){
    if(data.taskPagingFixtureVersion)return;
    const sample=data.tasks.find(t=>t.id==='TASK-SCHOOL-001')||data.tasks[0];if(!sample)return;
    for(let i=1;i<=30;i++){const key='TASK-PAGING-'+i;if(data.tasks.some(t=>t.id===key))continue;const status=['收稿中','未开始','已结束','已终止','已下线'][i%5];data.tasks.push({...JSON.parse(JSON.stringify(sample)),id:key,code:'LT-COURSE-'+String(i).padStart(3,'0'),title:`院校课程作品征集 · 第${i}组`,status,draft:false,submissionIds:[],linkGenerated:false,classCode:'',start:status==='未开始'?'2027-11-01T09:00':'2026-10-01T09:00',deadline:status==='已结束'?'2026-10-20T18:00':'2027-11-30T18:00'})}
    data.taskPagingFixtureVersion=1;await persist();
  }
  const reviewedRender=render;
  render=function(){reviewedRender();paginateTaskView();renderJobMessages();
    $('#taskViewToolbar')?.remove();
    const viewSwitch=$('#contentArea .view-switch');
    if(viewSwitch){viewSwitch.id='taskViewToolbar';viewSwitch.style.margin='-8px 0 16px';$('.workspace').before(viewSwitch)}
    $('#masterPermissionDemo')?.remove();if(currentRole()==='brandReviewer'){
      const label=document.createElement('label');label.id='masterPermissionDemo';label.style.cssText='font-size:12px;margin-left:8px';label.innerHTML=`创建权限（演示） <select aria-label="主数据创建权限演示"><option value="yes">有权限</option><option value="no">无权限</option></select>`;
      $('#roleSelect').parentElement.after(label);label.querySelector('select').value=data.masterCreatePermissions?.brandReviewer===false?'no':'yes';label.querySelector('select').onchange=async e=>{data.masterCreatePermissions={...(data.masterCreatePermissions||{}),brandReviewer:e.target.value==='yes'};await persist();render()};
    }
  };
  $('#workspaceTabs').addEventListener('click',()=>queueMicrotask(paginateTaskView));
  $('#notifications-trigger').addEventListener('click',renderJobMessages);
  init().then(async()=>{
    ensureLinkedDemoButton();
    await ensurePrototypeCoverage();
    await ensureTaskPagingFixtures();render();renderJobMessages();
    (data.downloadJobs||[]).filter(j=>['处理中','排队中'].includes(j.status)).forEach(j=>{delete j.running;setTimeout(()=>runDownload(j),100)});
    const params=new URLSearchParams(location.hash.slice(1));
    const target=data.tasks.find(t=>t.id===params.get('task'));
    if(target){currentTaskId=target.id;$('#roleSelect').value='college';$('#contentArea').dataset.route='college-form';render()}
  });
})();
