<!DOCTYPE html>
<!--
  @module    D09-退市管理
  @version   V3.0-变体5
  @layout    L-D09-01 标准列表骨架（列表与搜索形态与变体4 1:1 一致，仅重排布局）
  @style     方案 D 延展 · 深色顶栏 + 深 navy 文本侧栏 + 白色页签条
  @shell     截图壳要素：顶栏（双行 logo + 汉堡 + 系统名 + 全局搜索 + 角色/通知/头像）；
             200px 文本侧栏（汉堡可折叠，一级分组可展开）；页签条（可关闭 + 「标签选项」浮层：刷新当前页/关闭其它/关闭所有）
  @base      功能与交互 1:1 移植自 变体4 V2.1（浅色顶栏页签），
             数据/筛选语义/操作/反馈/空态/弹窗全部不变
  @coverage  功能覆盖见 功能覆盖对照表.md（变体5 增补节）；截图对齐项与偏离项见 README-变体说明.md
  @note      截图壳对 DS 默认壳的偏离（延续变体4 已批准例外口径）：① 无 4px 品牌条；
             ② 侧栏为文本导航。另按变体4 治理决议不设置：导出按钮、帮助入口、国家选择器（均无 PRD 依据）。
             客户若选定此风格，需先在《布局变体规范》注册「壳层变体：深色顶栏 + 深 navy 文本侧栏 + 页签条」。
-->
<html lang="zh-CN" data-brand="blue" data-theme="light" data-layout="L-D09-01">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>D09 退市管理 · 深色顶栏 + 深 navy 文本侧栏</title>
<link rel="stylesheet" href="../../../03-设计体系/AI-PIM-Design-System/02-Design-Token/tokens/tokens.css" />
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  :root {
    /* —— 截图壳层 token（ 参考截图取色；壳层例外已写入文件头 @note）—— */
    --d-primary: #2D6CEE; --d-primary-hover: #4A82F2; --d-primary-active: #1F54C4; --d-primary-bg: #EAF1FE;
    --d-topbar: #1C2735;            /* 截图顶栏：近黑深蓝 */
    --d-sidebar: #26334A;           /* 截图侧栏：深 navy */
    --d-sidebar-hover: #313F5C;
    --d-sidebar-active: #3B4C6E;    /* 截图选中态：侧栏提亮 + 蓝左指示条 */
    --d-border: #E3E9F1;            /* 分区线 */
    --d-border-strong: #D6DEE9;     /* 控件描边 */
    --d-page: #FFFFFF;              /* 截图内容区：白底直铺 */
    --d-th-bg: #F5F7FA;             /* 截图表头：浅灰 */
    --d-row-line: #EDF1F7;          /* 行分隔线 */
    --d-row-hover: #F5F8FF;
    --d-text: #1F2733; --d-text-2: #5B6B80; --d-text-3: #8A97A8;
    --d-red: #E64545;               /* 截图徽标红（通知计数） */
    --d-radius: 4px;
  }
  body { font-family: var(--font-family-base, -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif);
    font-size: var(--font-size-body-sm); color: var(--d-text);
    background: var(--d-page); display: flex; flex-direction: column; overflow: hidden; }
  [x-cloak] { display: none !important; }
  button { font-family: inherit; cursor: pointer; background: none; border: 0; padding: 0; color: inherit; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--d-primary); outline-offset: 1px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* ===== 顶栏（ 截图风：近黑深蓝 + 双行 logo + 居中全局搜索）===== */
  .topbar { flex: 0 0 auto; height: 48px; background: var(--d-topbar); color: #fff;
    display: flex; align-items: center; gap: 14px; padding: 0 16px; }
  .brand { display: flex; flex-direction: column; line-height: 1.15; flex-shrink: 0; }
  .brand b { font-size: 15px; font-weight: 700; letter-spacing: .06em; }
  .brand span { font-size: 10px; color: rgba(255,255,255,.55); letter-spacing: .14em; }
  .ham { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 4px;
    color: rgba(255,255,255,.85); flex-shrink: 0; }
  .ham:hover { background: rgba(255,255,255,.1); }
  .ham svg { width: 17px; height: 17px; }
  .sys-name { font-size: 15px; font-weight: var(--font-weight-medium); letter-spacing: .02em; flex-shrink: 0; }
  .top-search { display: flex; align-items: center; gap: 6px; height: 30px; width: 300px; padding: 0 3px 0 12px;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; flex-shrink: 0; }
  .top-search input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #fff; font-size: 13px; }
  .top-search input::placeholder { color: rgba(255,255,255,.45); }
  .search-go { width: 24px; height: 24px; border-radius: 999px; background: var(--d-primary); color: #fff;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .search-go:hover { background: var(--d-primary-hover); }
  .search-go svg { width: 12px; height: 12px; }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .role-sel { height: 28px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
    border-radius: 4px; color: rgba(255,255,255,.85); font-size: 12px; padding: 0 6px; }
  .role-sel option { color: var(--d-text); background: #fff; }
  .top-icon { position: relative; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    border-radius: 4px; color: rgba(255,255,255,.85); }
  .top-icon:hover { background: rgba(255,255,255,.1); }
  .top-icon svg { width: 17px; height: 17px; }
  .badge-dot { position: absolute; top: -1px; right: -3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
    background: var(--d-red); color: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; }
  .avatar { width: 28px; height: 28px; border-radius: 999px; background: var(--d-primary); color: #fff; font-size: 11px;
    display: flex; align-items: center; justify-content: center; font-weight: 600; }

  .shell-body { flex: 1 1 auto; min-height: 0; display: flex; }

  /* ===== 侧栏（截图风：深 navy 文本导航，一级分组可展开，汉堡可整栏折叠）===== */
  .sidebar { flex: 0 0 200px; width: 200px; background: var(--d-sidebar); display: flex; flex-direction: column;
    padding: 8px 0; overflow-y: auto; overflow-x: hidden; white-space: nowrap;
    transition: flex-basis var(--motion-base) var(--ease-standard), width var(--motion-base) var(--ease-standard); }
  .sidebar.collapsed { flex-basis: 0; width: 0; }
  .side-item { display: flex; align-items: center; width: 100%; text-align: left; min-height: 38px; padding: 0 16px;
    font-size: 13px; color: rgba(255,255,255,.78); border-left: 3px solid transparent; }
  .side-item:hover { background: var(--d-sidebar-hover); color: #fff; }
  .side-item.active { background: var(--d-sidebar-active); color: #fff; font-weight: var(--font-weight-medium);
    border-left-color: var(--d-primary); }
  .side-parent { justify-content: space-between; }
  .side-parent .caret { font-size: 10px; color: rgba(255,255,255,.5); font-style: normal; margin-left: 8px; }
  .side-group.open .side-parent .caret { transform: rotate(180deg); display: inline-block; }
  .side-child { padding-left: 30px; min-height: 34px; }

  .main { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--d-page); }

  /* ===== 页签条（截图风：白底、可关闭、右侧「标签选项」浮层）===== */
  .page-tabs { flex: 0 0 auto; height: 40px; background: var(--d-page); border-bottom: 1px solid var(--d-border);
    display: flex; align-items: flex-end; padding: 0 12px; gap: 2px; }
  .ptab { position: relative; height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px;
    font-size: 13px; color: var(--d-text-2); border-radius: 4px 4px 0 0; white-space: nowrap; }
  .ptab:hover { color: var(--d-primary); background: var(--d-row-hover); }
  .ptab.active { color: var(--d-primary); font-weight: var(--font-weight-medium); background: var(--d-page);
    box-shadow: inset 0 2px 0 var(--d-primary); }
  .ptab .x { width: 14px; height: 14px; border-radius: 3px; display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--d-text-3); }
  .ptab .x:hover { background: #FDECEC; color: var(--d-red); }
  .tabs-more { margin-left: auto; position: relative; height: 32px; display: flex; align-items: center; }
  .tabs-more > button { display: inline-flex; align-items: center; gap: 4px; padding: 0 10px; font-size: 13px; color: var(--d-text-2); }
  .tabs-more > button:hover { color: var(--d-primary); }
  .tabs-menu { position: absolute; right: 0; top: 100%; z-index: var(--z-index-dropdown, 100); min-width: 124px;
    background: #fff; border: 1px solid var(--d-border); border-radius: var(--d-radius); box-shadow: var(--shadow-2); padding: 4px; }
  .tabs-menu button { display: block; width: 100%; text-align: left; padding: 7px 10px; font-size: 13px; border-radius: 3px; color: var(--d-text); }
  .tabs-menu button:hover { background: var(--d-row-hover); color: var(--d-primary); }

  /* ===== 页头（截图：左上标题 + 蓝色主按钮）===== */
  .page-head { flex: 0 0 auto; background: var(--d-page); padding: 14px 20px 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .page-head--line { border-bottom: 1px solid var(--d-border); }
  .page-title { font-size: 16px; font-weight: var(--font-weight-semibold); margin: 0; }
  .crumb { font-size: 12px; color: var(--d-text-3); margin-bottom: 2px; }
  .crumb b { color: var(--d-text-2); font-weight: var(--font-weight-medium); }

  /* ===== 筛选区（截图风：白底直铺，标签上置 + 控件 30px + 蓝色查询）===== */
  .filterbar { flex: 0 0 auto; background: var(--d-page); padding: 0 20px 14px; }
  .status-row { display: flex; align-items: center; gap: 2px; padding: 4px 0 12px; border-bottom: 1px dashed var(--d-row-line); }
  .stab { height: 28px; display: inline-flex; align-items: center; gap: 5px; padding: 0 10px; font-size: 13px;
    color: var(--d-text-2); border-radius: var(--d-radius); white-space: nowrap; }
  .stab:hover { color: var(--d-primary); background: var(--d-row-hover); }
  .stab.active { color: var(--d-primary); font-weight: var(--font-weight-medium); background: var(--d-primary-bg); }
  .stab .cnt { color: var(--d-red); font-size: 12px; font-variant-numeric: tabular-nums; }
  .stab.active .cnt { color: var(--d-primary); }
  .collapse-link { margin-left: auto; font-size: 12px; color: var(--d-text-3); white-space: nowrap; padding: 4px 6px; }
  .collapse-link:hover { color: var(--d-primary); }

  .frow { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; padding: 12px 0 0; }
  .filterbar .frow:last-child { padding-bottom: 0; }
  .fcell { display: flex; flex-direction: column; gap: 4px; }
  .fcell > span { font-size: 12px; color: var(--d-text-3); }
  .fctl { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px;
    border: 1px solid var(--d-border-strong); border-radius: var(--d-radius); background: #fff;
    font-size: 13px; color: var(--d-text); }
  .fctl:hover { border-color: var(--d-primary); }
  .fctl select, .fctl input[type="date"] { border: 0; outline: none; background: transparent; font-size: inherit;
    color: inherit; font-family: inherit; height: 100%; padding: 0; max-width: 150px; }
  .fctl .caret { font-style: normal; font-size: 10px; color: var(--d-text-3); }
  .fctl--btn { color: var(--d-text-2); }
  .fctl--btn:hover { color: var(--d-primary); }
  .sep { width: 1px; height: 16px; background: var(--d-border-strong); margin: 0 2px; align-self: center; }

  .kw-wrap { position: relative; display: inline-block; }
  .kw-wrap input { height: 30px; width: 280px; border: 1px solid var(--d-border-strong); border-radius: var(--d-radius);
    padding: 0 10px 0 30px; font-size: 13px; background: #fff; font-family: inherit; }
  .kw-wrap input:focus { border-color: var(--d-primary); outline: none; box-shadow: 0 0 0 2px rgba(45,108,238,.15); }
  .kw-wrap svg { position: absolute; left: 9px; top: 8px; width: 14px; height: 14px; color: var(--d-text-3); }
  .btn-q { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 14px; border-radius: var(--d-radius);
    background: var(--d-primary); color: #fff; font-size: 13px; }
  .btn-q:hover { background: var(--d-primary-hover); }
  .btn-q svg { width: 13px; height: 13px; }
  .btn-r { height: 30px; padding: 0 14px; border: 1px solid var(--d-border-strong); border-radius: var(--d-radius);
    background: #fff; color: var(--d-text-2); font-size: 13px; }
  .btn-r:hover { color: var(--d-primary); border-color: var(--d-primary); }
  .flink { font-size: 12px; color: var(--d-text-3); white-space: nowrap; }
  .flink:hover { color: var(--d-primary); text-decoration: underline; }

  /* ===== 工具条（视图切换 + 图标化工具）===== */
  .toolbar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 20px;
    background: var(--d-page); border-bottom: 1px solid var(--d-border); }
  .toolbar .hint { font-size: 12px; color: var(--d-text-3); }
  .view-tabs { display: flex; gap: 2px; background: #F0F3F8; border-radius: var(--d-radius); padding: 2px; }
  .view-tab { height: 26px; padding: 0 12px; border-radius: 3px; font-size: 12px; color: var(--d-text-2); }
  .view-tab.active { background: #fff; color: var(--d-primary); font-weight: var(--font-weight-medium); box-shadow: var(--shadow-1); }
  .tool-icons { margin-left: auto; display: flex; gap: 6px; }
  .tool-icon { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--d-border-strong); border-radius: var(--d-radius); background: #fff; color: var(--d-text-2); }
  .tool-icon:hover { color: var(--d-primary); border-color: var(--d-primary); }
  .tool-icon.on { color: var(--d-primary); border-color: var(--d-primary); background: var(--d-primary-bg); }
  .tool-icon svg { width: 15px; height: 15px; }
  .tool-icon.spin svg { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .more-wrap { position: relative; }
  .col-panel { position: absolute; right: 0; top: 100%; margin-top: 4px; z-index: var(--z-index-dropdown, 100); width: 190px;
    background: #fff; border: 1px solid var(--d-border); border-radius: var(--d-radius); box-shadow: var(--shadow-2); padding: 10px 12px; }
  .col-panel .ttl { font-size: 13px; font-weight: var(--font-weight-medium); margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; }
  .col-panel .ttl button { font-size: 12px; color: var(--d-primary); }
  .col-panel label { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; }
  .col-panel .acts { display: flex; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--d-row-line); }
  .col-panel .acts button { font-size: 12px; color: var(--d-primary); }

  /* ===== 按钮 ===== */
  .btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 16px;
    border-radius: var(--d-radius); background: var(--d-primary); color: #fff; font-size: 13px; font-weight: var(--font-weight-medium); }
  .btn-primary:hover { background: var(--d-primary-hover); }
  .btn-primary[disabled] { opacity: .5; cursor: not-allowed; }
  .btn-plain { display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 12px;
    border-radius: var(--d-radius); background: #fff; border: 1px solid var(--d-border-strong); color: var(--d-text-2); font-size: 13px; }
  .btn-plain:hover { color: var(--d-primary); border-color: var(--d-primary); }

  /* ===== 表格（截图风：浅灰表头 + 细分隔线 + 蓝链主字段）===== */
  .table-wrap { flex: 1 1 auto; min-height: 160px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { position: sticky; top: 0; z-index: 10; background: var(--d-th-bg); color: var(--d-text-2);
    font-weight: var(--font-weight-medium); font-size: 13px; text-align: left; padding: 10px 12px;
    border-bottom: 1px solid var(--d-border); white-space: nowrap; }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--d-row-line); vertical-align: middle; }
  tbody tr:hover { background: var(--d-row-hover); }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--font-family-mono); font-size: 12px; }
  .cell-main { color: var(--d-primary); font-size: 13px; font-weight: var(--font-weight-medium); }
  .cell-main:hover { text-decoration: underline; }
  .cell-sub { color: var(--d-text-3); font-size: 12px; margin-top: 3px; }
  .cell-strong { font-weight: var(--font-weight-medium); }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 3px; white-space: nowrap; }
  .t-draft { color: var(--d-text-2); background: #F0F3F8; }
  .t-pending { color: var(--d-primary); background: var(--d-primary-bg); }
  .t-approved { color: #1E7A38; background: #E4F4E8; }
  .t-rejected { color: var(--color-danger); background: var(--color-danger-bg); }
  .t-cancelled { color: var(--d-text-3); background: #F0F3F8; }
  .t-retired { color: var(--d-text-2); background: #EDF1F7; }
  .t-revival { color: #B97900; background: #FDF3E0; }
  .t-delisting { color: var(--d-primary-active); background: var(--d-primary-bg); border: 1px solid rgba(45,108,238,.3); }
  .op-link { display: block; color: var(--d-primary); font-size: 13px; padding: 2px 0; }
  .op-link:hover { text-decoration: underline; }
  .op-link.muted { color: var(--d-text-2); }
  .op-link.muted:hover { color: var(--d-primary); }
  .compact tbody td { padding: 6px 12px; }
  .compact thead th { padding: 8px 12px; }
  .loose tbody td { padding: 14px 12px; }

  /* ===== 分页（截图风：右对齐 共N条 / 每页 / 前后页 / 前往N页）===== */
  .pager { flex: 0 0 auto; display: flex; align-items: center; justify-content: flex-end; gap: 10px;
    padding: 10px 16px; border-top: 1px solid var(--d-border); background: var(--d-page);
    font-size: 13px; color: var(--d-text-2); }
  .pager b { color: var(--d-text); font-weight: var(--font-weight-medium); }
  .pg-btn { min-width: 26px; height: 26px; border: 1px solid var(--d-border-strong); border-radius: 3px; background: #fff;
    font-size: 12px; color: var(--d-text-2); }
  .pg-btn:hover:not([disabled]) { color: var(--d-primary); border-color: var(--d-primary); }
  .pg-btn.cur { border-color: var(--d-primary); color: var(--d-primary); font-weight: var(--font-weight-medium); }
  .pg-btn[disabled] { opacity: .4; cursor: not-allowed; }
  .pager select, .pager .go input { height: 26px; border: 1px solid var(--d-border-strong); border-radius: 3px;
    font-size: 12px; background: #fff; font-family: inherit; color: var(--d-text); }
  .pager .go input { width: 40px; text-align: center; }

  /* ===== 空态 / 加载骨架 ===== */
  .empty { padding: 64px 0; text-align: center; color: var(--d-text-3); font-size: 13px; }
  .empty .sub { font-size: 12px; margin-top: 6px; }
  .skl { height: 14px; border-radius: 4px; background: linear-gradient(90deg, #eef1f6 25%, #e3e8f0 50%, #eef1f6 75%);
    background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* ===== Toast（PAGE-034：顶部居中，图标+文字，3~5s）===== */
  .toast-stack { position: fixed; top: 58px; left: 50%; transform: translateX(-50%); z-index: var(--z-index-message, 500);
    display: flex; flex-direction: column; gap: 8px; }
  .toast { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--d-border);
    border-radius: var(--d-radius); box-shadow: var(--shadow-2); padding: 9px 16px; font-size: 13px; animation: tin .2s ease; }
  @keyframes tin { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  .toast.success { color: var(--color-success); } .toast.error { color: var(--color-danger); } .toast.info { color: var(--d-primary); }

  /* ===== Modal ===== */
  .mask { position: fixed; inset: 0; background: var(--color-mask); z-index: var(--z-index-overlay, 200);
    display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px 16px; }
  .modal { background: #fff; border-radius: var(--radius-md); box-shadow: var(--shadow-3); width: 660px; max-width: 100%;
    max-height: 90vh; display: flex; flex-direction: column; animation: min .2s var(--ease-decelerate); }
  .modal.wide { width: 860px; }
  @keyframes min { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
  .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px;
    border-bottom: 1px solid var(--d-row-line); }
  .modal-title { font-size: var(--font-size-body-lg); font-weight: var(--font-weight-semibold); }
  .modal-body { padding: 14px 18px; overflow: auto; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 18px; border-top: 1px solid var(--d-row-line); }
  .icon-x { font-size: 14px; color: var(--d-text-3); padding: 4px 8px; border-radius: 4px; }
  .icon-x:hover { background: #F0F3F8; color: var(--d-red); }
  .modal .frow { padding: 0 0 10px; }
  .modal table { font-size: 13px; }
  .modal thead th { padding: 8px 10px; }
  .modal tbody td { padding: 8px 10px; }

  /* ===== 详情/表单页 ===== */
  .form-page { flex: 1 1 auto; overflow-y: auto; padding: 14px 20px 100px; }
  .form-card { background: #fff; border: 1px solid var(--d-border); border-radius: var(--radius-md); padding: 18px 22px; max-width: 960px; }
  .form-card h2 { font-size: var(--font-size-title-sm); font-weight: var(--font-weight-semibold); margin: 0 0 16px; }
  .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .form-item { display: flex; flex-direction: column; gap: 6px; }
  .form-item.wide { grid-column: 1 / -1; }
  .form-item label { font-size: 13px; font-weight: var(--font-weight-medium); }
  .req { color: var(--color-danger); margin-right: 2px; }
  .err { font-size: 12px; color: var(--color-danger); }
  .form-item input, .form-item select, .form-item textarea { border: 1px solid var(--d-border-strong);
    border-radius: var(--d-radius); padding: 8px 10px; font-size: 13px; font-family: inherit; background: #fff; }
  .form-item input:focus, .form-item select:focus, .form-item textarea:focus {
    border-color: var(--d-primary); box-shadow: 0 0 0 2px rgba(45,108,238,.15); outline: none; }
  .form-item.has-err input, .form-item.has-err select, .form-item.has-err textarea { border-color: var(--color-danger); }
  .sticky-foot { position: sticky; bottom: 0; background: var(--d-page); border-top: 1px solid var(--d-border);
    padding: 10px 20px; display: flex; justify-content: flex-end; gap: 8px; }
  .lines-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  .lines-table th { background: var(--d-th-bg); text-align: left; padding: 6px 10px; font-weight: var(--font-weight-medium); color: var(--d-text-2); }
  .lines-table td { padding: 6px 10px; border-bottom: 1px solid var(--d-row-line); }
  .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 16px; font-size: 13px; margin-bottom: 12px; }
  .detail-grid .k { color: var(--d-text-3); font-size: 12px; }

  /* 审批进度 */
  .flow { display: flex; align-items: center; margin: 6px 0 14px; }
  .flow-node { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 72px; }
  .flow-dot { width: 10px; height: 10px; border-radius: 999px; background: var(--d-border-strong); }
  .flow-node.done .flow-dot { background: var(--d-primary); }
  .flow-node.cur .flow-dot { background: #fff; border: 2px solid var(--d-primary); }
  .flow-lab { font-size: 12px; color: var(--d-text-3); white-space: nowrap; }
  .flow-node.done .flow-lab, .flow-node.cur .flow-lab { color: var(--d-text); }
  .flow-line { flex: 1; height: 2px; background: var(--d-border-strong); margin: 0 4px 18px; }
  .flow-line.done { background: var(--d-primary); }
  .opinion { border-left: 2px solid var(--d-border-strong); padding: 4px 0 4px 10px; margin: 8px 0 0 4px;
    font-size: 12px; color: var(--d-text-2); }
  .opinion b { color: var(--d-text); }

  /* 操作日志时间轴 */
  .log-rail { position: relative; }
  .log-rail::before { content: ''; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 2px; background: var(--d-row-line); }
  .log-item { display: flex; gap: 12px; padding-bottom: 16px; }
  .log-dot { width: 12px; height: 12px; border-radius: 999px; background: var(--d-primary); border: 2px solid #fff;
    box-shadow: 0 0 0 2px var(--d-primary-bg); flex-shrink: 0; margin-top: 3px; position: relative; z-index: 1; }
  .log-dot.muted { background: #8C8C8C; box-shadow: 0 0 0 2px #EDF1F7; }
  .log-dot.warn { background: #B97900; box-shadow: 0 0 0 2px #FDF3E0; }
  .log-dot.ok { background: #1E7A38; box-shadow: 0 0 0 2px #E4F4E8; }

  /* 开关 + 渠道多选 */
  .switch { position: relative; width: 40px; height: 20px; border-radius: 999px; background: #CBD5E3; transition: background var(--motion-fast); border: 0; }
  .switch.on { background: var(--d-primary); }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 999px;
    background: #fff; transition: left var(--motion-fast); }
  .switch.on::after { left: 22px; }
  .ch-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .ch-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--d-border-strong);
    border-radius: var(--d-radius); font-size: 13px; }

  @media (max-width: 992px) {
    .sidebar { display: none; }
    .top-search { width: 200px; }
    .form-grid { grid-template-columns: 1fr; }
    .detail-grid { grid-template-columns: 1fr; }
    .ch-grid { grid-template-columns: repeat(2,1fr); }
  }
</style>
</head>
<body x-data="d09()" x-cloak @keydown.escape.window="esc()">

  <!-- ===== 顶栏（ 截图风）===== -->
  <header class="topbar">
    <div class="brand"><b>ZIPPO</b><span>AI-PIM</span></div>
    <button type="button" class="ham" :aria-label="sidebarOpen ? '收起导航菜单' : '展开导航菜单'"
            :aria-expanded="sidebarOpen ? 'true' : 'false'" @click="sidebarOpen=!sidebarOpen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="sys-name">商品中心</div>
    <div class="top-search" role="search">
      <input type="text" x-model="globalKw" placeholder="请输入申请单号 / SKU / 申请人"
             aria-label="全局搜索" @keydown.enter="globalSearch()">
      <button type="button" class="search-go" aria-label="搜索" @click="globalSearch()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
    </div>
    <div class="top-right">
      <select class="role-sel" x-model="role" @change="onRoleChange()" aria-label="演示角色">
        <option value="BRAND_ADMIN">品牌管理员</option>
        <option value="BRAND_OPERATOR">品牌业务</option>
        <option value="DISTRIBUTOR">经销商（无入口）</option>
      </select>
      <button type="button" class="top-icon" aria-label="通知" @click="toast('暂无新通知','info')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
        <span class="badge-dot">99+</span>
      </button>
      <div class="avatar" aria-hidden="true">演</div>
    </div>
  </header>

  <div class="shell-body">
    <!-- ===== 深 navy 文本侧栏（截图风；一级分组可展开，汉堡整栏折叠）===== -->
    <aside class="sidebar" :class="{collapsed: !sidebarOpen}" aria-label="模块导航">
      <button type="button" class="side-item" @click="toast('首页不属于本演示范围','info')">首页</button>
      <button type="button" class="side-item" @click="toast('商品管理为 D07，不属于本演示范围','info')">商品管理</button>
      <div class="side-group" :class="{open: navOpen}">
        <button type="button" class="side-item side-parent" :aria-expanded="navOpen ? 'true' : 'false'" @click="navOpen=!navOpen">
          <span>退市管理</span><i class="caret">▾</i>
        </button>
        <div x-show="navOpen" x-cloak>
          <button type="button" class="side-item side-child"
                  :class="(page==='applyList'||page==='applyDetail'||page==='applyEdit'||page==='flowPage') ? 'active' : ''"
                  @click="go('applyList')">退市申请</button>
          <button type="button" class="side-item side-child"
                  :class="(page==='executeList'||page==='skuDetail') ? 'active' : ''"
                  @click="go('executeList')">退市执行</button>
          <button type="button" class="side-item side-child"
                  :class="page==='settings' ? 'active' : ''"
                  @click="go('settings')">退市配置</button>
        </div>
      </div>
      <button type="button" class="side-item" @click="toast('系统设置为 D13，不属于本演示范围','info')">系统设置</button>
    </aside>

    <main class="main">
      <!-- ===== 页签条（截图风：可关闭 + 标签选项浮层）===== -->
      <nav class="page-tabs" aria-label="已打开页面">
        <template x-for="t in tabs" :key="t.id">
          <button type="button" class="ptab" :class="activeTab===t.id ? 'active' : ''" @click="switchTab(t.id)">
            <span x-text="t.label"></span>
            <span class="x" x-show="t.closable" role="button" tabindex="0" title="关闭页签"
                  @click.stop="closeTab(t.id)" @keydown.enter.stop="closeTab(t.id)">✕</span>
          </button>
        </template>
        <div class="tabs-more" @click.outside="tabsMenuOpen=false">
          <button type="button" @click="tabsMenuOpen=!tabsMenuOpen" :aria-expanded="tabsMenuOpen ? 'true' : 'false'">
            标签选项 <i class="caret" style="font-style:normal;font-size:10px;">⌄</i>
          </button>
          <div class="tabs-menu" x-show="tabsMenuOpen" x-cloak role="menu">
            <button role="menuitem" @click="refreshCurrentTab(); tabsMenuOpen=false">刷新当前页</button>
            <button role="menuitem" @click="closeOtherTabs(); tabsMenuOpen=false">关闭其它</button>
            <button role="menuitem" @click="closeAllTabs(); tabsMenuOpen=false">关闭所有</button>
          </div>
        </div>
      </nav>

      <!-- 无权限提示（经销商角色） -->
      <template x-if="!canDelist">
        <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:20px;">
          <div style="text-align:center;color:var(--d-text-3);">
            <div style="font-size:15px;font-weight:var(--font-weight-semibold);color:var(--d-text);">当前角色无退市管理入口</div>
            <div class="cell-sub" style="margin-top:6px;">经销商默认无入口，请切换演示角色为「品牌管理员 / 品牌业务」。</div>
          </div>
        </div>
      </template>

      <!-- 页签全部关闭占位 -->
      <template x-if="canDelist && page==='closed'">
        <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:20px;">
          <div style="text-align:center;">
            <div style="font-size:15px;font-weight:var(--font-weight-semibold);color:var(--d-text);">所有页签已关闭</div>
            <div style="margin-top:6px;font-size:13px;color:var(--d-text-3);">可点击左侧导航或下方按钮重新打开模块页面。</div>
            <div style="margin-top:14px;"><button class="btn-primary" @click="go('applyList')">打开退市申请</button></div>
          </div>
        </div>
      </template>

      <!-- ================= 退市申请列表（列表与搜索形态同变体4）================= -->
      <template x-if="canDelist && page==='applyList'">
        <div style="display:flex;flex-direction:column;flex:1;min-height:0;">
          <!-- 页头：标题 + 唯一 Primary（截图：左上角标题 + 蓝色主按钮） -->
          <div class="page-head">
            <h1 class="page-title">退市申请</h1>
            <button data-action="product.create" class="btn-primary" @click="openNew()">＋ 新建退市申请</button>
          </div>

          <!-- 筛选区：状态页签 + 条件筛选（关键词紧随提交时间止）+ 展开态更多筛选（字段与变体4 完全一致，仅布局按截图重排） -->
          <div class="filterbar" role="group" aria-label="筛选条件">
            <div class="status-row">
              <template x-for="t in statusTabs" :key="t.key">
                <button type="button" class="stab" :class="filters.status===t.key ? 'active' : ''"
                        @click="filters.status=t.key; page1=1;">
                  <span x-text="t.label"></span><span class="cnt" x-text="t.count"></span>
                </button>
              </template>
              <button type="button" class="collapse-link" @click="filterExpanded=!filterExpanded"
                      x-text="filterExpanded ? '收起 ▴' : '展开 ▾'"></button>
            </div>
            <div class="frow">
              <label class="fcell"><span>退市原因</span>
                <span class="fctl"><select x-model="filters.reason">
                  <option value="">全部</option>
                  <template x-for="r in REASONS" :key="r"><option :value="r" x-text="r"></option></template>
                </select><i class="caret">▾</i></span></label>
              <label class="fcell"><span>提交时间起</span>
                <span class="fctl"><input type="date" x-model="filters.ds"></span></label>
              <label class="fcell"><span>提交时间止</span>
                <span class="fctl"><input type="date" x-model="filters.de"></span></label>
              <label class="fcell"><span>关键词</span>
                <span class="kw-wrap">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                  <input type="text" x-model="filters.kw" placeholder="申请单号 / SKU / 申请人" aria-label="关键词">
                </span></label>
              <button data-action="common.search" class="btn-q" @click="search()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>查询</button>
              <button data-action="common.reset" class="btn-r" @click="resetFilter()">重置</button>
              <span style="margin-left:auto;display:flex;gap:14px;align-items:center;">
                <button class="flink" data-action="RefreshList" @click="refresh()">列表状态刷新</button>
                <button class="flink" data-action="SimulateLoadFailure" @click="search(true)">模拟加载失败</button>
              </span>
            </div>
            <!-- 展开态：更多筛选条件（仅作用于筛选框，不改变表格形态） -->
            <div class="frow" x-show="filterExpanded" x-cloak>
              <label class="fcell"><span>申请人</span>
                <span class="fctl"><select x-model="filters.applicant">
                  <option value="">全部</option><option>张晓峰</option><option>李婷</option><option>王浩</option>
                </select><i class="caret">▾</i></span></label>
              <button type="button" class="fctl fctl--btn" @click="toast('排序：提交时间 降序（演示占位）','info')">排序：提交时间 <i class="caret">▾</i></button>
              <span class="sep"></span>
              <button type="button" class="fctl fctl--btn" @click="toast('更多筛选为演示占位','info')">更多筛选 <i class="caret">▾</i></button>
              <button type="button" class="fctl fctl--btn" @click="toast('常用筛选为演示占位','info')">常用筛选 <i class="caret">▾</i></button>
            </div>
          </div>

          <!-- 工具条：视图切换 + 图标化工具（列显隐/密度/全屏） -->
          <div class="toolbar">
            <div class="view-tabs" role="tablist" aria-label="视图切换">
              <button class="view-tab active" role="tab" aria-selected="true">申请单</button>
              <button class="view-tab" role="tab" aria-selected="false" @click="go('executeList')">执行记录</button>
            </div>
            <div class="tool-icons">
              <button class="tool-icon" :class="{spin: refreshing}" title="刷新" aria-label="刷新" @click="refresh()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
              </button>
              <span class="more-wrap">
                <button class="tool-icon" :class="colOpen ? 'on' : ''" title="列筛选" aria-label="列筛选" @click="colOpen=!colOpen">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></svg>
                </button>
                <div class="col-panel" x-show="colOpen" x-cloak @click.outside="colOpen=false">
                  <div class="ttl">列显示 <button @click="resetColumns()">重置</button></div>
                  <template x-for="c in columns" :key="c.key">
                    <label><input type="checkbox" x-model="c.on" :disabled="c.key==='op'"><span x-text="c.label"></span></label>
                  </template>
                  <div class="acts">
                    <button @click="columns.forEach(c=>c.on=true); colOpen=false">全选</button>
                    <button @click="colOpen=false">完成</button>
                  </div>
                </div>
              </span>
              <button class="tool-icon" :class="density!=='default' ? 'on' : ''" :title="'密度：' + densityLabel()"
                      :aria-label="'密度：' + densityLabel()" @click="cycleDensity()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
              </button>
              <button class="tool-icon" title="全屏" aria-label="全屏" @click="toggleFullscreen()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M8 21H5a2 2 0 01-2-2v-3M16 21h3a2 2 0 012-2v-3"/></svg>
              </button>
            </div>
          </div>

          <!-- 表格（信息块表格，形态与变体4 一致；列显隐/密度由工具条控制） -->
          <div class="table-wrap">
            <template x-if="loading">
              <div style="padding:16px;display:flex;flex-direction:column;gap:12px;" aria-busy="true">
                <div class="skl" style="width:60%"></div><div class="skl" style="width:80%"></div><div class="skl" style="width:50%"></div><div class="skl" style="width:70%"></div>
              </div>
            </template>
            <template x-if="!loading && listError">
              <div class="empty">
                <div style="color:var(--d-text);">列表加载失败</div>
                <div class="sub">无法获取退市申请数据，请检查网络后重试。</div>
                <div style="margin-top:12px;"><button class="btn-primary" @click="search(false)">重试</button></div>
              </div>
            </template>
            <template x-if="!loading && !listError && filtered.length===0">
              <div class="empty">
                <template x-if="isFilterEmpty()"><div>
                  <div>暂无退市申请单</div><div class="sub">可新建申请，发起后在此追踪审批与执行进度。</div>
                  <div style="margin-top:12px;"><button class="btn-primary" @click="openNew()">新建退市申请</button></div>
                </div></template>
                <template x-if="!isFilterEmpty()"><div>
                  <div>未找到符合条件的申请单</div><div class="sub">建议调整筛选条件后重新查询。</div>
                  <div style="margin-top:12px;"><button class="btn-r" @click="resetFilter()">清空筛选</button></div>
                </div></template>
              </div>
            </template>
            <table x-show="!loading && !listError && filtered.length" :class="density">
              <thead><tr>
                <th x-show="col('info')">申请信息</th><th x-show="col('reason')">退市原因</th><th x-show="col('lines')">关联明细</th><th x-show="col('time')">时间信息</th><th x-show="col('status')">状态 · 当前节点</th><th style="position:sticky;right:0;">操作</th>
              </tr></thead>
              <tbody>
                <template x-for="row in paged" :key="row.id">
                  <tr>
                    <td x-show="col('info')">
                      <button class="cell-main" :aria-label="'详情 ' + row.formNo" @click="openDetail(row)" x-text="row.formNo"></button>
                      <div class="cell-sub">申请人：<span x-text="row.applicant"></span></div>
                    </td>
                    <td x-show="col('reason')"><div class="cell-strong" x-text="row.reason"></div><div class="cell-sub" x-text="row.note ? row.note.slice(0,18) + (row.note.length>18?'…':'') : '—'"></div></td>

                    <td x-show="col('time')"><div class="cell-sub">提交 <span class="num" x-text="row.submittedAt"></span></div><div class="cell-sub">预计 <span class="num" x-text="row.planDate"></span></div></td>

                <div style="display:flex;justify-content:space-between;"><dt class="cell-sub" style="margin:0;">预计退市</dt><dd style="margin:0;" x-text="currentSku.planDate"></dd></div>

              <div x-show="currentSku.status==='REVIVAL_PENDING'" style="margin-top:14px;border:1px solid rgba(45,108,238,.25);background:var(--d-primary-bg);border-radius:4px;padding:10px 12px;font-size:12px;color:var(--d-primary-active);">

    get pagedCatalog(){ const s=(this.pickerPage-1)*this.pickerPageSize; return this.filteredCatalog.slice(s,s+this.pickerPageSize); },
    pickerMaxPage(){ return Math.max(1, Math.ceil(this.filteredCatalog.length/this.pickerPageSize)); },
    statusClass(s){ return {DRAFT:'t-draft',PENDING:'t-pending',APPROVED:'t-approved',REJECTED:'t-rejected',CANCELLED:'t-cancelled'}[s] || 't-draft'; },
    skuStatusClass(s){ return {RETIRED:'t-retired',REVIVAL_PENDING:'t-revival',DELISTING:'t-delisting'}[s] || 't-retired'; },
    sourceLabel(s){ return s==='SYSTEM' ? '系统触发（IP 到期）' : '人工创建'; },
    isFilterEmpty(){ const f=this.filters; return !f.status && !f.reason && !f.kw && !f.ds && !f.de && !f.applicant; },
    col(k){ const c=this.columns.find(c=>c.key===k); return c ? c.on : true; },
    resetColumns(){ this.columns.forEach(c=>c.on=true); this.toast('列显示已重置','info'); },
    densityLabel(){ return this.density==='compact' ? '紧凑' : (this.density==='loose' ? '宽松' : '标准'); },
    cycleDensity(){ this.density = this.density==='default' ? 'compact' : (this.density==='compact' ? 'loose' : 'default'); this.toast('表格密度：' + this.densityLabel(),'info'); },
    toggleFullscreen(){ if(!document.fullscreenElement){ document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); } else { document.exitFullscreen && document.exitFullscreen(); } },
    refresh(){ this.refreshing=true; this.search(false); setTimeout(()=>{ this.refreshing=false; }, 800); },
    search(fail){ this.loading=true; this.listError=false; this.page1=1; setTimeout(()=>{ this.loading=false; if(fail){ this.listError=true; return; } this.toast('查询完成：共 ' + this.filtered.length + ' 条','success'); }, 300); },
    resetFilter(){ this.filters.status=''; this.filters.reason=''; this.filters.kw=''; this.filters.ds=''; this.filters.de=''; this.filters.applicant=''; this.page1=1; this.toast('筛选条件已重置','info'); },
    execSearch(fail){ this.execLoading=true; this.execError=false; this.execPage=1; setTimeout(()=>{ this.execLoading=false; if(fail) this.execError=true; else this.toast('查询完成：共 ' + this.filteredExec.length + ' 条','success'); }, 300); },
    /* —— 截图壳：页签条 —— */
    go(p){
      this.page=p;
      const id=PAGE_TAB[p];
      if(id){
        if(!this.tabs.some(t=>t.id===id)) this.tabs.push({id, label:TAB_LABELS[id], closable:true});
        this.activeTab=id;
      }
    },
    switchTab(id){
      if(id==='home'){ this.toast('首页不属于本演示范围','info'); return; }
      if(id==='tags'){ this.toast('「标签选项」为截图风格演示页签','info'); return; }
      const p=TAB_PAGE[id];
      if(!p) return;
      if((p==='applyDetail'||p==='applyEdit') && !this.currentForm){ this.go('applyList'); return; }
      if(p==='skuDetail' && !this.currentSku){ this.go('executeList'); return; }
      if(p==='flowPage' && !this.flowDoc){ this.go('applyList'); return; }
      this.go(p);
    },
    closeTab(id){
      const t=this.tabs.find(x=>x.id===id);
      if(!t || !t.closable) return;
      this.tabs=this.tabs.filter(x=>x.id!==id);
      if(this.activeTab===id){
        const rest=this.tabs.filter(x=>x.id!=='home' && TAB_PAGE[x.id]);
        if(rest.length) this.switchTab(rest[rest.length-1].id);
        else { this.activeTab=null; this.page='closed'; }
      }
    },
    closeOtherTabs(){
      const keep=this.activeTab && TAB_PAGE[this.activeTab] ? this.activeTab : 'apply';
      this.tabs=this.tabs.filter(t=>t.id==='home'||t.id===keep);
      if(!this.tabs.some(t=>t.id===keep)) this.tabs.push({id:keep, label:TAB_LABELS[keep], closable:true});
      this.switchTab(keep);
      this.toast('已关闭其他页签','info');
    },
    closeAllTabs(){
      this.tabs=[{id:'home',label:'首页',closable:false}];
      this.activeTab=null; this.page='closed';
      this.toast('已关闭所有页签','info');
    },
    refreshCurrentTab(){ this.page==='executeList' ? this.execSearch() : this.refresh(); },
    globalSearch(){
      if(!this.canDelist){ this.toast('当前角色无退市管理入口','info'); return; }
      this.filters.kw=this.globalKw;
      this.go('applyList');
      this.search();
    },
    onRoleChange(){ if(!this.canDelist){ this.page='none'; } else if(!['applyList','executeList','settings','applyDetail','skuDetail','applyEdit','flowPage'].includes(this.page)){ this.go('applyList'); } },
    openDetail(row){ this.currentForm=row; this.go('applyDetail'); },
    openFlow(row){ this.buildFlow(row.formNo, row.status==='REJECTED' ? '退市申请审批（已驳回）' : '退市申请审批'); this.flowFrom='applyList'; this.go('flowPage'); },
    openSkuFlow(row){ this.buildFlow(row.formNo, '复活审批' + (row.status==='REVIVAL_PENDING' ? '（进行中）' : '')); this.flowFrom='executeList'; this.go('flowPage'); },
    buildFlow(no, title){
      this.flowDoc={ title: no + ' · ' + title,
        steps:[{name:'提交申请',state:'done'},{name:'品牌管理员审批',state:'done'},{name:'渠道下架',state:'done'},{name:'完成',state:'cur'}],
        opinions:[{user:'品牌管理员 张晓峰', at:'2026-10-10 11:00', text:'同意退市，自动下架已触发。'}] };
    },
    openNew(){ this.editingFormId=null; this.form={lines:[],reason:'',planDate:'',note:''}; this.errs={}; this.go('applyEdit'); },
    openEdit(row){ this.editingFormId=row.id; this.form={lines:row.lines.map(l=>({...l})),reason:row.reason,planDate:row.planDate,note:row.note||''}; this.errs={}; this.go('applyEdit'); },
    cancelEdit(){ this.go(this.editingFormId ? 'applyDetail' : 'applyList'); this.toast('已放弃本次编辑','info'); },
    hasErr(k){ return this.errs[k] ? 'has-err' : ''; },
    confirmPicker(){ this.form.lines = this.CATALOG.filter(c=>this.picker.selected.includes(c.sku)).map(c=>({sku:c.sku,name:c.name,status:'已发布',qty:1,price:9.99})); this.pickerOpen=false; this.picker.selected=[]; this.toast('已选 ' + this.form.lines.length + ' 个 SKU','success'); },
    parseImport(){
      const codes=this.importText.split(/[\s,，;；]+/).filter(Boolean);
      const ok=[], errors=[];
      codes.forEach(c=>{ const hit=this.CATALOG.find(x=>x.sku===c); hit ? ok.push(hit) : errors.push('编码不存在：' + c); });
      this.importResult={ok:ok.length, fail:errors.length, lines:ok, errors};
      this.toast('解析完成：成功 ' + ok.length + ' · 失败 ' + errors.length, errors.length ? 'error' : 'success');
    },
    confirmImport(){
      if(!this.importResult || !this.importResult.lines.length){ this.toast('请先解析预览，再确认导入','error'); return; }
      const exist=new Set(this.form.lines.map(l=>l.sku));
      this.importResult.lines.forEach(c=>{ if(!exist.has(c.sku)) this.form.lines.push({sku:c.sku,name:c.name,status:'已发布',qty:1,price:9.99}); });
      this.toast('已导入 ' + this.importResult.lines.length + ' 个 SKU 到明细','success');
      this.importOpen=false; this.importText=''; this.importResult=null;
    },
    validate(){
      const e={};
      if(!this.form.lines.length) e.lines='请至少选择 1 个 SKU';
      if(!this.form.reason) e.reason='请选择退市原因';
      if(!this.form.planDate) e.planDate='请选择预计退市时间';
      if(this.form.reason==='其他' && !this.form.note.trim()) e.note='选「其他」须填写补充说明';
      this.errs=e; return !Object.keys(e).length;
    },
    submitForm(){
      if(!this.validate()){ this.toast('请完善必填项后再提交','error'); return; }
      this.submitting=true;
      setTimeout(()=>{
        this.submitting=false;
        const no='DL' + new Date().toISOString().slice(0,10).replace(/-/g,'') + String(Math.floor(Math.random()*900)+100);
        if(this.editingFormId){
          const row=this.forms.find(f=>f.id===this.editingFormId);
          if(row){ Object.assign(row,{reason:this.form.reason, planDate:this.form.planDate, note:this.form.note, lines:this.form.lines.map(l=>({...l})), skuCount:this.form.lines.length, status:'PENDING', node:'品牌管理员审批'}); }
          this.toast('已重新提交，进入品牌管理员审批','success');
        }else{
          this.forms.unshift({id:Date.now(), formNo:no, reason:this.form.reason, planDate:this.form.planDate,
            applicant:this.role==='BRAND_ADMIN'?'张晓峰':'李婷', submittedAt:new Date().toLocaleString('zh-CN',{hour12:false}), status:'PENDING', node:'品牌管理员审批',
            skuCount:this.form.lines.length, source:'MANUAL', note:this.form.note, lines:this.form.lines.map(l=>({...l}))});
          this.toast('提交成功，已进入品牌管理员审批','success');
        }
        this.go('applyList'); this.page1=1; this.editingFormId=null;
      }, 500);
    },
    openSkuDetail(row){ this.currentSku=row; this.go('skuDetail'); },
    sameFormSkuCount(){ const f=this.forms.find(x=>x.formNo===this.currentSku.formNo); return f ? f.skuCount : 1; },
    openRevive(row){ this.reviveRow=row; this.reviveReason=''; this.reviveOpen=true; },
    confirmRevive(){
      if(!this.reviveReason){ this.toast('请选择复活原因','error'); return; }
      this.reviveRow.timeline.push({id:Date.now(), action:'发起复活审批', at:new Date().toLocaleString('zh-CN',{hour12:false}), actor:this.role==='BRAND_ADMIN'?'张晓峰':'李婷', result:'审批中', resultClass:'t-pending', detail:'原因：'+this.reviveReason, dot:'warn', canJumpFlow:true});
      this.toast('复活审批已提交至 D11 审批中心','success');
      this.reviveOpen=false;
    },
    saveSettings(){ this.toast('下架配置已保存','success'); },
    esc(){ if(this.pickerOpen){this.pickerOpen=false;return;} if(this.importOpen){this.importOpen=false;return;} if(this.reviveOpen){this.reviveOpen=false;return;} if(this.colOpen){this.colOpen=false;return;} if(this.tabsMenuOpen){this.tabsMenuOpen=false;return;} if(this.page==='flowPage'){ this.go(this.flowFrom||'applyList'); return; } if(this.page==='applyEdit'){ this.cancelEdit(); return; } if(this.page==='skuDetail'){ this.go('executeList'); return; } if(this.page==='applyDetail'){ this.go('applyList'); } },
    toast(msg,type='success'){
      const icons={success:'✓',error:'✕',info:'ℹ'};
      const t={id:++this.tid,msg,type,icon:icons[type]||'✓'};
      this.toasts.push(t);
      setTimeout(()=>{ this.toasts=this.toasts.filter(x=>x.id!==t.id); }, 3500);
    },
  };
}
</script>
</body>
<script src="view-guard.js"></script>
