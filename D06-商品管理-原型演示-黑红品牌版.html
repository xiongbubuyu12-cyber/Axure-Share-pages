 --color-text-3: var(--brand-gray-4);\n  --color-border: var(--brand-gray-3);\n  --color-border-light: var(--brand-gray-2);\n  --color-divider: var(--brand-gray-2);\n  --color-bg-page: var(--brand-gray-1);\n  --color-bg: var(--brand-gray-1);\n  --color-bg-container: var(--brand-white);\n  --color-bg-fill: #fafafa;\n  --color-card: var(--brand-white);\n  --color-mask: rgba(17, 17, 17, .52);\n  --red: var(--brand-red);\n  --red-dark: var(--brand-red-hover);\n  --red-bg: var(--brand-red-soft);\n  --ink: var(--brand-black);\n  --muted: var(--brand-gray-4);\n  --line: var(--brand-gray-2);\n  --field: #fbfbfb;\n  --canvas: var(--brand-gray-1);\n  --nav: var(--brand-black);\n  --nav-active: var(--brand-red);\n}\n\n* { box-sizing: border-box; }\nbody {\n  color: var(--brand-black) !important;\n  background: var(--brand-gray-1) !important;\n  font-family: Inter, \"PingFang SC\", \"Microsoft YaHei\", Arial, sans-serif !important;\n  line-height: 1.5;\n}\n\n/* Header / navigation */\n.topbar, .top {\n  background: var(--brand-black) !important;\n  color: var(--brand-white) !important;\n  border-bottom: 1px solid #2c2c2c !important;\n}\n.brand, .brand b { color: var(--brand-white) !important; }\n.brand small, .top-title, .top-actions, .topmeta, .muted { color: #b9b9b9 !important; }\n.logo { background: var(--brand-red) !important; color: var(--brand-white) !important; }\n.avatar { background: #383838 !important; color: var(--brand-white) !important; }\n.sidebar, .side { background: var(--brand-black) !important; border-color: #2c2c2c !important; }\n.nav-label, .nav-title, .menu-title { color: #8f8f8f !important; }\n.nav-item, .nav { color: #c8c8c8 !important; }\n.nav-item.active, .nav.active, .menu-item.active {\n  color: var(--brand-white) !important;\n  background: rgba(166, 25, 46, .25) !important;\n}\n.nav-item.active::before { background: var(--brand-red) !important; }\n.menu-item { color: #c8c8c8 !important; }\n.menu-item.active { color: var(--brand-white) !important; }\n ta-domain=\"master\" data-view=\"module\">▣　商品群组与自定义模块\u003c/button>\u003cbutton class=\"nav\" data-domain=\"master\" data-view=\"approval\">▣　商品审批与任务\u003c/button>\u003c/div>\u003c/aside>\n\u003cmain class=\"main\">\n\u003cdiv class=\"domain-tabs\" role=\"tablist\" aria-label=\"商品数据业务域\">\u003cbutton class=\"domain-tab active\" role=\"tab\" aria-selected=\"true\" data-domain-tab=\"raw\">原始数据\u003c/button>\u003cbutton class=\"domain-tab\" role=\"tab\" aria-selected=\"false\" data-domain-tab=\"master\">商品主数据\u003c/button>\u003c/div>\n\u003csection id=\"source\" class=\"view active\">\u003cdiv class=\"head\">\u003cdiv>\u003ch1>来源类型列表\u003c/h1>\u003cp>配置业务上传数据的来源、唯一标识和接入方式\u003c/p>\u003c/div>\u003cbutton class=\"btn primary\" onclick=\"openSource()\">＋ 新建来源类型\u003c/button>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"filters\">\u003cdiv class=\"field\">\u003clabel>名称 / 编码\u003c/label>\u003cinput class=\"input\" placeholder=\"输入关键字搜索\">\u003c/div>\u003cdiv class=\"field\">\u003clabel>接入方式\u003c/label>\u003cselect class=\"select\">\u003coption>全部\u003c/option>\u003coption>API\u003c/option>\u003coption>SFTP\u003c/option>\u003coption>Excel\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel>状态\u003c/label>\u003cselect class=\"select\">\u003coption>全部\u003c/option>\u003coption>草稿\u003c/option>\u003coption>启用\u003c/option>\u003coption>停用\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\">查询\u003c/button>\u003cbutton class=\"btn\">重置\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"card table-wrap\">\u003ctable class=\"table\">\u003cthead>\u003ctr>\u003cth>类型名称\u003c/th>\u003cth>类型编码\u003c/th>\u003cth>唯一标识字段\u003c/th>\u003cth>接入方式\u003c/th>\u003cth>数据模式\u003c/th>\u003cth>状态\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"sourceRows\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\n\u003csection id=\"raw\" class=\"view\">\u003cdiv class=\"head\">\u003cdiv>\u003ch1>原始数据列表\u003c/h1>\u003cp>按来源保存业务上传字段；清洗失败后可根据失败原因重新处理\u003c/p>\u003c/div>\u003cdiv>\u003cbutton class=\"btn primary\" onclick=\"openImport('raw')\">导入\u003c/button> \u003cbutton class=\"btn\" onclick=\"openExport('raw')\">导出\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"subnav\">\u003cbutton class=\"nav2 active\">Official Web\u003c/button>\u003cbutton class=\"nav2\">ERP System\u003c/button>\u003cbutton class=\"nav2\">SFTP_Supplier\u003c/button>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"filters\">\u003cdiv class=\"field\">\u003clabel>唯一标识\u003c/label>\u003cinput class=\"input\" placeholder=\"请输入 SKU / 唯一编码\">\u003c/div>\u003cdiv class=\"field\">\u003clabel>入库状态\u003c/label>\u003cselect class=\"select\">\u003coption>全部状态\u003c/option>\u003coption>成功\u003c/option>\u003coption>入库中\u003c/option>\u003coption>失败\u003c/option>\u003coption>未入库\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel>创建时间\u003c/label>\u003cinput class=\"input\" placeholder=\"开始日期 - 结束日期\">\u003c/div>\u003cdiv class=\"field\">\u003clabel>列展示\u003c/label>\u003cselect class=\"select\">\u003coption>当前来源字段\u003c/option>\u003coption>已保存列配置\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\">查询\u003c/button>\u003cbutton class=\"btn\">重置\u003c/button>\u003cbutton class=\"btn\" onclick=\"openTask('import')\">导入记录\u003c/button>\u003cbutton class=\"btn\" onclick=\"openTask('export')\">导出记录\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"card table-wrap\">\u003ctable class=\"table\">\u003cthead>\u003ctr>\u003cth>唯一标识属性值\u003c/th>\u003cth>SKUcode\u003c/th>\u003cth>ARTNO\u003c/th>\u003cth>PRUNAME\u003c/th>\u003cth>COLOR\u003c/th>\u003cth>创建时间\u003c/th>\u003cth>更新时间\u003c/th>\u003cth>入库状态\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"rawRows\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\n\u003csection id=\"clean\" class=\"view\">\u003cdiv class=\"head\">\u003cdiv>\u003ch1>数据处理\u003c/h1>\u003cp>通过已发布清洗表处理业务上传字段后写入商品主数据\u003c/p>\u003c/div>\u003cbutton class=\"btn primary\" onclick=\"openCleaning('new')\">＋ 新建清洗表\u003c/button>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"filters\">\u003cdiv class=\"field\">\u003clabel>清洗表名称 / 编码\u003c/label>\u003cinput class=\"input\" placeholder=\"请输入名称或编码\">\u003c/div>\u003cdiv class=\"field\">\u003clabel>来源类型\u003c/label>\u003cselect class=\"select\">\u003coption>全部\u003c/option>\u003coption>ERP同步\u003c/option>\u003coption>外部导入\u003c/option>\u003coption>手动录入\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel>状态\u003c/label>\u003cselect class=\"select\">\u003coption>全部\u003c/option>\u003coption>草稿\u003c/option>\u003coption>已发布\u003c/option>\u003coption>停用\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\">查询\u003c/button>\u003cbutton class=\"btn\">重置\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"card table-wrap\">\u003ctable class=\"table\">\u003cthead>\u003ctr>\u003cth>清洗表名称\u003c/th>\u003cth>来源类型\u003c/th>\u003cth>目标模型\u003c/th>\u003cth>默认版本\u003c/th>\u003cth>状态\u003c/th>\u003cth>创建人\u003c/th>\u003cth>更新时间\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"cleanRows\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\n\u003csection id=\"base\" class=\"view\">\u003cdiv class=\"head\">\u003cdiv>\u003ch1>基础商品数据\u003c/h1>\u003cp>管理 SPU、SKU、字段来源、草稿值和正式值\u003c/p>\u003c/div>\u003cdiv>\u003cbutton class=\"btn\" onclick=\"openImport('product')\">导入商品\u003c/button> \u003cbutton class=\"btn\" onclick=\"openExport('product')\">导出商品\u003c/button> \u003cbutton class=\"btn primary\" onclick=\"openProduct('new')\">＋ 新建 SPU\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"tabs\">\u003cbutton class=\"tab active\" data-tab=\"spu\">SPU列表\u003c/button>\u003cbutton class=\"tab\" data-tab=\"sku\">SKU列表\u003c/button>\u003c/div>\u003cdiv id=\"spu\" class=\"tab-panel\">\u003cdiv id=\"approvalReturn\" class=\"notice\" style=\"display:none\">\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"filters\">\u003cdiv class=\"field\">\u003clabel>SPU 编码\u003c/label>\u003cinput class=\"input\" placeholder=\"输入 SPU 编码\">\u003c/div>\u003cdiv class=\"field\">\u003clabel>商品名称\u003c/label>\u003cinput class=\"input\" placeholder=\"输入商品名称\">\u003c/div>\u003cdiv class=\"field\">\u003clabel>SKU 编码\u003c/label>\u003cinput class=\"input\" placeholder=\"输入关联 SKU 编码\">\u003c/div>\u003cdiv class=\"field\">\u003clabel>类目\u003c/label>\u003cselect class=\"select\">\u003coption>全部\u003c/option>\u003coption>打火机\u003c/option>\u003coption>配件 / 耗材\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\">查询\u003c/button>\u003cbutton class=\"btn\">重置\u003c/button>\u003cbutton class=\"btn\" onclick=\"openTask('product')\">导入任务\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"batch-toolbar\">\u003cbutton class=\"btn primary\" id=\"batchTagFromSpu\" disabled>批量打标签（\u003cspan id=\"spuSelectedCount\">0\u003c/span>）\u003c/button>\u003cbutton class=\"btn\" id=\"clearSpuSelection\" disabled>清空选择\u003c/button>\u003cspan class=\"batch-count\">勾选SPU后可批量添加或移除标签\u003c/span>\u003c/div>\u003cdiv class=\"card table-wrap\">\u003ctable class=\"table\">\u003cthead>\u003ctr>\u003cth style=\"width:44px\">\u003cinput id=\"selectAllSpu\" type=\"checkbox\" aria-label=\"全选SPU\">\u003c/th>\u003cth>SPU主图\u003c/th>\u003cth>SPU编码\u003c/th>\u003cth>商品名称\u003c/th>\u003cth>类目\u003c/th>\u003cth>SKU数量\u003c/th>\u003cth>状态\u003c/th>\u003cth>待审批\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"spuRows\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\u003cdiv id=\"sku\" class=\"tab-panel\" style=\"display:none\">\u003cdiv class=\"head\">\u003cdiv>\u003ch2 style=\"font-size:18px;margin:0\">SKU 管理\u003c/h2>\u003cp>维护可销售规格及其唯一标识，一个 SKU 只能归属于一个 SPU。\u003c/p>\u003c/div>\u003cdiv>\u003cbutton class=\"btn\" onclick=\"openSKU('new')\">＋ 新建普通 SKU\u003c/button> \u003cbutton class=\"btn primary\" onclick=\"openComboFromSku()\">＋ 新建组合商品 SKU\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"card\">\u003cdiv class=\"filters\">\u003cdiv class=\"field\">\u003clabel>SKU 编码\u003c/label>\u003cinput class=\"input\" placeholder=\"输入 SKU 编码\">\u003c/div>\u003cdiv class=\"field\">\u003clabel>SPU 编码\u003c/label>\u003cinput class=\"input\" placeholder=\"输入 SPU 编码\">\u003c/div>\u003cdiv class=\"field\">\u003clabel>商品名称\u003c/label>\u003cinput class=\"input\" placeholder=\"模糊搜索商品名称\">\u003c/div>\u003cdiv class=\"field\">\u003clabel>SKU状态\u003c/label>\u003cselect class=\"select\">\u003coption>多选状态\u003c/option>\u003coption>已上架\u003c/option>\u003coption>未上架\u003c/option>\u003coption>已停用\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\">查询\u003c/button>\u003cbutton class=\"btn\">重置\u003c/button>\u003cbutton class=\"btn\" onclick=\"openExport('product')\">导出数据\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"card table-wrap\">\u003ctable class=\"table\">\u003cthead>\u003ctr>\u003cth>SKU编码\u003c/th>\u003cth>SKU名称\u003c/th>\u003cth>商品类型\u003c/th>\u003cth>所属SPU\u003c/th>\u003cth>组成数量\u003c/th>\u003cth>状态\u003c/th>\u003cth>风险状态\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"skuRows\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\u003c/section>\n\u003csection id=\"tagCenter\" class=\"view\">\u003cdiv class=\"head\">\u003cdiv>\u003ch1>商品标签\u003c/h1>\u003cp>统一管理商品标签定义、自动打标规则和操作记录\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"tabs\">\u003cbutton class=\"tab active\" data-tag-panel=\"definition\">标签管理\u003c/button>\u003cbutton class=\"tab\" data-tag-panel=\"rules\">自动打标\u003c/button>\u003cbutton class=\"tab\" data-tag-panel=\"logs\">操作记录\u003c/button>\u003c/div>\u003cdiv id=\"tagNativeContent\">\u003c/div>\u003c/section>\n\u003csection id=\"module\" class=\"view\">\u003cdiv class=\"head\">\u003cdiv>\u003ch1>商品群组与自定义模块\u003c/h1>\u003cp>按类目配置扩展字段和属性分组；父类目模块可由子类目继承\u003c/p>\u003c/div>\u003cbutton class=\"btn primary\" onclick=\"openModule('new')\">＋ 新建模块\u003c/button>\u003c/div>\u003cdiv class=\"kpis\">\u003cdiv class=\"kpi\">\u003cb>12\u003c/b>\u003cspan>已启用模块\u003c/span>\u003c/div>\u003cdiv class=\"kpi\">\u003cb>6\u003c/b>\u003cspan>已关联类目\u003c/span>\u003c/div>\u003cdiv class=\"kpi\">\u003cb>48\u003c/b>\u003cspan>扩展属性\u003c/span>\u003c/div>\u003cdiv class=\"kpi\">\u003cb>3\u003c/b>\u003cspan>待发布变更\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card table-wrap\">\u003ctable class=\"table\">\u003cthead>\u003ctr>\u003cth>模块名称\u003c/th>\u003cth>模块编码\u003c/th>\u003cth>绑定类目\u003c/th>\u003cth>属性组\u003c/th>\u003cth>属性数量\u003c/th>\u003cth>状态\u003c/th>\u003cth>更新时间\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb style=\"color:var(--red)\">打火机基础属性\u003c/b>\u003c/td>\u003ctd>MOD_LIGHTER_BASE\u003c/td>\u003ctd>打火机 / 燃油机\u003c/td>\u003ctd>基础参数、外观参数\u003c/td>\u003ctd>12\u003c/td>\u003ctd>\u003cspan class=\"tag ok\">启用\u003c/span>\u003c/td>\u003ctd>2026-08-10 10:22\u003c/td>\u003ctd>\u003cbutton class=\"link\" onclick=\"openModule('edit')\">编辑\u003c/button>\u003cbutton class=\"link\" onclick=\"openModule('edit')\">属性组\u003c/button>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb style=\"color:var(--red)\">礼盒扩展属性\u003c/b>\u003c/td>\u003ctd>MOD_GIFT_SET\u003c/td>\u003ctd>礼盒 / 组合商品\u003c/td>\u003ctd>包装信息、组合信息\u003c/td>\u003ctd>8\u003c/td>\u003ctd>\u003cspan class=\"tag warn\">草稿\u003c/span>\u003c/td>\u003ctd>2026-08-09 16:41\u003c/td>\u003ctd>\u003cbutton class=\"link\" onclick=\"openModule('edit')\">编辑\u003c/button>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\n\u003csection id=\"approval\" class=\"view\">\u003cdiv class=\"head\">\u003cdiv>\u003ch1>商品审批与任务\u003c/h1>\u003cp>处理商品变更审批，并查看导入、入库、导出等处理结果\u003c/p>\u003c/div>\u003cbutton class=\"btn\" onclick=\"openApproval('config')\">审批配置\u003c/button>\u003c/div>\u003cdiv class=\"tabs\">\u003cbutton class=\"tab ,'System']];\nconst spuData=[['SPU-ZP15001','Classic Windproof Lighter','经典防风打火机','12','已启用',''],['SPU-ZP352','Venetian Venetian Brass','饰品打火机','4','已启用','待审'],['SPU-ACC-001','Zippo Lighter Fluid 12oz','配件/耗材','1','已禁用',''],['SPU-ZP218','ZP-218 Black Matte Lighter','经典防风打火机','8','已启用','']];\nconst skuData=[{code:'ZP-200-S-001',name:'Classic Brushed Chrome Lighter',type:'普通 SKU',spu:'ZPC-CLASSIC-200',qty:'—',status:'已上架',risk:'—'},{code:'ZP-151-M-542',name:'Spectrum Iridescent Lighter',type:'普通 SKU',spu:'ZPC-SPECT-151',qty:'—',status:'未上架',risk:'—'},{code:'BND-2026-0018',name:'火焰经典礼盒组合',type:'组合商品 SKU',spu:'SPU-GIFT-021',qty:'3 种',status:'已发布',risk:'无风险'},{code:'BND-2026-0021',name:'夏日出行套装',type:'组合商品 SKU',spu:'SPU-GIFT-034',qty:'2 种',status:'草稿',risk:'存在风险'},{code:'ZP-218-B-099',name:'Black Matte with Zippo Logo',type:'普通 SKU',spu:'ZPC-MATTE-218',qty:'—',status:'已停用',risk:'—'},{code:'ZP-ARMOR-162',name:'Armor Brushed Chrome Heavy Wall',type:'普通 SKU',spu:'ZPC-ARMOR-162',qty:'—',status:'已上架',risk:'—'}];\nfunction tag(v){let c=v==='已启用'||v==='成功'||v==='已上架'||v==='生效中'||v==='已发布'?'ok':(v==='待审'||v==='入库中'||v==='草稿'?'warn':(v==='失败'||v==='已停用'||v==='已作废'?'bad':''));return '\u003cspan class=\"tag '+c+'\">'+v+'\u003c/span>'}\ndocument.getElementById('sourceRows').innerHTML=sourceData.map(x=>'\u003ctr>\u003ctd>\u003cb style=\"color:var(--red)\">'+x[0]+'\u003c/b>\u003c/td>\u003ctd>'+x[1]+'\u003c/td>\u003ctd>'+x[2]+'\u003c/td>\u003ctd>'+x[3]+'\u003c/td>\u003ctd>'+x[4]+'\u003c/td>\u003ctd>'+tag(x[5])+'\u003c/td>\u003ctd>\u003cbutton class=\"link\" onclick=\"openSourceDetail(\\''+x[1]+'\\')\">详情\u003c/button>\u003cbutton class=\"link\" onclick=\"openSource()\">编辑\u003c/button>\u003cbutton class=\"link\" onclick=\"toast(\\'已复制来源类型\\')\">复制\u003c/button>\u003cbutton class=\"link\">'+(x[5]==='启用'?'停用':'启用')+'\u003c/button>\u003c/td>\u003c/tr>').join('');\ndocument.getElementById('rawRows').innerHTML=rawData.map(x=>'\u003ctr>\u003ctd>\u003cb style=\"color:var(--red)\">'+x[0]+'\u003c/b>\u003c/td>\u003ctd>'+x[1]+'\u003c/td>\u003ctd>'+x[2]+'\u003c/td>\u003ctd>'+x[3]+'\u003c/td>\u003ctd>'+x[4]+'\u003c/td>\u003ctd>2026-08-10 09:24\u003c/td>\u003ctd>2026-08-10 10:12\u003c/td>\u003ctd>'+tag(x[5])+'\u003c/td>\u003ctd>\u003cbutton class=\"link\" onclick=\"openRawDetail(\\''+x[0]+'\\')\">查看\u003c/button>\u003cbutton class=\"link\" onclick=\"openRawDetail(\\''+x[0]+'\\',true)\">更新记录\u003c/button>\u003cbutton class=\"link\" onclick=\"openWarehousing(\\''+x[0]+'\\')\">'+(x[5]==='失败'?'重新入库':'入库')+'\u003c/button>\u003c/td>\u003c/tr>').join('');\ndocument.getElementById('cleanRows').innerHTML=cleanData.map(x=>'\u003ctr>\u003ctd>\u003cb style=\"color:var(--red)\">'+x[0]+'\u003c/b>\u003cbr>\u003csmall style=\"color:#777\">CLEAN-2023-001\u003c/small>\u003c/td>\u003ctd>'+x[1]+'\u003c/td>\u003ctd>'+x[2]+'\u003c/td>\u003ctd>V2.0\u003c/td>\u003ctd>'+tag(x[3])+'\u003c/td>\u003ctd>'+x[4]+'\u003c/td>\u003ctd>2026-08-10 10:25\u003c/td>\u003ctd>\u003cbutton class=\"link\" onclick=\"openCleaning(\\'edit\\')\">编辑\u003c/button>\u003cbutton class=\"link\" onclick=\"openCleaning(\\'preview\\')\">预览\u003c/button>\u003cbutton class=\"link\" onclick=\"toast(\\'已发布新版本\\')\">发布\u003c/button>\u003c/td>\u003c/tr>').join('');\nfunction renderSpuRows(){document.getElementById('spuRows').innerHTML=spuData.map((x,i)=>'\u003ctr data-spu=\"'+x[0]+'\">\u003ctd>\u003cinput class=\"spu-check\" type=\"checkbox\" aria-label=\"选择 '+x[0]+'\">\u003c/td>\u003ctd>\u003cdiv class=\"thumb\" style=\"display:flex;align-items:center;justify-content:center\">'+(i===0?'▣':'□')+'\u003c/div>\u003c/td>\u003ctd>\u003cb style=\"color:var(--red)\">'+x[0]+'\u003c/b>\u003c/td>\u003ctd>\u003cb>'+x[1]+'\u003c/b>\u003c/td>\u003ctd>'+x[2]+'\u003c/td>\u003ctd>'+x[3]+'\u003c/td>\u003ctd>'+tag(x[4])+'\u003c/td>\u003ctd>'+ (x[5]?tag(x[5]):'✓')+'\u003c/td>\u003ctd>\u003cbutton class=\"link\" onclick=\"openProduct(\\'detail\\')\">查看\u003c/button>\u003cbutton class=\"link\" onclick=\"openProduct(\\'edit\\')\">编辑\u003c/button>\u003cbutton class=\"link\">'+(x[4]==='已启用'?'停用':'启用')+'\u003c/button>\u003cbutton class=\"link\">删除\u003c/button>\u003c/td>\u003c/tr>').join('');bindSpuSelection()}function bindSpuSelection(){const checks=[...document.querySelectorAll('.spu-check')],all=document.getElementById('selectAllSpu');checks.forEach(x=>x.onchange=updateSpuSelection);if(all)all.onchange=()=>{checks.forEach(x=>x.checked=all.checked);updateSpuSelection()};updateSpuSelection()}function updateSpuSelection(){const checks=[...document.querySelectorAll('.spu-check')],n=checks.filter(x=>x.checked).length;document.getElementById('spuSelectedCount').textContent=n;document.getElementById('batchTagFromSpu').disabled=!n;document.getElementById('clearSpuSelection').disabled=!n;document.getElementById('selectAllSpu').checked=!!checks.length&&n===checks.length}renderSpuRows();\ndocument.getElementById('skuRows').innerHTML=skuData.map(x=>'\u003ctr>\u003ctd>\u003cb style=\"color:var(--red)\">'+x.code+'\u003c/b>\u003c/td>\u003ctd>'+x.name+'\u003c/td>\u003ctd>'+tag(x.type==='组合商品 SKU'?'组合':'普通')+'\u003c/td>\u003ctd style=\"color:var(--red)\">'+x.spu+'\u003c/td>\u003ctd>'+x.qty+'\u003c/td>\u003ctd>'+tag(x.status)+'\u003c/td>\u003ctd>'+(x.risk==='无风险'?'✓':x.risk==='存在风险'?tag('存在风险'):'—')+'\u003c/td>\u003ctd>\u003cbutton class=\"link\" onclick=\"'+(x.type==='组合商品 SKU'?'openComboFromSku()':'openProduct(\\'detail\\')')+'\">查看\u003c/button>\u003cbutton class=\"link\" onclick=\"'+(x.type==='组合商品 SKU'?'openComboFromSku()':'openProduct(\\'edit\\')')+'\">编辑\u003c/button>\u003c/td>\u003c/tr>').join('');\nconst domainDefaults={raw:'source',master:'base'};function switchDomain(domain,view){document.querySelectorAll('[data-domain-tab]').forEach(x=>{const active=x.dataset.domainTab===domain;x.classList.toggle('active',active);x.setAttribute('aria-selected',String(active))});document.querySelectorAll('[data-domain-menu]').forEach(x=>x.hidden=x.dataset.domainMenu!==domain);const target=view||domainDefaults[domain];document.q te) !important; background: var(--brand-black) !important; border-color: var(--brand-black) !important; }\n\n/* Combo product specific surfaces */\n.step.active, .step.current, .progress-step.active { color: var(--brand-red) !important; border-color: var(--brand-red) !important; }\n.step-line.active, .progress-line.active { background: var(--brand-red) !important; }\n.risk, .risk-warning, .danger-text { color: var(--brand-red) !important; }\n\n/* Focus and motion: preserve keyboard visibility without changing behavior. */\nbutton:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {\n  outline: 3px solid rgba(166, 25, 46, .35) !important;\n  outline-offset: 2px;\n}\n\n/* Responsive surface treatment from AI-PIM layout rules. */\n@media (max-width: 768px) {\n  .page, .main { padding: 16px !important; }\n  .toolbar, .filter { gap: 8px !important; }\n  .btn { min-height: 36px; }\n}\n\n/* Dark mode mapping. Existing dark-mode toggles remain the only trigger. */\n:root.dark, html.dark {\n  --brand-black: #f2f2f2;\n  --brand-white: #1b1b1b;\n  --brand-gray-1: #242424;\n  --brand-gray-2: #343434;\n  --brand-gray-3: #4a4a4a;\n  --brand-gray-4: #a1a1a1;\n  --brand-gray-5: #d2d2d2;\n  --brand-red-soft: #4a2028;\n  --color-text-primary: #f2f2f2;\n  --color-text-secondary: #d2d2d2;\n  --color-text-tertiary: #a1a1a1;\n  --color-bg-page: #151515;\n  --color-bg-container: #1b1b1b;\n  --color-bg-fill: #242424;\n  --color-card: #1b1b1b;\n  --color-border: #4a4a4a;\n  --color-divider: #343434;\n}\n\n@media (prefers-color-scheme: dark) {\n  :root:not(.light) {\n    --color-bg-page: #151515;\n    --color-bg-container: #1b1b1b;\n    --color-bg-fill: #242424;\n  }\n}\n\u003c/style>\n\u003cstyle>\nhtml.integrated-embed,html.integrated-embed body{min-height:100%;background:#f5f6f8!important}\nhtml.integrated-embed body{overflow:auto}\nhtml.integrated-embed .top,html.integrated-embed body>.topbar{display:none!important}\nhtml.integrated-embed bo adding:28px 30px 48px!important}\nhtml.integrated-embed body>main.page,html.integrated-embed body>main.app{margin:0!important;padding:28px 30px 56px!important;min-height:100vh!important;width:auto!important}\nhtml.integrated-embed .card{border-radius:12px!important;border-color:#e7e9ee!important;box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.035)!important}\nhtml.integrated-embed .head h1,html.integrated-embed .page-head h1,html.integrated-embed .heading h1{font-size:24px!important;letter-spacing:-.02em!important}\nhtml.integrated-embed .btn,html.integrated-embed button{border-radius:8px!important}\nhtml.integrated-embed input,html.integrated-embed select,html.integrated-embed textarea{border-radius:8px!important}\nhtml.integrated-embed table tbody tr{transition:background .15s ease}\nhtml.integrated-embed .modal,html.integrated-embed .drawer{border-radius:14px!important}\nhtml.integrated-embed .prototype-feedback{position:fixed;right:24px;bottom:24px;z-index:9999;padding:11px 16px;border-radius:9px;background:#202124;color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.22);font-size:13px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s}\nhtml.integrated-embed .prototype-feedback.show{opacity:1;transform:translateY(0)}\n@media(max-width:900px){html.integrated-embed body>.shell{grid-template-columns:1fr!important}html.integrated-embed body>.shell>.side{display:flex!important;overflow:auto!important;border-right:0!important;border-bottom:1px solid #e7e9ee!important}html.integrated-embed body>.app>.sidebar{position:static!important;width:auto!important;height:auto!important;display:flex!important}html.integrated-embed body>.app>.main{margin-left:0!important}html.integrated-embed body>.shell>.main,html.integrated-embed body>.app>.main>.content,html.integrated-embed body>main.page,html.integrated-embed body>main.app{padding:18px!important}}\n\u003c/style>\u003cscript>document.documentElement.classList.add('integrated-embed');\u003c/script>\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"app\">\n    \u003caside class=\"sidebar\">\n      \u003cdiv class=\"brand\">\u003cspan class=\"brand-mark\">PIM\u003c/span>\u003cspan>AI-PIM\u003c/span>\u003c/div>\n      \u003cdiv class=\"nav-label\">商品管理\u003c/div>\n      \u003cbutton class=\"nav-item active\" data-view=\"subscriber-list\">\u003ci data-lucide=\"radio-tower\">\u003c/i>\u003cspan>订阅器\u003c/span>\u003c/button>\n      \u003cbutton class=\"nav-item\" data-view=\"log-list\">\u003ci data-lucide=\"scroll-text\">\u003c/i>\u003cspan>推送日志\u003c/span>\u003cspan class=\"nav-badge\">2\u003c/span>\u003c/button>\n    \u003c/aside>\n    \u003cmain class=\"main\">\n      \u003cheader class=\"topbar\">\u003cdiv class=\"crumb\">商品管理&nbsp;&nbsp;/&nbsp;&nbsp;\u003cstrong id=\"crumb\">订阅器\u003c/strong>\u003c/div>\u003cdiv class=\"topbar-right\">\u003ci data-lucide=\"bell\" style=\"width:18px\">\u003c/i>\u003cdiv class=\"avatar\">张\u003c/div>\u003cspan>张雨\u003c/span>\u003c/div>\u003c/header>\n      \u003cdiv class=\"content\">\n        \u003csection class=\"view active\" id=\"subscriber-list\">\n          \u003cdiv class=\"page-head\">\u003cdiv>\u003ch1>订阅器\u003c/h1>\u003cp class=\"page-subtitle\">管理下游系统的商品推送范围与触发属性\u003c/p>\u003c/div>\u003c/div>\n          \u003cdiv class=\"card filter-card\">\u003cdiv class=\"filters\">\u003cdiv class=\"field\">\u003clabel>订阅器名称\u003c/label>\u003cinput id=\"sub-keyword\" placeholder=\"名称或编码关键字\">\u003c/div>\u003cdiv class=\"field\">\u003clabel>下游系统\u003c/label>\u003cselect id=\"sub-system\">\u003coption value=\"\">全部系统\u003c/option>\u003coption>经销商门户\u003c/option>\u003coption>电商中台\u003c/option>\u003coption>会员商城\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel>状态\u003c/label>\u003cselect id=\"sub-status\">\u003coption value=\"\">全部\u003c/option>\u003coption>启用\u003c/option>\u003coption>停用\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel>更新时间\u003c/label>\u003cdiv class=\"range\">\u003cinput type=\"date\">\u003cinput type=\"date\">\u003c/div>\u003c/div>\u003cdiv class=\"filter-actions\">\u003cbutton class=\"btn btn-primary\" onclick=\"renderSubscribers()\">查询\u003c/button>\u003cbutton class=\"btn\" onclick=\"resetSubFilters()\">重置\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n          \u003cdiv class=\"card table-card\">\u003cdiv class=\"toolbar\">\u003cdiv class=\"toolbar-left\">\u003cspan class=\"selected-hint\" id=\"selected-hint\">已选 0 项\u003c/span>\u003cbutton class=\"btn\" disabled id=\"batch-disable\">批量停用\u003c/button>\u003c/div>\u003cdiv class=\"toolbar-right\">\u003cbutton class=\"btn\" onclick=\"showToast('列表已刷新')\">\u003ci data-lucide=\"refresh-cw\">\u003c/i>刷新\u003c/button>\u003cbutton class=\"btn btn-primary\" onclick=\"openForm()\">\u003ci data-lucide=\"plus\">\u003c/i>新建订阅器\u003c/button>\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:44px\">\u003cinput class=\"checkbox\" type=\"checkbox\" aria-label=\"全选订阅器\" onchange=\"selectAllSubscribers(this.checked)\">\u003c/th>\u003cth>订阅器名称\u003c/th>\u003cth>下游系统\u003c/th>\u003cth style=\"width:82px\">状态\u003c/th>\u003cth>更新时间\u003c/th>\u003cth style=\"width:210px\">操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"subscriber-body\">\u003c/tbody>\u003c/table>\u003cdiv class=\"pagination\">\u003cspan>共 \u003cb id=\"sub-count\">0\u003c/b> 条\u003c/span>\u003cdiv class=\"pages\">\u003cspan class=\"page-no current\">1\u003c/span>\u003cspan class=\"page-no\">2\u003c/span>\u003cspan class=\"page-no\">›\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n        \u003c/section>\n        \u003csection class=\"view form-page\" id=\"subscriber-form\">\n          \u003cdiv class=\"page-head\">\u003cdiv>\u003ch1 id=\"form-title\">新建订阅器\u003c/h1>\u003cp class=\"page-subtitle\">配置商品推送范围与属性变更触发规则\u003c/p>\u003c/div>\u003cbutton class=\"btn\" onclick=\"backToSubscribers()\">返回列表\u003c/button>\u003c/div>\n          \u003cform id=\"subscriber-form-el\" novalidate>\n            \u003cdiv class=\"card form-section\">\u003ch2 class=\"section-title\">基础信息\u003c/h2>\u003cdiv class=\"form-grid\">\u003cdiv>\u003clabel class=\"form-label required\">订阅器编码\u003c/label>\u003cinput class=\"form-control\" id=\"form-code\" aria-required=\"true\" placeholder=\"例如：DEALER_PRODUCT_SYNC\">\u003cdiv class=\"error-text\" id=\"error-code\">\u003c/div>\u003c/div>\u003cdiv class=\"span-2\">\u003clabel class=\"form-label required\">订阅器名称\u003c/label>\u003cinput class=\"form-control\" id=\"form-name\" aria-required=\"true\" maxlength=\"50\" placeholder=\"请输入 1–50 个字符\">\u003cdiv class=\"error-text\" id=\"error-name\">\u003c/div>\u003c/div>\u003cdiv>\u003clabel class=\"form-label required\">下游系统\u003c/label>\u003cselect class=\"form-control\" id=\"form-system\" aria-required=\"true\">\u003coption value=\"\">请选择已连接系统\u003c/option>\u003coption>经销商门户\u003c/option>\u003coption>电商中台\u003c/option>\u003coption>会员商城\u003c/option>\u003c/select>\u003cdiv class=\"error-text\" id=\"error-system\">\u003c/div>\u003c/div>\u003cdiv>\u003clabel class=\"form-label\">启用状态\u003c/label>\u003cdiv style=\"height:34px;display:flex;align-items:center;gap:var(--spacing-sm)\">\u003clabel class=\"switch\">\u003cinput type=\"checkbox\" id=\"form-enabled\">\u003cspan class=\"slider\">\u003c/span>\u003c/label>\u003cspan id=\"enable-text\" class=\"muted\">保存后可启用\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n            \u003cdiv class=\"card form-section\">\u003ch2 class=\"section-title\">推送范围\u003c/h2>\u003cdiv class=\"form-grid\">\u003cdiv class=\"span-all\">\u003clabel class=\"form-label required\">推送范围\u003c/label>\u003cdiv class=\"radio-group\">\u003clabel>\u003cinput type=\"radio\" name=\"scope\" value=\"标签\" checked onchange=\"changeScope('标签')\">商品标签\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"scope\" value=\"分类\" onchange=\"changeScope('分类')\">商品分类\u003c/label>\u003c/div>\u003c/div>\u003cdiv class=\"span-all\">\u003clabel class=\"form-label required\" id=\"scope-label\">推送范围值（商品标签）\u003c/label>\u003cdiv class=\"chips\" id=\"scope-chips\">\u003c/div>\u003cdiv class=\"error-text\" id=\"error-scope\">\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n            \u003cdiv class=\"card form-section\">\u003ch2 class=\"section-title\">触发条件\u003c/h2>\u003cdiv class=\"form-grid\">\u003cdiv class=\"span-all\">\u003clabel class=\"form-label required\">触发推送属性 \u003cbutton type=\"button\" class=\"btn-link select-all\" onclick=\"selectAllProperties()\">全选\u003c/button>\u003c/label>\u003cdiv class=\"chips\" id=\"property-chips\">\u003c/div>\u003cdiv class=\"error-text\" id=\"error-properties\">\u003c/div>\u003c/div>\u003cdiv class=\"span-all\">\u003clabel class=\"form-label\">备注\u003c/label>\u003ctextarea id=\"form-note\" placeholder=\"记录该订阅器的配置说明（选填）\">\u003c/textarea>\u003c/div>\u003c/div>\u003c/div>\n            \u003cdiv class=\"card form-footer\">\u003cbutton type=\"button\" class=\"btn\" onclick=\"backToSubscribers()\">取消\u003c/button>\u003cbutton type=\"submit\" class=\"btn btn-primary\" id=\"save-button\">保存\u003c/button>\u003c/div>\n          \u003c/form>\n        \u003c/section>\n        \u003csection class=\"view\" id=\"log-list\">\n          \u003cdiv class=\"page-head\">\u003cdiv>\u003ch1>推送日志\u003c/h1>\u003cp class=\"page-subtitle\">查看每次商品数据分发的处理过程与下游接收结果\u003c/p>\u003c/div>\u003c/div>\n          \u003cdiv class=\"card filter-card\">\u003cdiv class=\"filters\">\u003cdiv class=\"field\">\u003clabel>订阅器名称\u003c/label>\u003cinput id=\"log-keyword\" placeholder=\"订阅器名称或编码\">\u003c/div>\u003cdiv class=\"field\">\u003clabel>创建时间\u003c/label>\u003cdiv class=\"range\">\u003cinput type=\"date\">\u003cinput type=\"date\">\u003c/div>\u003c/div>\u003cdiv class=\"field\">\u003clabel>推送状态\u003c/label>\u003cselect id=\"log-status\">\u003coption value=\"\">全部状态\u003c/option>\u003coption>成功\u003c/option>\u003coption>失败\u003c/option>\u003coption>部分成功\u003c/option>\u003coption>处理中\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel>接受状态\u003c/label>\u003cselect id=\"receive-status\">\u003coption value=\"\">全部状态\u003c/option>\u003coption>成功\u003c/option>\u003coption>失败\u003c/option>\u003coption>部分成功\u003c/option>\u003coption>未接收\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"filter-actions\">\u003cbutton class=\"btn btn-primary\" onclick=\"renderLogs()\">查询\u003c/button>\u003cbutton class=\"btn\" onclick=\"resetLogFilters()\">重置\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n          \u003cdiv class=\"card table-card\">\u003cdiv class=\"toolbar\">\u003cdiv class=\"toolbar-left\">\u003cspan class=\"muted\">日志数据保留完整状态节点，敏感认证信息不会在此展示\u003c/span>\u003c/div>\u003cdiv class=\"toolbar-right\">\u003cbutton class=\"btn\" onclick=\"showToast('日志列表已刷新')\">\u003ci data-lucide=\"refresh-cw\">\u003c/i>刷新\u003c/button>\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>订阅器编码\u003c/th>\u003cth>订阅器名称\u003c/th>\u003cth>推送时间\u003c/th>\u003cth>处理时间\u003c/th>\u003cth>推送状态\u003c/th>\u003cth>接受状态\u003c/th>\u003cth style=\"width:200px\">操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"log-body\">\u003c/tbody>\u003c/table>\u003cdiv class=\"pagination\">\u003cspan>共 \u003cb id=\"log-count\">0\u003c/b> 条\u003c/span>\u003cdiv class=\"pages\">\u003cspan class=\"page-no current\">1\u003c/span>\u003cspan class=\"page-no\">2\u003c/span>\u003cspan class=\"page-no\">›\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n        \u003c/section>\n      \u003c/div>\n    \u003c/main>\n  \u003c/div>\n  \u003cdiv class=\"mask\" id=\"mask\" onclick=\"closeOverlays()\">\u003c/div>\n  \u003caside class=\"drawer\" id=\"log-drawer\" aria-label=\"推送日志详情\">\u003cdiv class=\"drawer-head\">\u003ch2>推送日志详情\u003c/h2>\u003cbutton class=\"icon-btn\" aria-label=\"关闭\" onclick=\"closeOverlays()\">\u003ci data-lucide=\"x\">\u003c/i>\u003c/button>\u003c/div>\u003cdiv class=\"drawer-body\">\u003cdiv class=\"summary\">\u003cdiv>\u003cdiv class=\"label\">订阅器名称\u003c/div>\u003cdiv id=\"detail-name\">—\u003c/div>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">任务编号\u003c/div>\u003cdiv class=\"mono\" id=\"detail-id\">—\u003c/div>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">创建推送时间\u003c/div>\u003cdiv class=\"time\" id=\"detail-created\">—\u003c/div>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">处理时间\u003c/div>\u003cdiv class=\"time\" id=\"detail-handled\">—\u003c/div>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">推送状态\u003c/div>\u003cdiv id=\"detail-push\">—\u003c/div>\u003c/div>\u003cdiv>\u003cdiv class=\"label\">接受状态\u003c/div>\u003cdiv id=\"detail-receive\">—\u003c/div>\u003c/div>\u003c/div>\u003ch3 class=\"section-title\" style=\"margin-top:var(--spacing-xl)\">状态轨迹\u003c/h3>\u003cdiv class=\"timeline\" id=\"timeline\">\u003c/div>\u003cdiv class=\"card\" style=\"padding:var(--spacing-md)\">\u003cdiv class=\"form-label\">下游接受结果\u003c/div>\u003cdiv id=\"detail-result\">—\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"drawer-footer\">\u003cbutton class=\"btn\" onclick=\"exportLog()\">\u003ci data-lucide=\"download\">\u003c/i>导出明细\u003c/button>\u003cbutton class=\"btn btn-primary\" id=\"retry-detail\" onclick=\"retryCurrentLog()\">\u003ci data-lucide=\"rotate-cw\">\u003c/i>重推\u003c/button>\u003c/div>\u003c/aside>\n  \u003csection class=\"modal\" id=\"batch-modal\" role=\"dialog\" aria-modal=\"true\" aria-label=\"批量推送\">\u003cdiv class=\"modal-head\">\u003ch2>批量推送\u003c/h2>\u003cbutton class=\"icon-btn\" aria-label=\"关闭\" onclick=\"closeOverlays()\">\u003ci data-lucide=\"x\">\u003c/i>\u003c/button>\u003c/div>\u003cdiv class=\"modal-body\">\u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003cspan class=\"stat-label\">已选择 SPU\u003c/span>\u003cdiv class=\"stat-value\">20\u003c/div>\u003c/div>\u003cdiv class=\"stat\">\u003cspan class=\"stat-label\">可推送\u003c/span>\u003cdiv class=\"stat-value\" style=\"color:var(--color-success)\">18\u003c/div>\u003c/div>\u003cdiv class=\"stat\">\u003cspan class=\"stat-label\">不可推送\u003c/span>\u003cdiv class=\"stat-value\" style=\"color:var(--color-danger)\">2\u003c/div>\u003c/div>\u003cdiv class=\"stat\">\u003cspan class=\"stat-label\">预计任务数\u003c/span>\u003cdiv class=\"stat-value\" id=\"task-count\">0\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"card\" style=\"padding:var(--spacing-md);background:var(--color-warning-bg);border-color:transparent;margin-bottom:var(--spacing-lg)\">\u003cspan style=\"color:var(--color-warning)\">2 个商品未命中订阅器范围或无权限，已自动排除。\u003c/span> \u003cbutton class=\"btn-link\" onclick=\"showToast('已展示排除原因：商品 SPU-10098 不在范围内；SPU-10104 无推送权限')\">查看原因\u003c/button>\u003c/div>\u003cdiv class=\"field\" style=\"margin-bottom:var(--spacing-lg)\">\u003clabel class=\"required\">目标订阅器\u003c/label>\u003cdiv class=\"chips\" id=\"batch-subs\">\u003c/div>\u003cdiv class=\"error-text\" id=\"batch-error\">\u003c/div>\u003c/div>\u003cdiv class=\"field\">\u003clabel>备注\u003c/label>\u003ctextarea id=\"batch-note\" placeholder=\"记录本次推送说明（选填）\">\u003c/textarea>\u003c/div>\u003c/div>\u003cdiv class=\"modal-footer\">\u003cbutton class=\"btn\" onclick=\"closeOverlays()\">取消\u003c/button>\u003cbutton class=\"btn btn-primary\" onclick=\"submitBatch()\">\u003ci data-lucide=\"send\">\u003c/i>确认推送\u003c/button>\u003c/div>\u003c/section>\n  \u003cdiv class=\"toast\" role=\"status\" aria-live=\"polite\" id=\"toast\">\u003c/div>\n  \u003cscript>\n    const subscribers = [\n      {id: 1, code:'DEALER_PRODUCT_SYNC', name:'经销商商品同步', system:'经销商门户', scope:'标签', values:['新品','限量款'], props:['商品名称','主图','销售状态'], status:'启用', updated:'2026-08-09 10:24:18'},\n      {id: 2, code:'ECOM_PRODUCT_PUSH', name:'电商中台商品推送', system:'电商中台', scope:'分类', values:['打火机','配件'], props:['SKU编码','零售价','库存状态'], status:'启用', updated:'2026-08-08 16:42:09'},\n      {id: 3, code:'MEMBER_MALL_SYNC', name:'会员商城选品同步', system:'会员商城', scope:'标签', values:['会员专享'], props:['商品名称','详情描述'], status:'停用', updated:'2026-08-07 14:08:31'}\n    ];\n    let logs = [\n      {id:'PUSH-20260809-0031', code:'DEALER_PRODUCT_SYNC', name:'经销商商品同步', created:'2026-08-09 10:31:12', handled:'2026-08-09 10:31:20', push:'成功', receive:'成功', result:'下游系统已确认接收 32 条商品数据。'},\n      {id:'PUSH-20260809-0030', code:'ECOM_PRODUCT_PUSH', name:'电商中台商品推送', created:'2026-08-09 09:18:45', handled:'2026-08-09 09:18:56', push:'部分成功', receive:'部分成功', result:'共发送 18 条商品；16 条接收成功，2 条因 SKU 编码冲突未接收。'},\n      {id:'PUSH-20260808-0088', code:'MEMBER_MALL_SYNC', name:'会员商城选品同步', created:'2026-08-08 17:42:30', handled:'2026-08-08 17:42:38', push:'失败', receive:'失败', result:'下游服务响应超时，请检查连接状态后重推。'},\n      {id:'PUSH-20260808-0081', code:'DEALER_PRODUCT_SYNC', name:'经销商商品同步', created:'2026-08-08 13:15:02', handled:'处理中', push:'处理中', receive:'未接收', result:'正在向下游系统发送商品数据。'}\n    ];\n    let currentEdit = null, selectedProps = [], selectedScope = [], currentLog = null;\n    const tags = ['新品','限量款','常规款','会员专享','礼盒']; const categories = ['打火机','煤油机','气体机','配件','礼盒套装']; const properties = ['商品名称','SKU编码','主图','详情描述','销售状态','零售价','库存状态','品牌'];\n    function statusTag(value) { const type = value === '成功' || value === '启用' ? 'success' : value === '失败' ? 'danger' : value === '部分成功' ? 'warning' : value === '处理中' ? 'info' : 'neutral'; return `\u003cspan class=\"tag tag-${type}\">\u003cspan class=\"dot\">\u003c/span>${value}\u003c/span>`; }\n    function renderSubscribers() { const key = document.querySelector('#sub-keyword').value.trim(); const system = document.querySelector('#sub-system').value; const status = document.querySelector('#sub-status').value; const rows = subscribers.filter(s => (!key || (s.name+s.code).toLowerCase().includes(key.toLowerCase())) && (!system || s.system===system) && (!status || s.status===status)); document.querySelector('#sub-count').textContent = rows.length; document.querySelector('#subscriber-body').innerHTML = rows.length ? rows.map(s => `\u003ctr>\u003ctd>\u003cinput class=\"checkbox sub-check\" type=\"checkbox\" data-id=\"${s.id}\" aria-label=\"选择 ${s.name}\" onchange=\"updateSelected()\">\u003c/td>\u003ctd>\u003cb>${s.name}\u003c/b>\u003cdiv class=\"muted mono\">${s.code}\u003c/div>\u003c/td>\u003ctd>${s.system}\u003c/td>\u003ctd>${statusTag(s.status)}\u003c/td>\u003ctd class=\"time muted\">${s.updated}\u003c/td>\u003ctd>\u003cdiv class=\"table-actions\">\u003cbutton class=\"btn-link\" onclick=\"openForm(${s.id})\">编辑\u003c/button>\u003cbutton class=\"btn-link ${s.status==='启用'?'btn-danger':''}\" onclick=\"toggleSubscriber(${s.id})\">${s.status==='启用'?'停用':'启用'}\u003c/button>\u003c/div>\u003c/td>\u003c/tr>`).join('') : `\u003ctr>\u003ctd colspan=\"6\">\u003cdiv style=\"padding:var(--spacing-xxl);text-align:center;color:var(--color-text-tertiary)\">未找到符合条件的订阅器 \u003cbutton class=\"btn-link\" onclick=\"resetSubFilters()\">清空筛选\u003c/button>\u003c/div>\u003c/td>\u003c/tr>`; lucide.createIcons(); }\n    function resetSubFilters(){ document.querySelector('#sub-keyword').value='';document.querySelector('#sub-system').value='';document.querySelector('#sub-status').value='';renderSubscribers(); }\n    function selectAllSubscribers(checked){document.querySelectorAll('.sub-check').forEach(x=>x.checked=checked);updateSelected();} function updateSelected(){const n=document.querySelectorAll('.sub-check:checked').length;document.querySelector('#selected-hint').textContent=`已选 ${n} 项`;document.querySelector('#batch-disable').disabled=!n;}\n    function toggleSubscriber(id){ const s=subscribers.find(x=>x.id===id); s.status=s.status==='启用'?'停用':'启用'; renderSubscribers(); showToast(`已${s.status==='启用'?'启用':'停用'}「${s.name}」`); }\n    function switchView(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelector('#'+id).classList.add('active');document.querySelectorAll('.nav-item[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===id));document.querySelector('#crumb').textContent=id==='subscriber-list'?'订阅器':id==='log-list'?'推送日志':'订阅器配置';window.scrollTo(0,0);}\n    document.querySelectorAll('.nav-item[data-view]').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));\n    function openForm(id){ currentEdit=id?subscribers.find(x=>x.id===id):null; document.querySelector('#form-title').textContent=currentEdit?'编辑订阅器':'新建订阅器'; document.querySelector('#form-code').value=currentEdit?.code||''; document.querySelector('#form-name').value=currentEdit?.name||''; document.querySelector('#form-system').value=currentEdit?.system||''; document.querySelector('#form-enabled').checked=currentEdit?.status==='启用'; document.querySelector('#form-note').value=''; document.querySelector('input[name=\"scope\"][value=\"'+(currentEdit?.scope||'标签')+'\"]').checked=true; selectedScope=[...(currentEdit?.values||[])]; selectedProps=[...(currentEdit?.props||[])]; changeScope(currentEdit?.scope||'标签',true); propertiesRender(); ['code','name','system','scope','properties'].forEach(x=>document.querySelector('#error-'+x).textContent=''); switchView('subscriber-form'); }\n    function backToSubscribers(){ switchView('subscriber-list'); }\n    function changeScope(scope, preserve){ if(!preserve) selectedScope=[];document.querySelector('#scope-label').textContent=scope==='标签'?'推送范围值（商品标签）':'推送范围值（商品分类）'; const choices=scope==='标签'?tags:categories; document.querySelector('#scope-chips').innerHTML=choices.map(x=>`\u003cbutton type=\"button\" class=\"chip ${selectedScope.includes(x)?'selected':''}\" onclick=\"toggleScope('${x}')\">${x}\u003c/button>`).join(''); }\n    function toggleScope(v){selectedScope=selectedScope.includes(v)?selectedScope.filter(x=>x!==v):[...selectedScope,v];changeScope(document.querySelector('input[name=\"scope\"]:checked').value,true);}\n    function propertiesRender(){document.querySelector('#property-chips').innerHTML=properties.map(x=>`\u003cbutton type=\"button\" class=\"chip ${selectedProps.includes(x)?'selected':''}\" onclick=\"toggleProp('${x}')\">${x}\u003c/button>`).join('');} function toggleProp(v){selectedProps=selectedProps.includes(v)?selectedProps.filter(x=>x!==v):[...selectedProps,v];propertiesRender();} function selectAllProperties(){selectedProps=[...properties];propertiesRender();}\n    document.querySelector('#subscriber-form-el').addEventListener('submit', e=>{e.preventDefault();const code=document.querySelector('#form-code').value.trim(),name=document.querySelector('#form-name').value.trim(),system=document.querySelector('#form-system').value, enabled=document.querySelector('#form-enabled').checked; const errors={code:!code?'请输入订阅器编码':'',name:!name?'请输入订阅器名称':name.length>50?'名称不能超过 50 个字符':'',system:!system?'请选择已连接系统':'',scope:!selectedScope.length?'请选择一个范围值':'',properties:!selectedProps.length?'请选择至少一个触发属性':''};Object.entries(errors).forEach(([k,v])=>document.querySelector('#error-'+k).textContent=v);if(Object.values(errors).some(Boolean))return;if(enabled&&(!selectedScope.length||!selectedProps.length))return;const scope=document.querySelector('input[name=\"scope\"]:checked').value; if(currentEdit){Object.assign(currentEdit,{code,name,system,scope,values:selectedScope,props:selectedProps,status:enabled?'启用':'停用',updated:'2026-08-09 11:08:36'});}else{subscribers.unshift({id:Date.now(),code,name,system,scope,values:selectedScope,props:selectedProps,status:enabled?'启用':'停用',updated:'2026-08-09 11:08:36'});}renderSubscribers();backToSubscribers();showToast(currentEdit?'订阅器已更新':'订阅器已创建（默认可保持停用）');});\n    function renderLogs(){const key=document.querySelector('#log-keyword').value.trim(),ps=document.querySelector('#log-status').value,rs=document.querySelector('#receive-status').value;const rows=logs.filter(l=>(!key||(l.name+l.code).includes(key))&&(!ps||l.push===ps)&&(!rs||l.receive===rs));document.querySelector('#log-count').textContent=rows.length;document.querySelector('#log-body').innerHTML=rows.length?rows.map((l,i)=>`\u003ctr>\u003ctd class=\"mono\">${l.code}\u003c/td>\u003ctd>\u003cb>${l.name}\u003c/b>\u003cdiv class=\"muted mono\">${l.id}\u003c/div>\u003c/td>\u003ctd class=\"time\">${l.created}\u003c/td>\u003ctd class=\"time\">${l.handled}\u003c/td>\u003ctd>${statusTag(l.push)}\u003c/td>\u003ctd>${statusTag(l.receive)}\u003c/td>\u003ctd>\u003cdiv class=\"table-actions\">\u003cbutton class=\"btn-link\" onclick=\"openLog('${l.id}')\">查看\u003c/button>\u003cbutton class=\"btn-link\" onclick=\"exportLog('${l.id}')\">导出明细\u003c/button>${canRetry(l)?`\u003cbutton class=\"btn-link\" onclick=\"retryLog('${l.id}')\">重推\u003c/button>`:''}\u003c/div>\u003c/td>\u003c/tr>`).join(''):`\u003ctr>\u003ctd colspan=\"7\">\u003cdiv style=\"padding:var(--spacing-xxl);text-align:center;color:var(--color-text-tertiary)\">暂无推送日志 \u003cbutton class=\"btn-link\" onclick=\"resetLogFilters()\">清空筛选\u003c/button>\u003c/div>\u003c/td>\u003c/tr>`;lucide.createIcons();}\n    function resetLogFilters(){document.querySelector('#log-keyword').value='';document.querySelector('#log-status').value='';document.querySelector('#receive-status').value='';renderLogs();} function openLogsFor(name){switchView('log-list');document.querySelector('#log-keyword').value=name;renderLogs();} function canRetry(l){return ['失败','部分成功'].includes(l.push)||['失败','部分成功','未接收'].includes(l.receive);}\n    function openLog(id){currentLog=logs.find(l=>l.id===id);const l=currentLog;document.querySelector('#detail-name').textContent=l.name;document.querySelector('#detail-id').textContent=l.id;document.querySelector('#detail-created').textContent=l.created;document.querySelector('#detail-handled').textContent=l.handled;document.querySelector('#detail-push').innerHTML=statusTag(l.push);document.querySelector('#detail-receive').innerHTML=statusTag(l.receive);document.querySelector('#detail-result').textContent=l.result;document.querySelector('#retry-detail').classList.toggle('hidden',!canRetry(l));const failed=l.push==='失败';const steps=[['任务创建','已创建推送任务并锁定订阅器范围',l.created],['数据准备','已装配待推送商品数据',l.created],['数据分发中','系统正在向下游发送数据',l.handled],['下游接收中',failed?'下游服务未在限定时间内响应':'已收到下游接收回执',l.handled], [failed?'异常终止':'结果结束',failed?'任务结束，建议检查连接状态后重推':'任务完成，结果已写入日志',l.handled]];document.querySelector('#tim  const generateLine = document.querySelector('#generateLine');\n    const selectionCount = document.querySelector('#selectionCount');\n    const generateTitle = document.querySelector('#generateTitle');\n    const notice = document.querySelector('#notice');\n    const result = document.querySelector('#result');\n    const resultTitle = document.querySelector('#resultTitle');\n    const productTitle = document.querySelector('#productTitle');\r\n    const toggleAI = document.querySelector('#toggleAI');\r\n    const aiPanel = document.querySelector('#aiPanel');\n    const toast = document.querySelector('#toast');\n    let hasImage = true;\n    let selected = [];\n    const keywords = ['金属外壳','简约设计','黑色','防风','长方形'];\n\n    function showToast(message) { toast.textContent = message; toast.classList.add('show'); window.clearTimeout(showToast.timer); showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 2600); }\n    function showNotice(message) { notice.textContent = message; notice.classList.add('show'); }\n    function syncSelection() { selectionCount.textContent = selected.length ? `已选择 ${selected.length} 个关键词` : '请至少选择 1 个关键词'; notice.classList.remove('show'); }\n    toggleAI.addEventListener('click', () => {\r\n      aiPanel.hidden = !aiPanel.hidden;\r\n      const expanded = !aiPanel.hidden;\r\n      toggleAI.setAttribute('aria-expanded', String(expanded));\r\n      toggleAI.textContent = expanded ? '收起 AI辅助填写' : 'AI辅助填写';\r\n    });\r\n    imageInput.addEventListener('change', event => { const file = event.target.files[0]; if (!file) return; hasImage = true; previewImage.src = URL.createObjectURL(file); imageHint.textContent = `已选择：${file.name}`; recognitionState.textContent = '图片已上传，可开始 AI 识别'; recognitionState.className = 'recognition-state success'; keywordLine.style.display = 'none'; result.classList.remove('show'); selected = []; });\n    recognize.addEventListener('click', () => { if (!hasImage) { showToast('请先提供可读取的商品图片，再进行 AI 识别。'); return; } recognize.disabled = true; recognize.textContent = '识别中…'; recognitionState.textContent = '正在分析图片内容…'; recognitionState.className = 'recognition-state'; result.classList.remove('show'); notice.classList.remove('show'); window.setTimeout(() => { keywordList.innerHTML = ''; selected = []; keywords.forEach(word => { const button = document.createElement('button'); button.type = 'button'; button.className = 'keyword'; button.textContent = word; button.setAttribute('aria-pressed', 'false'); button.addEventListener('click', () => { const active = button.classList.toggle('selected'); button.setAttribute('aria-pressed', active ? 'true' : 'false'); selected = active ? [...selected, word] : selected.filter(item => item !== word); syncSelection(); }); keywordList.append(button); }); keywordLine.style.display = 'flex'; keywordList.classList.add('visible');  recognize.disabled = false; recognize.textContent = 'AI 识别'; recognitionState.textContent = '识别完成，请选择关键词'; recognitionState.className = 'recognition-state success'; syncSelection(); }, 520); });\n    generateTitle.addEventListener('click', () => { if (!selected.length) { showNotice('请至少选择一个关键词后，再生成商品标题。'); return; } generateTitle.disabled = true; generateTitle.textContent = '生成中…'; notice.classList.remove('show'); window.setTimeout(() => { const title = `Zippo ${selected.join(' ')}打火机`; resultTitle.textContent = title; result.classList.add('show'); generateTitle.disabled = false; generateTitle.textContent = '确认关键词并生成商品标题'; }, 460); });\n    document.querySelector('#applyTitle').addEventListener('click', () => { productTitle.value = resultTitle.textContent; productTitle.focus(); showToast('AI 生成的商品标题已填入，可继续人工编辑。'); });\n  \u003c/script>\n\u003cscript>\ndocument.documentElement.classList.add('integrated-embed');\n(function(){\n  if(!window.lucide) window.lucide={createIcons:function(){}};\n  var note=document.createElement('div');note.className='prototype-feedback';document.body.appendChild(note);var timer;\n  window.prototypeFeedback=function(msg){note.textContent=msg;note.classList.add('show');clearTimeout(timer);timer=setTimeout(function(){note.classList.remove('show')},1800)};\n  document.addEventListener('click',function(e){\n    var b=e.target.closest('button');if(!b||b.disabled)return;\n    var text=(b.textContent||'').replace(/\\s+/g,' ').trim();\n    if(text==='重置'){\n      var scope=b.closest('.card,.filter,.filter-card,.toolbar,section')||document;\n      scope.querySelectorAll('input:not([type=checkbox]):not([type=radio]),textarea').forEach(function(x){x.value=''});\n      scope.querySelectorAll('select').forEach(function(x){x.selectedIndex=0});\n      prototypeFeedback('筛选条件已重置');\n    }else if((text==='查询'||text==='搜索')&&!b.hasAttribute('onclick')) prototypeFeedback('已按当前条件刷新列表');\n    else if((text==='保存草稿'||text==='提交审核'||text==='取消')&&!b.id&&!b.hasAttribute('onclick')) prototypeFeedback(text==='取消'?'已取消当前操作':text+'成功');\n    else if(!b.id&&!b.hasAttribute('onclick')&&![...b.attributes].some(function(a){return a.name.indexOf('data-')===0})){prototypeFeedback((text||'当前')+'操作已响应')}\n  });\n  document.addEventListener('click',function(e){var link=e.target.closest('.link');if(!link||link.hasAttribute('onclick')||[...link.attributes].some(function(a){return a.name.indexOf('data-')===0}))return;prototypeFeedback(((link.textContent||'').trim()||'当前')+'操作已响应')});\n  document.querySelectorAll('.tabs .tab').forEach(function(tab){tab.addEventListener('click',function(){var tabs=tab.closest('.tabs');tabs.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});tab.classList.add('active');prototypeFeedback('已切换至'+tab.textContent.trim())})});\n  document.querySelectorAll('.page-num').forEach(function(x){x.addEventListener('click',function(){document.querySelectorAll('.page-num').forEach(function(n){n.classList.remove('on')});if(/^\\d+$/.test(x.textContent.trim()))x.classList.add('on');prototypeFeedback('列表分页已切换')})});\n  window.parent.postMessage({type:'product-ready'},'*');\n})();\u003c/script>\u003cscript id=\"universal-query-v2\">\n(function(){\n  function normal(v){return (v||'').replace(/\\s+/g,'').trim().toLowerCase()}\n  function text(el){return normal(el.textContent||'')}\n  function visible(el){return !!(el&&el.getClientRects().length)}\n  function getFilter(button){return button.closest('.filter,.filter-card')||button.closest('.card')||button.parentElement}\n  function getTable(filter,section){\n    const tables=[...(section||document).querySelectorAll('table')].filter(visible);\n    return tables.find(t=>filter.compareDocumentPosition(t)&Node.DOCUMENT_POSITION_FOLLOWING)||tables[0];\n  }\n  function criteria(filter){\n    return [...filter.querySelectorAll('input,select')].map(el=>{\n      if(el.type==='checkbox'||el.type==='radio'||el.type==='file')return '';\n      const v=(el.value||'').trim();\n      if(!v||/^(全部|多选|当前来源字段|已保存列配置|20条)/.test(v))return '';\n      return normal(v);\n    }).filter(Boolean);\n  }\n  function restore(table){\n    if(!table)return 0;\n    const body=table.tBodies[0];if(!body)return 0;\n    body.querySelectorAll('[data-query-empty]').forEach(x=>x.remove());\n    const rows=[...body.rows];rows.forEach(r=>r.hidden=false);return rows.length;\n  }\n  function updateCount(section,count){\n    const pager=section&&section.querySelector('.pager,.pagination');if(!pager)return;\n    const first=pager.querySelector('span');if(first&&/共s*\\d+s*条/.test(first.textContent))first.textContent='共 '+count+' 条';\n  }\n  function run(button){\n    const filter=getFilter(button),section=button.closest('section')||document.querySelector('.view.active,.page.active')||document;\n    const table=getTable(filter,section);if(!table)return window.prototypeFeedback&&prototypeFeedback('当前页面没有可查询的列表');\n    const body=table.tBodies[0];if(!body)return;\n    restore(table);const values=criteria(filter);const rows=[...body.rows];let count=0;\n    rows.forEach(row=>{const match=values.every(v=>text(row).includes(v));row.hidden=!match;if(match)count++});\n    if(!count){const empty=body.insertRow();empty.dataset.queryEmpty='1';const cell=empty.insertCell();cell.colSpan=Math.max(1,table.tHead?.rows[0]?.cells.length||1);cell.className='empty';cell.textContent='未找到符合当前条件的数据';}\n    updateCount(section,count);window.prototypeFeedback&&prototypeFeedback('查询完成，共 '+count+' 条');\n  }\n  function reset(button){\n    const filter=getFilter(button),section=button.closest('section')||document.querySelector('.view.active,.page.active')||document;\n    filter.querySelectorAll('input').forEach(el=>{if(!['checkbox','radio','file'].includes(el.type))el.value=''});\n    filter.querySelectorAll('select').forEach(el=>el.selectedIndex=0);\n    const table=getTable(filter,section),count=restore(table);updateCount(section,count);window.prototypeFeedback&&prototypeFeedback('已重置，共 '+count+' 条');\n  }\n  document.addEventListener('click',function(e){\n    const button=e.target.closest('button');if(!button||button.hasAttribute('onclick'))return;\n    const label=(button.textContent||'').replace(/\\s+/g,' ').trim();\n    if(label==='查询'){e.preventDefault();run(button)}else if(label==='重置'){e.preventDefault();reset(button)}\n  });\n})();\n\u003c/script>\u003c/body>\n\u003c/html>\n\r\n\r\n\r\n\r\n","04-商品管理-组合商品.html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  \u003ctitle>AI-PIM｜组合商品交互原型\u003c/title>\n  \u003cstyle>\n    :root{--color-primary:#C8102E;--color-primary-hover:#145fc2;--color-primary-bg:#e8f1fd;--color-text:#141414;--color-text-2:#595959;--color-text-3:#8c8c8c;--color-bg:#f5f7fa;--color-card:#fff;--color-border:#d9d9d9;--color-border-light:#eef0f3;--color-success:#178a49;--color-success-bg:#e9f9ee;--color-warning:#b86200;--color-warning-bg:#fff3e6;--color-danger:#d9363e;--color-danger-bg:#fdecec;--color-info:#087c8c;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;- or-mask) !important; }\n.modal, .drawer { background: var(--brand-white) !important; border-color: var(--brand-gray-2) !important; box-shadow: 0 16px 48px rgba(17, 17, 17, .22) !important; }\n.modal-head, .modal-foot, .drawer-head, .drawer-footer { border-color: var(--brand-gray-2) !important; }\n.modal-head h2, .drawer-head h2 { color: var(--brand-black) !important; }\n.notice { color: var(--brand-warning) !important; background: #f4f0e8 !important; border-color: #ded3bb !important; }\n.toast { color: var(--brand-white) !important; background: var(--brand-black) !important; border-color: var(--brand-black) !important; }\n\n/* Combo product specific surfaces */\n.step.active, .step.current, .progress-step.active { color: var(--brand-red) !important; border-color: var(--brand-red) !important; }\n.step-line.active, .progress-line.active { background: var(--brand-red) !important; }\n.risk, .risk-warning, .danger-text { color: var(--brand-red) !important; }\n\n/* Focus and motion: preserve keyboard visibility without changing behavior. */\nbutton:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {\n  outline: 3px solid rgba(166, 25, 46, .35) !important;\n  outline-offset: 2px;\n}\n\n/* Responsive surface treatment from AI-PIM layout rules. */\n@media (max-width: 768px) {\n  .page, .main { padding: 16px !important; }\n  .toolbar, .filter { gap: 8px !important; }\n  .btn { min-height: 36px; }\n}\n\n/* Dark mode mapping. Existing dark-mode toggles remain the only trigger. */\n:root.dark, html.dark {\n  --brand-black: #f2f2f2;\n  --brand-white: #1b1b1b;\n  --brand-gray-1: #242424;\n  --brand-gray-2: #343434;\n  --brand-gray-3: #4a4a4a;\n  --brand-gray-4: #a1a1a1;\n  --brand-gray-5: #d2d2d2;\n  --brand-red-soft: #4a2028;\n  --color-text-primary: #f2f2f2;\n  --color-text-secondary: #d2d2d2;\n  --color-text-tertiary: #a1a1a1;\n  --color-bg-page: #151515;\n  --color-bg-container: #1b1b1b;\n  --color-bg-fill: #242424;\n  --color-ca e.step?'✓':no}\u003c/div>\u003cdiv class=\"step-label\">\u003cb>${n}\u003c/b>\u003csmall>${no===state.step?'正在填写':no\u003cstate.step?'已完成':'待填写'}\u003c/small>\u003c/div>\u003c/div>`}).join('');$$('[data-step]').forEach(e=>e.onclick=()=>{const n=+e.dataset.step;if(n\u003c=state.visited){state.step=n;renderWizard()}})}\nfunction step1(){return `\u003cdiv class=\"wizard-title\">基础信息与 SPU 关联\u003c/div>\u003cdiv class=\"wizard-desc\">填写组合商品独立资料，并通过 SPU Code 查询建立唯一归属。\u003c/div>\u003cdiv class=\"section\">\u003cdiv class=\"section-title\">商品标识\u003c/div>\u003cdiv class=\"section-body form-grid\">\u003cdiv class=\"form-item\">\u003clabel class=\"req\">品牌\u003c/label>\u003cselect class=\"select\">\u003coption>ZIPPO\u003c/option>\u003c/select>\u003cdiv class=\"hint\">首次保存后不可修改\u003c/div>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>商品类型\u003c/label>\u003cinput class=\"input readonly\" value=\"组合商品\" readonly>\u003cdiv class=\"hint\">保存后永久不可转换\u003c/div>\u003c/div>\u003cdiv class=\"form-item\">\u003clabel class=\"req\">SKU 名称\u003c/label>\u003cinput class=\"input\" value=\"火焰经典礼盒组合\" maxlength=\"120\">\u003c/div>\u003cdiv class=\"form-item\">\u003clabel>SKU 编码\u003c/label>\u003cinput class=\"input\" placeholder=\"留空则由系统生成\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"section\">\u003cdiv class=\"section-title\">关联 SPU \u003cspan class=\"tag blue\">创建时必填\u003c/span>\u003c/div>\u003cdiv class=\"section-body\">\u003cdiv class=\"field-inline\" style=\"margin-bottom:16px\">\u003cinput class=\"input search\" value=\"SPU-GIFT-021\" aria-label=\"SPU Code\">\u003cbutton class=\"btn\" id=\"spuSearch\">查询\u003c/button>\u003c/div>${state.spu?`\u003cdiv class=\"selected-spu\">\u003cdiv class=\"spu-mark\">SPU\u003c/div>\u003cdiv class=\"spu-info\">\u003cb>SPU-GIFT-021 · 经典礼盒\u003c/b>\u003cspan class=\"subtitle\">ZIPPO · 已发布 · 已包含 4 个 SKU\u003c/span>\u003c/div>\u003cspan class=\"tag green\">品牌一致\u003c/span>\u003cbutton class=\"btn ghost small\" id=\"changeSpu\">重新选择\u003c/butto e\u003cmain class=\"main\"\u003e\n\u003csection class=\"page active\" id=\"tags\"\u003e\u003cdiv class=\"head\"\u003e\u003cdiv\u003e\u003ch1\u003e标签管理\u003c/h1\u003e\u003cp class=\"sub\"\u003e维护可用于基础 SPU 与 SKU 的层级标签。\u003c/p\u003e\u003c/div\u003e\u003cbutton class=\"btn primary\" data-open=\"tagModal\"\u003e新建根标签\u003c/button\u003e\u003c/div\u003e\u003cdiv class=\"card\"\u003e\u003cdiv class=\"filter\"\u003e\u003cinput class=\"input\" placeholder=\"搜索标签名称\" aria-label=\"搜索标签名称\"\u003e\u003cspan class=\"muted\"\u003e停用标签不可新建关联，已有商品关联仍可查看。\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"tree\" id=\"tree\"\u003e\u003cdiv class=\"tree-row\"\u003e\u003cstrong\u003e⌄ 产品状态\u003c/strong\u003e\u003cspan class=\"grow\"\u003e\u003c/span\u003e\u003cspan class=\"tag success\"\u003e启用\u003c/span\u003e\u003cbutton class=\"btn\" data-open=\"tagModal\"\u003e新建子标签\u003c/button\u003e\u003c/div\u003e\u003cdiv class=\"tree-row child\"\u003e\u003cspan\u003e新品\u003c/span\u003e\u003cspan class=\"grow\"\u003e\u003c/span\u003e\u003cspan class=\"tag success\"\u003e启用\u003c/span\u003e\u003cbutton class=\"btn\"\u003e编辑\u003c/button\u003e\u003c/div\u003e\u003cdiv class=\"tree-row child\"\u003e\u003cspan\u003e常规品\u003c/span\u003e\u003cspan class=\"grow\"\u003e\u003c/span\u003e\u003cspan class=\"tag success\"\u003e启用\u003c/span\u003e\u003cbutton class=\"btn\"\u003e编辑\u003c/button\u003e\u003c/div\u003e\u003cdiv class=\"tree-row\"\u003e\u003cstrong\u003e› 渠道适用\u003c/strong\u003e\u003cspan class=\"grow\"\u003e\u003c/span\u003e\u003cspan class=\"tag success\"\u003e启用\u003c/span\u003e\u003cbutton class=\"btn\" data-open=\"tagModal\"\u003e新建子标签\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\n\u003csection class=\"page\" id=\"batch\"\u003e\u003cdiv class=\"head\"\u003e\u003cdiv\u003e\u003ch1\u003e批量打标签\u003c/h1\u003e\u003cp class=\"sub\"\u003e选择同一维度的基础商品，批量添加或移除标签。\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"toolbar\"\u003e\u003cbutton class=\"btn primary\" id=\"openBatch\" disabled\u003e批量打标签（\u003cspan id=\"selectedCount\"\u003e0\u003c/span\u003e）\u003c/button\u003e\u003cbutton class=\"btn\" id=\"clear\" disabled\u003e清空选择\u003c/button\u003e\u003c/div\u003e\u003cdiv class=\"filter\"\u003e\u003cinput class=\"input\" placeholder=\"搜索 SPU 编码或名称\" aria-label=\"搜索商品\"\u003e\u003cselect class=\"select\" aria-label=\"商品状态\"\u003e\u003coption\u003e全部状态\u003c/option\u003e\u003coption\u003e正式\u003c/option\u003e\u003coption\u003e草稿\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\u003cdiv class=\"card table-wrap\"\u003e\u003ctable class=\"table\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e\u003cinput id=\"all\" type=\"checkbox\" aria-label=\"全选商品\"\u003e\u003c/th\u003e\u003cth\u003eSPU 编码\u003c/th\u003e\u003cth\u003e商品名称\u003c/th\u003e\u003cth\u003e当前标签\u003c/th\u003e\u003cth\u003e更新时间\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody id=\"products\"\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\n\u003csection class=\"page\" id=\"auto\"\u003e\u003cdiv class=\"head\"\u003e\u003cdiv\u003e\u003ch1\u003e自动打标\u003c/h1\u003e\u003cp class=\"sub\"\u003e按商品品类多选条件，为首次新建的基础商品自动添加标签。\u003c/p\u003e\u003c/div\u003e\u003cbutton class=\"btn primary\" data-open=\"ruleModal\"\u003e新建规则\u003c/button\u003e\u003c/div\u003e\u003cdiv class=\"filter\"\u003e\u003cinput class=\"input\" placeholder=\"规则名称\" aria-label=\"搜索规则\"\u003e\u003cselect class=\"select\" aria-label=\"规则状态\"\u003e\u003coption\u003e全部状态\u003c/option\u003e\u003coption\u003e启用\u003c/option\u003e\u003coption\u003e停用\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\u003cdiv class=\"card table-wrap\"\u003e\u003ctable class=\"table\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e规则名称\u003c/th\u003e\u003cth\u003e对象维度\u003c/th\u003e\u003cth\u003e商品品类（多选）\u003c/th\u003e\u003cth\u003e目标标签\u003c/th\u003e\u003cth\u003e状态\u003c/th\u003e\u003cth\u003e最近执行\u003c/th\u003e\u003cth\u003e操作\u003c/th\u003e\u003c/tr\u003e\u003c/ e-subtitle\"\u003e配置商品推送范围与属性变更触发规则\u003c/p\u003e\u003c/div\u003e\u003cbutton class=\"btn\" onclick=\"backToSubscribers()\"\u003e返回列表\u003c/button\u003e\u003c/div\u003e\n          \u003cform id=\"subscriber-form-el\" novalidate\u003e\n            \u003cdiv class=\"card form-section\"\u003e\u003ch2 class=\"section-title\"\u003e基础信息\u003c/h2\u003e\u003cdiv class=\"form-grid\"\u003e\u003cdiv\u003e\u003clabel class=\"form-label required\"\u003e订阅器编码\u003c/label\u003e\u003cinput class=\"form-control\" id=\"form-code\" aria-required=\"true\" placeholder=\"例如：DEALER_PRODUCT_SYNC\"\u003e\u003cdiv class=\"error-text\" id=\"error-code\"\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"span-2\"\u003e\u003clabel class=\"form-label required\"\u003e订阅器名称\u003c/label\u003e\u003cinput class=\"form-control\" id=\"form-name\" aria-required=\"true\" maxlength=\"50\" placeholder=\"请输入 1–50 个字符\"\u003e\u003cdiv class=\"error-text\" id=\"error-name\"\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv\u003e\u003clabel class=\"form-label required\"\u003e下游系统\u003c/label\u003e\u003cselect class=\"form-control\" id=\"form-system\" aria-required=\"true\"\u003e\u003coption value=\"\"\u003e请选择已连接系统\u003c/option\u003e\u003coption\u003e经销商门户\u003c/option\u003e\u003coption\u003e电商中台\u003c/option\u003e\u003coption\u003e会员商城\u003c/option\u003e\u003c/select\u003e\u003cdiv class=\"error-text\" id=\"error-system\"\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv\u003e\u003clabel class=\"form-label\"\u003e启用状态\u003c/label\u003e\u003cdiv style=\"height:34px;display:flex;align-items:center;gap:var(--spacing-sm)\"\u003e\u003clabel class=\"switch\"\u003e\u003cinput type=\"checkbox\" id=\"form-enabled\"\u003e\u003cspan class=\"slider\"\u003e\u003c/span\u003e\u003c/label\u003e\u003cspan id=\"enable-text\" class=\"muted\"\u003e保存后可启用\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n            \u003cdiv class=\"card form-section\"\u003e\u003ch2 class=\"section-title\"\u003e推送范围 \"\u003e\u003cdiv\u003e\u003ch1\u003e推送日志\u003c/h1\u003e\u003cp class=\"page-subtitle\"\u003e查看每次商品数据分发的处理过程与下游接收结果\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\n          \u003cdiv class=\"card filter-card\"\u003e\u003cdiv class=\"filters\"\u003e\u003cdiv class=\"field\"\u003e\u003clabel\u003e订阅器名称\u003c/label\u003e\u003cinput id=\"log-keyword\" placeholder=\"订阅器名称或编码\"\u003e\u003c/div\u003e\u003cdiv class=\"field\"\u003e\u003clabel\u003e创建时间\u003c/label\u003e\u003cdiv class=\"range\"\u003e\u003cinput type=\"date\"\u003e\u003cinput type=\"date\"\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"field\"\u003e\u003clabel\u003e推送状态\u003c/label\u003e\u003cselect id=\"log-status\"\u003e\u003coption value=\"\"\u003e全部状态\u003c/option\u003e\u003coption\u003e成功\u003c/option\u003e\u003coption\u003e失败\u003c/option\u003e\u003coption\u003e部分成功\u003c/option\u003e\u003coption\u003e处理中\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\u003cdiv class=\"field\"\u003e\u003clabel\u003e接受状态\u003c/label\u003e\u003cselect id=\"receive-status\"\u003e\u003coption value=\"\"\u003e全部状态\u003c/option\u003e\u003coption\u003e成功\u003c/option\u003e\u003coption\u003e失败\u003c/option\u003e\u003coption\u003e部分成功\u003c/option\u003e\u003coption\u003e未接收\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\u003cdiv class=\"filter-actions\"\u003e\u003cbutton class=\"btn btn-primary\" onclick=\"renderLogs()\"\u003e查询\u003c/button\u003e\u003cbutton class=\"btn\" onclick=\"resetLogFilters()\"\u003e重置\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n          \u003cdiv class=\"card table-card\"\u003e\u003cdiv class=\"toolbar\"\u003e\u003cdiv class=\"toolbar-left\"\u003e\u003cspan class=\"muted\"\u003e日志数据保留完整状态节点，敏感认证信息不会在此展示\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"toolbar-right\"\u003e\u003cbutton class=\"btn\" onclick=\"showToast('日志列表已刷新')\"\u003e\u003ci data-lucide=\"refresh-cw\"\u003e\u003c/i\u003e刷新\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e\u003ctable\u00 <script>
/* D06 shell: pad list tables inside iframe to 120 + C-Pager; do not touch pages[] source */
(function () {
  const TARGET = 120;
  function padDoc(doc) {
    if (!doc || !doc.body) return;
    doc.querySelectorAll('table').forEach((table) => {
      if (table.dataset.mockPadded) return;
      const tb = table.tBodies && table.tBodies[0];
      if (!tb || tb.rows.length < 2 || tb.rows.length >= TARGET) {
        if (tb && tb.rows.length >= TARGET) table.dataset.mockPadded = '1';
        return;
      }
      const seed = [...tb.rows].map((r) => r.outerHTML);
      while (tb.rows.length < TARGET) {
        const html = seed[tb.rows.length % seed.length];
        tb.insertAdjacentHTML('beforeend', html);
      }
      table.dataset.mockPadded = '1';
      let page = 1, size = 20;
      const all = [...tb.rows];
      let pager = table.parentElement && table.parentElement.querySelector('.d06-pager');
      if (!pager) {
        pager = doc.createElement('div');
        pager.className = 'd06-pager';
        pager.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap;font-size:12px;color:#8A8A8A';
        (table.closest('.table-wrap, .table-card, .card, section, main') || table.parentElement).appendChild(pager);
      }
      function render() {
        const pages = Math.max(1, Math.ceil(all.length / size));
        if (page > pages) page = pages;
        all.forEach((r, i) => { r.style.display = (i >= (page - 1) * size && i < page * size) ? '' : 'none'; });
        pager.innerHTML = '<span>共 ' + all.length + ' 条 · 第 ' + page + '/' + pages + ' 页</span>' +
          '<div style="display:flex;gap:8px;align-items:center">' +
          '<select><option value="20">20条/页</option><option value="50">50条/页</option><option value="100">100条/页</option></select>' +
          '<button type="button" class="pg-prev">上一页</button><button type="button" class="pg-next">下一页</button></div>';
        const sel = pager.querySelector('select'); sel.value = String(size);
        sel.onchange = () => { size = +sel.value; page = 1; render(); };
        pager.querySelector('.pg-prev').onclick = () => { page = Math.max(1, page - 1); render(); };
        pager.querySelector('.pg-next').onclick = () => { page = Math.min(pages, page + 1); render(); };
      }
      render();
    });
  }
  function hook() {
    const frame = document.getElementById('pageFrame');
    if (!frame) return;
    const run = () => {
      try { padDoc(frame.contentDocument); } catch (e) {}
    };
    frame.addEventListener('load', run);
    setTimeout(run, 800);
    setTimeout(run, 2000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', hook);
  else hook();
})();
</script>


<script>
/* D06 list UX: tabs above actions; SPU/SKU scoped toolbars */
(function(){
  function enhance(doc){
    if(!doc || doc.__d06Ux) return;
    var base = doc.getElementById('base') || doc.querySelector('#base.view, .view#base');
    if(!base) return;
    doc.__d06Ux = 1;
    var tabs = base.querySelector('.tabs');
    var head = base.querySelector(':scope > .head');
    if(tabs && head && head.compareDocumentPosition(tabs) & Node.DOCUMENT_POSITION_FOLLOWING){
      base.insertBefore(tabs, head);
    }
    // Mark existing head actions as SPU-scoped; build SKU action set
    if(head){
      var acts = head.querySelector('.actions, .btns, div:last-child');
      if(acts){
        acts.querySelectorAll('button,a').forEach(function(b){
          var tx=(b.textContent||'').replace(/\s+/g,'');
          if(/新建\s*SPU|导入商品|导出商品/.test(tx) || /新建SPU|导入|导出/.test(tx)) b.setAttribute('data-act-spu','1');
        });
        if(!head.querySelector('[data-act-sku]')){
          var skuWrap=doc.createElement('span');
          skuWrap.setAttribute('data-act-sku','1');
          skuWrap.style.cssText='display:none;gap:8px;align-items:center';
          skuWrap.innerHTML='<button type="button" class="btn" data-act-sku="1">导入商品</button><button type="button" class="btn" data-act-sku="1">导出商品</button><button type="button" class="btn" data-act-sku="1">+ 新建普通 SKU</button><button type="button" class="btn primary" data-act-sku="1">+ 新建组合商品 SKU</button>';
          acts.appendChild(skuWrap);
          // also mark buttons
          skuWrap.querySelectorAll('button').forEach(function(b){ b.setAttribute('data-act-sku','1'); });
        }
      }
      var title=head.querySelector('h1,h2,.title,strong');
      if(title) title.setAttribute('data-list-title','1');
    }
    // Hide nested SKU page head (duplicate)
    var skuHead=base.querySelector('#sku > .head, #sku .head');
    if(skuHead) skuHead.style.display='none';
    // Hide export inside filter actions when page-level export exists
    base.querySelectorAll('.filters .actions button, .filter-bar button').forEach(function(b){
      if(/导出/.test(b.textContent||'')) b.style.display='none';
    });
    function applyList(mode){
      base.setAttribute('data-list', mode);
      base.querySelectorAll('[data-act-spu]').forEach(function(el){
        el.style.display = mode==='spu' ? (el.tagName==='SPAN'?'inline-flex':'') : 'none';
      });
      base.querySelectorAll('[data-act-sku]').forEach(function(el){
        el.style.display = mode==='sku' ? (el.tagName==='SPAN'?'inline-flex':'') : 'none';
      });
      var title=base.querySelector('[data-list-title]');
      if(title) title.textContent = mode==='sku' ? 'SKU 管理' : 'SPU 管理';
    }
    function detect(){
      var sku=base.querySelector('#sku');
      var spu=base.querySelector('#spu');
      var skuOn = sku && getComputedStyle(sku).display!=='none';
      applyList(skuOn ? 'sku' : 'spu');
    }
    base.querySelectorAll('.tabs .tab, .tabs button, [data-tab]').forEach(function(tab){
      tab.addEventListener('click', function(){ setTimeout(detect, 30); });
    });
    detect();
  }
  function hook(){
    var f=document.getElementById('pageFrame');
    if(!f) return;
    f.addEventListener('load', function(){
      try{ enhance(f.contentDocument); }catch(e){}
    });
    // also try immediately if already loaded
    try{ if(f.contentDocument && f.contentDocument.readyState==='complete') enhance(f.contentDocument); }catch(e){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', hook);
  else hook();
  // re-hook after showPage navigations
  var _sp = window.showPage;
  if(typeof _sp==='function'){
    window.showPage=function(){
      var r=_sp.apply(this, arguments);
      setTimeout(hook, 50);
      return r;
    };
  }
})();
</script>
