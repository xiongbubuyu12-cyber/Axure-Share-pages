<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- poc-embed-guest -->
<script src="poc-embed-guest.js"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D11 审批中心 · 黑红品牌版原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#C8102E', hover: '#A00D25', active: '#7A0A1C', bg: '#FDE8EC' },
            success: { DEFAULT: '#2F6B3A', bg: '#EAF5EC' },
            warning: { DEFAULT: '#8A6A1A', bg: '#F7F1DE' },
            danger: { DEFAULT: '#C8102E', bg: '#FDE8EC' },
            info: { DEFAULT: '#4A4A4A', bg: '#F0F0F0' },
            ink: { DEFAULT: '#0A0A0A', secondary: '#4A4A4A', tertiary: '#8A8A8A', disabled: '#B8B8B8' },
            line: { DEFAULT: '#D4D4D4', soft: '#EBEBEB' },
            page: '#EDEDED',
            fill: '#F7F7F7',
            brand: { black: '#0A0A0A', red: '#C8102E', gray: '#6B6B6B', white: '#FFFFFF' },
          },
          fontFamily: { sans: ['"PingFang SC"', '"Microsoft YaHei"', 'system-ui', 'sans-serif'] },
          boxShadow: { card: '0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06)' },
        },
      },
    };
  </script>
  <style>
    [x-cloak] { display: none !important; }
    .sidebar-scroll::-webkit-scrollbar { width: 4px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
    .table-wrap { overflow-x: auto; }
    .skeleton { background: linear-gradient(90deg, #ececec 25%, #e0e0e0 50%, #ececec 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .toast-enter { animation: toastIn .25s ease; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
    .step-line { height: 2px; background: #d4d4d4; flex: 1; }
    .step-line.done { background: #C8102E; }
    .brand-stripe { background: linear-gradient(90deg, #0A0A0A 0%, #0A0A0A 72%, #C8102E 72%, #C8102E 100%); }
  
    /* §2.2 已打开页面 Tab */
    .open-tab {
      display: inline-flex; align-items: center; gap: 6px; max-width: 160px;
      padding: 6px 10px; font-size: 13px; border-radius: 4px;
      color: rgba(255,255,255,.72); white-space: nowrap; transition: all .15s;
      border-bottom: 2px solid transparent; background: transparent; border-left: 0; border-right: 0; border-top: 0;
    }
    .open-tab:hover { color: #fff; background: rgba(255,255,255,.08); }
    .open-tab.active { color: #fff; font-weight: 600; border-bottom-color: #C8102E; background: rgba(200,16,46,.18); }
    .open-tab .tab-close { opacity: .55; font-size: 12px; line-height: 1; padding: 2px 4px; border-radius: 3px; }
    .open-tab .tab-close:hover { opacity: 1; background: rgba(255,255,255,.15); }


    /* App shell: header+sidebar fixed; only main scrolls */
    html, body { height: 100%; overflow: hidden; }
    .zippo-shell { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .zippo-shell > header.sticky,
    .zippo-shell > header.global-topbar,
    body > header.sticky,
    body > header.global-topbar { flex: 0 0 auto; position: sticky; top: 0; z-index: 50; }
    .zippo-body {
      flex: 1 1 auto; min-height: 0; display: flex; overflow: hidden;
    }
    .zippo-body > aside,
    .zippo-body > .sidebar {
      flex: 0 0 auto; height: 100%; overflow-y: auto; position: relative !important;
      top: auto !important; inset: auto !important;
    }
    .zippo-main {
      flex: 1 1 auto; min-width: 0; min-height: 0; overflow-y: auto;
      background: #EDEDED;
    }


    /* body 纵向壳：顶栏固定，下方 zippo-body 占满剩余高度 */
    body.overflow-hidden, body.zippo-fixed, body.d06-shell {
      display: flex !important; flex-direction: column !important; height: 100vh !important; margin: 0;
    }
    body > header, body > .brand-stripe, body > .h-1.brand-stripe, body > div.h-1 {
      flex: 0 0 auto !important;
    }
    .zippo-body { flex: 1 1 auto !important; min-height: 0 !important; height: auto !important; }
    main.zippo-main, .zippo-main {
      flex: 1 1 auto !important; min-width: 0 !important; min-height: 0 !important;
      overflow-y: auto !important;
    }


/* Spec §2.2 white sidebar override */
.proto-sidebar, aside.sidebar, aside.primary-nav, .module-sidebar, .d-sidebar {
  background: #0A0A0A !important; color: #cfcfcf !important;
  border-right: 0 !important;
}
.proto-nav-item.active, .nav button.active, .nav-item.active, .side-nav a.active, .menu-item.active {
  background: #2d2d2d !important; color: #fff !important; font-weight: 600;
  border-left: 3px solid #C8102E !important;
}



/* ZIPPO_NAV_HIERARCHY_V3 */
details.nav-group { margin: 0 0 6px; border: 0; }
details.nav-group > summary.nav-l1 {
  list-style: none; cursor: pointer; user-select: none;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  min-height: 40px; padding: 0 12px; margin: 0; border-radius: 4px;
  font-size: 13px !important; font-weight: 600 !important; line-height: 1.2;
  color: #FFFFFF !important; letter-spacing: 0 !important; text-transform: none !important;
  background: transparent;
}
details.nav-group > summary.nav-l1::-webkit-details-marker { display: none; }
details.nav-group > summary.nav-l1 .nav-chev {
  font-size: 10px; color: rgba(255,255,255,.7); transition: transform .15s;
}
details.nav-group:not([open]) > summary.nav-l1 .nav-chev { transform: rotate(-90deg); }
details.nav-group > summary.nav-l1:hover { background: #2d2d2d; }
.nav-l2-wrap { display: flex; flex-direction: column; gap: 2px; padding: 2px 0 6px; }
.nav-l2-wrap .proto-nav-item,
.nav-l2-wrap > button,
.nav-l2-wrap .nav-item,
aside .nav-l2-wrap button {
  font-size: 13px !important;
  color: #E8E8E8 !important;
  min-height: 40px;
}
/* dark sidebar contrast: kill low-contrast tertiary / selected white block */
aside.proto-sidebar, aside.sidebar, aside.module-sidebar, .proto-sidebar {
  color: #E8E8E8 !important;
}
aside.proto-sidebar .text-ink-secondary,
aside.proto-sidebar .text-ink-tertiary,
aside.proto-sidebar .text-ink,
aside .nav-label {
  color: #E8E8E8 !important;
}
aside.proto-sidebar button.text-ink-secondary,
aside.proto-sidebar a.text-ink-secondary {
  color: #E8E8E8 !important;
}
aside.proto-sidebar .bg-\[\#F5F5F5\],
aside.proto-sidebar button.bg-\[\#F5F5F5\] {
  background: #2d2d2d !important;
  color: #FFFFFF !important;
}
aside.proto-sidebar .hover\:bg-fill:hover,
aside.proto-sidebar button:hover {
  background: #2d2d2d !important;
  color: #FFFFFF !important;
}
/* L1 labels that are not yet details */
.nav-label, .proto-nav-group, .proto-sidebar-title {
  font-size: 13px !important;
  font-weight: 600 !important;
  color: #FFFFFF !important;
  letter-spacing: 0 !important;
  text-transform: none !important;
}
.proto-nav-item, .nav button, aside .nav button {
  color: #E8E8E8 !important;
  font-size: 13px !important;
}
.proto-nav-item.active, .nav button.active {
  color: #FFFFFF !important;
}
/* hide sidebar bottom notes / brand footnotes */
.sidebar-note, .sidebar-foot, .sidebar-footer,
aside .zippo-sidebar-note,
aside nav > .mt-6.px-3.py-3.rounded-lg {
  display: none !important;
}

/* ZIPPO_NAV_SPACING_V2 */
.nav, .proto-sidebar-nav, aside .nav, .sidebar .nav {
  gap: 4px !important;
}
.proto-nav-item, .nav button, .nav-item, .side-nav a, .menu-item {
  min-height: 40px !important;
  height: auto !important;
  max-height: none !important;
  padding-top: 8px !important;
  padding-bottom: 8px !important;
  box-sizing: border-box !important;
  flex-shrink: 0 !important;
}
.nav-label, .proto-sidebar-title .label {
  padding-top: 10px !important;
  padding-bottom: 4px !important;
}

/* ZIPPO_GLOBAL_SHELL_V2 */
.card.has-table { display:flex; flex-direction:column; min-height:0; }
.card.has-table > .table-wrap { flex:1 1 auto; min-height:0; overflow:auto; }
.card > .pager, .card > .pager.pagination, .pager.zippo-pager-sticky {
  position:sticky; bottom:0; z-index:5; flex-shrink:0;
  background:#fff; border-top:1px solid #EBEBEB; margin-top:0;
  box-shadow:0 -4px 12px rgba(0,0,0,.04);
}
.sidebar-foot, .sidebar-footer { display:none !important; }
.zippo-user-menu { position:relative; display:inline-flex; }
.zippo-user-menu-panel {
  display:none; position:absolute; right:0; top:calc(100% + 6px); min-width:128px;
  background:#fff; color:#0A0A0A; border:1px solid #EBEBEB; border-radius:6px;
  box-shadow:0 8px 24px rgba(0,0,0,.12); padding:4px; z-index:80;
}
.zippo-user-menu.open .zippo-user-menu-panel { display:block; }
.zippo-user-menu-panel button {
  display:block; width:100%; text-align:left; border:0; background:transparent;
  padding:8px 10px; font-size:13px; border-radius:4px; cursor:pointer; color:#0A0A0A;
}
.zippo-user-menu-panel button:hover { background:#F5F5F5; }

</style>
</head>
<body class="bg-page text-ink font-sans antialiased overflow-hidden" x-data="approvalApp()" x-init="_padTasks()" x-cloak>
  <!-- Top bar -->
  <header class="sticky top-0 z-40 h-14 bg-brand-black text-white border-b border-black flex items-center px-4 lg:px-6 gap-3">
    <div class="flex items-center gap-3">
      <button @click="mobileNav = !mobileNav" class="lg:hidden p-2 rounded hover:bg-white/10 text-white" aria-label="菜单">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="flex items-center gap-2">
        <div>
          <div class="text-base font-bold tracking-wider">ZIPPO</div>
        </div>
      </div>
    </div>
    
      <nav class="flex items-center gap-0.5 overflow-x-auto flex-1 min-w-0 py-1 mx-2" aria-label="已打开页面">
        <template x-for="t in openTabs" :key="t.id">
          <button type="button" @click="activateTab(t.id)" class="open-tab" :class="activeTabId===t.id ? 'active' : ''" :title="t.label">
            <span class="truncate" x-text="t.label"></span>
            <span class="tab-close" @click.stop="closeTab(t.id)" title="关闭">✕</span>
          </button>
        </template>
      </nav>
<div class="flex items-center gap-3">
      <div class="hidden sm:flex items-center gap-2 text-xs text-white/70">
        <span>当前角色</span>
        <select x-model="role" @change="onRoleChange()" class="border border-white/20 rounded-md px-2 py-1.5 text-sm bg-black text-white focus:outline-none focus:ring-2 focus:ring-primary/50" title="对齐 D12：仅当前活跃角色生效，待办按组织+角色匹配（非并集）">
          <option value="BRAND_HQ">品牌管理员</option>
          <option value="BRAND_OPERATOR">品牌业务</option>
          <option value="PLATFORM_ADMIN">平台管理员</option>
          <option value="DISTRIBUTOR">经销商</option>
        </select>
      </div>
      <button type="button" @click="toast('通知')" class="relative w-8 h-8 flex items-center justify-center rounded hover:bg-white/10 text-white/70" aria-label="通知"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg><span class="absolute top-1 right-1 w-2 h-2 bg-primary rounded-full"></span></button>
      <div class="flex items-center gap-2 pl-2 border-l border-white/15">
        <div class="w-8 h-8 rounded-full bg-primary text-white text-xs font-semibold flex items-center justify-center" x-text="currentUser.avatar"></div>
      </div>
    </div>
  </header>
  <div class="h-1 brand-stripe"></div>

  <div class="zippo-body">
    <!-- Sidebar -->
    <aside
      class="proto-sidebar fixed lg:static inset-y-[3.75rem] left-0 z-30 w-56 bg-white text-ink border-r border-line-soft transform transition-transform lg:translate-x-0"
      :class="mobileNav ? 'translate-x-0' : '-translate-x-full'"
    >
      <nav class="p-3 space-y-1 sidebar-scroll overflow-y-auto h-full">
        <details class="nav-group" open><summary class="nav-l1">审批中心<span class="nav-chev">▾</span></summary><div class="nav-l2-wrap"><template x-for="item in menus" :key="item.id">
          <button
            x-show="item.visible()"
            @click="go(item.id); mobileNav=false"
            class="w-full flex items-center gap-2 px-3 py-2.5 rounded-md text-sm transition"
            :class="page===item.id ? 'bg-[#2d2d2d] text-white font-medium border-l-[3px] border-l-primary' : 'text-[#E8E8E8] hover:bg-[#2d2d2d] hover:text-white'"
          >
            <span x-html="item.icon"></span>
            <span x-text="item.label"></span>
            <span x-show="item.badge" class="ml-auto text-[10px] px-1.5 py-0.5 rounded-full bg-white text-primary font-semibold" x-text="item.badge()"></span>
          </button>
        </template>
</div></details></nav>
    </aside>
    <div x-show="mobileNav" @click="mobileNav=false" class="fixed inset-0 z-20 bg-black/40 lg:hidden"></div>

    <!-- Main -->
    <main class="zippo-main flex-1 min-w-0 p-4 lg:p-6">
      <!-- Breadcrumb -->
      <div class="mb-4 flex items-center justify-between gap-3 flex-wrap">
        <div class="text-sm text-ink-tertiary">
          首页 / 审批中心 / <span class="text-ink" x-text="pageTitle"></span>
        </div>
        <button @click="refreshList()" class="text-xs text-primary hover:underline" x-show="['todo','mine','query'].includes(page)">列表状态刷新</button>
      </div>

      <!-- ===== 我的审批 ===== -->
      <section x-show="page==='todo'" class="space-y-4">
        <div class="bg-white rounded-lg shadow-card border border-line-soft">
          <div class="px-5 pt-4 flex items-center justify-between border-b border-line-soft">
            <div class="flex gap-6">
              <button @click="todoTab='pending'" class="pb-3 text-sm relative" :class="todoTab==='pending'?'text-primary font-semibold':'text-ink-secondary'">
                待办
                <span class="ml-1 text-xs text-ink-tertiary" x-text="'('+pendingCount+')'"></span>
                <span x-show="todoTab==='pending'" class="absolute left-0 right-0 -bottom-px h-0.5 bg-primary"></span>
              </button>
              <button @click="todoTab='done'" class="pb-3 text-sm relative" :class="todoTab==='done'?'text-primary font-semibold':'text-ink-secondary'">
                已办
                <span x-show="todoTab==='done'" class="absolute left-0 right-0 -bottom-px h-0.5 bg-primary"></span>
              </button>
            </div>
          </div>
          <div class="p-4 flex flex-wrap gap-3 items-end border-b border-line-soft bg-fill/50">
            <label class="text-xs text-ink-secondary space-y-1">
              <span>审批类型</span>
              <select x-model="filters.todo.type" class="block w-40 border border-line rounded-md px-2 py-1.5 text-sm bg-white">
                <option value="">全部</option>
                <template x-for="t in typeOptions" :key="t"><option :value="t" x-text="t"></option></template>
              </select>
            </label>
            <label class="text-xs text-ink-secondary space-y-1">
              <span>关键词</span>
              <input x-model="filters.todo.keyword" type="text" placeholder="标题 / 业务编码" class="block w-52 border border-line rounded-md px-2 py-1.5 text-sm" />
            </label>
            <button @click="loading=true; setTimeout(()=>loading=false, 400)" class="px-3 py-1.5 text-sm rounded-md bg-primary text-white hover:bg-primary-hover">搜索</button>
            <button @click="filters.todo={type:'',keyword:''}" class="px-3 py-1.5 text-sm rounded-md border border-line hover:bg-fill">重置</button>
          </div>
          <div class="table-wrap">
            <template x-if="loading">
              <div class="p-6 space-y-3">
                <div class="h-10 skeleton rounded"></div>
                <div class="h-10 skeleton rounded"></div>
                <div class="h-10 skeleton rounded"></div>
              </div>
            </template>
            <template x-if="!loading">
              <div>
                <template x-if="filteredTodos.length===0">
                  <div class="py-16 text-center text-ink-tertiary text-sm" x-text="todoTab==='pending'?'暂无待办':'暂无已办记录'"></div>
                </template>
                <table x-show="filteredTodos.length" class="w-full text-sm">
                  <thead class="bg-fill text-ink-secondary text-xs">
                    <tr>
                      <th class="text-left font-medium px-4 py-3">类型</th>
                      <th class="text-left font-medium px-4 py-3">单据标题</th>
                      <th class="text-left font-medium px-4 py-3">业务编码</th>
                      <th class="text-left font-medium px-4 py-3">发起人</th>
                      <th class="text-left font-medium px-4 py-3">发起时间</th>
                      <th class="text-left font-medium px-4 py-3">当前节点</th>
                      <th class="text-left font-medium px-4 py-3">停留</th>
                      <th class="text-left font-medium px-4 py-3">操作</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="row in pagedTodos" :key="row.id">
                      <tr class="border-t border-line-soft hover:bg-primary-bg/40">
                        <td class="px-4 py-3"><span class="text-xs px-2 py-0.5 rounded bg-fill text-ink-secondary border border-line" x-text="row.type"></span></td>
                        <td class="px-4 py-3 font-medium" x-text="row.title"></td>
                        <td class="px-4 py-3 text-ink-secondary" x-text="row.bizCode"></td>
                        <td class="px-4 py-3" x-text="row.submitter"></td>
                        <td class="px-4 py-3 text-ink-secondary" x-text="row.submittedAt"></td>
                        <td class="px-4 py-3" x-text="row.node"></td>
                        <td class="px-4 py-3 text-warning" x-text="row.stay"></td>
                        <td class="px-4 py-3 space-x-2 whitespace-nowrap">
                          <button @click="openBiz(row)" class="text-primary hover:underline" x-text="todoTab==='pending'?'去处理':'查看'"></button>
                          <button @click="openFlow(row.instanceId)" class="text-ink-secondary hover:text-primary">流程</button>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>
          </div>
          <div class="px-4 py-3 border-t border-line-soft flex items-center justify-between text-xs text-ink-tertiary">
            <span>共 <span x-text="filteredTodos.length"></span> 条 · 每页
              <select x-model.number="pageSize" class="border border-line rounded px-2 py-1 text-xs bg-white mx-1">
                <option :value="20">20条/页</option><option :value="50">50条/页</option><option :value="100">100条/页</option>
              </select>
              条</span>
            <div class="flex gap-2">
              <button @click="todoPage=Math.max(1,todoPage-1)" class="px-2 py-1 border border-line rounded hover:bg-fill" :disabled="todoPage<=1">上一页</button>
              <span class="px-2 py-1" x-text="todoPage + ' / ' + Math.max(1, Math.ceil(filteredTodos.length/pageSize))"></span>
              <button @click="todoPage=Math.min(Math.ceil(filteredTodos.length/pageSize)||1, todoPage+1)" class="px-2 py-1 border border-line rounded hover:bg-fill">下一页</button>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== 我发起的 ===== -->
      <section x-show="page==='mine'" class="space-y-4">
        <div class="bg-white rounded-lg shadow-card border border-line-soft">
          <div class="p-4 flex flex-wrap gap-3 items-end border-b border-line-soft bg-fill/50">
            <label class="text-xs text-ink-secondary space-y-1">
              <span>审批状态</span>
              <select x-model="filters.mine.status" class="block w-36 border border-line rounded-md px-2 py-1.5 text-sm bg-white">
                <option value="">全部</option>
                <option>审批中</option>
                <option>已通过</option>
                <option>已驳回</option>
                <option>已撤销</option>
              </select>
            </label>
            <label class="text-xs text-ink-secondary space-y-1">
              <span>关键词</span>
              <input x-model="filters.mine.keyword" type="text" placeholder="标题 / 编码" class="block w-52 border border-line rounded-md px-2 py-1.5 text-sm" />
            </label>
            <button @click="toast('已按条件筛选')" class="px-3 py-1.5 text-sm rounded-md bg-primary text-white hover:bg-primary-hover">搜索</button>
          </div>
          <div class="table-wrap">
            <template x-if="filteredMine.length===0">
              <div class="py-16 text-center text-ink-tertiary text-sm">暂无我发起的申请</div>
            </template>
            <table x-show="filteredMine.length" class="w-full text-sm">
              <thead class="bg-fill text-ink-secondary text-xs">
                <tr>
                  <th class="text-left font-medium px-4 py-3">类型</th>
                  <th class="text-left font-medium px-4 py-3">标题</th>
                  <th class="text-left font-medium px-4 py-3">编码</th>
                  <th class="text-left font-medium px-4 py-3">提交时间</th>
                  <th class="text-left font-medium px-4 py-3">状态</th>
                  <th class="text-left font-medium px-4 py-3">当前节点</th>
                  <th class="text-left font-medium px-4 py-3">最近意见</th>
                  <th class="text-left font-medium px-4 py-3">操作</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="row in filteredMine" :key="row.id">
                  <tr class="border-t border-line-soft hover:bg-primary-bg/40">
                    <td class="px-4 py-3 text-xs" x-text="row.type"></td>
                    <td class="px-4 py-3 font-medium" x-text="row.title"></td>
                    <td class="px-4 py-3 text-ink-secondary" x-text="row.bizCode"></td>
                    <td class="px-4 py-3 text-ink-secondary" x-text="row.submittedAt"></td>
                    <td class="px-4 py-3"><span class="text-xs px-2 py-0.5 rounded" :class="statusClass(row.status)" x-text="row.status"></span></td>
                    <td class="px-4 py-3" x-text="row.node || '—'"></td>
                    <td class="px-4 py-3 text-ink-tertiary max-w-[140px] truncate" x-text="row.latestComment || '—'"></td>
                    <td class="px-4 py-3 space-x-2 whitespace-nowrap">
                      <button @click="openBiz(row, true)" class="text-primary hover:underline">查看</button>
                      <button @click="openFlow(row.id)" class="text-ink-secondary hover:text-primary">流程</button>
                      <button x-show="row.status==='审批中'" @click="openWithdraw(row)" class="text-warning hover:underline">撤回</button>
                      <button x-show="row.status==='已驳回' || row.status==='已撤销'" @click="toast('已跳转业务编辑页（原型模拟）')" class="text-primary hover:underline">去修改</button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- ===== 审批单查询 ===== -->
      <section x-show="page==='query'" class="space-y-4">
        <div x-show="!canQuery" class="bg-white rounded-lg border border-line-soft p-10 text-center">
          <div class="text-ink-secondary font-medium mb-1">无权限</div>
          <div class="text-sm text-ink-tertiary">审批单查询仅开放给平台管理员 / 品牌管理员。请切换当前角色体验（待办按组织+当前角色匹配）。</div>
        </div>
        <div x-show="canQuery" class="bg-white rounded-lg shadow-card border border-line-soft">
          <div class="px-5 py-4 border-b border-line-soft">
            <h1 class="text-base font-semibold">审批单查询</h1>
            <p class="text-xs text-ink-tertiary mt-1" x-text="role==='PLATFORM_ADMIN' ? '数据范围：全平台' : '数据范围：本组织'"></p>
          </div>
          <div class="p-4 flex flex-wrap gap-3 items-end border-b border-line-soft bg-fill/50">
            <label class="text-xs text-ink-secondary space-y-1"><span>业务编码</span><input x-model="filters.query.bizCode" class="block w-36 border border-line rounded-md px-2 py-1.5 text-sm" /></label>
            <label class="text-xs text-ink-secondary space-y-1"><span>发起人</span><input x-model="filters.query.submitter" class="block w-32 border border-line rounded-md px-2 py-1.5 text-sm" /></label>
            <label class="text-xs text-ink-secondary space-y-1">
              <span>审批类型</span>
              <select x-model="filters.query.type" class="block w-36 border border-line rounded-md px-2 py-1.5 text-sm bg-white">
                <option value="">全部</option>
                <template x-for="t in typeOptions" :key="t"><option :value="t" x-text="t"></option></template>
              </select>
            </label>
            <label class="text-xs text-ink-secondary space-y-1">
              <span>状态</span>
              <select x-model="filters.query.status" class="block w-28 border border-line rounded-md px-2 py-1.5 text-sm bg-white">
                <option value="">全部</option>
                <option>审批中</option>
                <option>已通过</option>
                <option>已驳回</option>
                <option>已撤销</option>
              </select>
            </label>
            <button @click="queryLoading=true; setTimeout(()=>{queryLoading=false; toast('查询完成')}, 500)" class="px-3 py-1.5 text-sm rounded-md bg-primary text-white hover:bg-primary-hover">查询</button>
          </div>
          <div class="table-wrap">
            <template x-if="queryLoading"><div class="p-6"><div class="h-24 skeleton rounded"></div></div></template>
            <template x-if="!queryLoading && filteredQuery.length===0">
              <div class="py-16 text-center text-sm text-ink-tertiary">未找到符合条件的审批单</div>
            </template>
            <table x-show="!queryLoading && filteredQuery.length" class="w-full text-sm">
              <thead class="bg-fill text-ink-secondary text-xs">
                <tr>
                  <th class="text-left font-medium px-4 py-3">类型</th>
                  <th class="text-left font-medium px-4 py-3">标题</th>
                  <th class="text-left font-medium px-4 py-3">编码</th>
                  <th class="text-left font-medium px-4 py-3">发起人</th>
                  <th class="text-left font-medium px-4 py-3">组织</th>
                  <th class="text-left font-medium px-4 py-3">状态</th>
                  <th class="text-left font-medium px-4 py-3">当前节点</th>
                  <th class="text-left font-medium px-4 py-3">提交时间</th>
                  <th class="text-left font-medium px-4 py-3">操作</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="row in filteredQuery" :key="row.id">
                  <tr class="border-t border-line-soft hover:bg-primary-bg/40">
                    <td class="px-4 py-3 text-xs" x-text="row.type"></td>
                    <td class="px-4 py-3 font-medium" x-text="row.title"></td>
                    <td class="px-4 py-3" x-text="row.bizCode"></td>
                    <td class="px-4 py-3" x-text="row.submitter"></td>
                    <td class="px-4 py-3" x-text="row.org"></td>
                    <td class="px-4 py-3"><span class="text-xs px-2 py-0.5 rounded" :class="statusClass(row.status)" x-text="row.status"></span></td>
                    <td class="px-4 py-3" x-text="row.node || '—'"></td>
                    <td class="px-4 py-3 text-ink-secondary" x-text="row.submittedAt"></td>
                    <td class="px-4 py-3"><button @click="openFlow(row.id); toast('已记录查询打开审计（原型）')" class="text-primary hover:underline">流程</button></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- ===== 审核流程 ===== -->
      <section x-show="page==='flow'" class="space-y-4">
        <template x-if="!currentInstance">
          <div class="bg-white rounded-lg p-10 text-center text-sm text-ink-tertiary">请从列表选择单据打开审核流程</div>
        </template>
        <template x-if="currentInstance">
          <div class="bg-white rounded-lg shadow-card border border-line-soft">
            <div class="px-5 py-4 border-b border-line-soft flex flex-wrap items-start justify-between gap-3">
              <div>
                <h1 class="text-base font-semibold">审核流程 · <span x-text="currentInstance.title"></span>
                  <span class="text-ink-tertiary font-normal text-sm" x-text="currentInstance.bizCode"></span>
                </h1>
                <div class="mt-2 flex flex-wrap gap-3 text-xs text-ink-secondary">
                  <span>状态：<span class="px-2 py-0.5 rounded" :class="statusClass(currentInstance.status)" x-text="currentInstance.status"></span></span>
                  <span>发起人：<span x-text="currentInstance.submitter"></span></span>
                  <span>类型：<span x-text="currentInstance.type"></span></span>
                </div>
              </div>
              <div class="flex gap-2">
                <button x-show="canForceReject && currentInstance.status==='审批中'" @click="forceOpen=true; forceComment=''" class="px-3 py-1.5 text-sm rounded-md border border-danger text-danger hover:bg-danger-bg">强制驳回</button>
                <button @click="go(flowBack)" class="px-3 py-1.5 text-sm rounded-md border border-line hover:bg-fill">返回</button>
              </div>
            </div>
            <!-- Steps -->
            <div class="px-5 py-6">
              <div class="flex items-center gap-2 overflow-x-auto pb-2">
                <template x-for="(n, i) in currentInstance.nodes" :key="n.key">
                  <div class="flex items-center gap-2 min-w-0">
                    <div class="flex flex-col items-center gap-1 min-w-[88px]">
                      <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold"
                        :class="n.state==='done' ? 'bg-primary text-white' : n.state==='current' ? 'bg-primary-bg text-primary ring-2 ring-primary' : 'bg-fill text-ink-disabled border border-line'">
                        <span x-show="n.state==='done'">✓</span>
                        <span x-show="n.state!=='done'" x-text="i+1"></span>
                      </div>
                      <div class="text-xs text-center" :class="n.state==='current'?'text-primary font-medium':'text-ink-secondary'" x-text="n.name"></div>
                      <div class="text-[10px] text-ink-tertiary" x-text="n.state==='done'?'已完成':n.state==='current'?'进行中':'未到达'"></div>
                    </div>
                    <div x-show="i < currentInstance.nodes.length-1" class="step-line w-10" :class="n.state==='done'?'done':''"></div>
                  </div>
                </template>
              </div>
              <div class="mt-4 text-xs text-ink-tertiary" x-text="'节点耗时：' + currentInstance.durationText"></div>
            </div>
            <div class="px-5 pb-5">
              <h2 class="text-sm font-semibold mb-3">操作历史</h2>
              <div class="border border-line-soft rounded-lg overflow-hidden">
                <table class="w-full text-sm">
                  <thead class="bg-fill text-xs text-ink-secondary">
                    <tr>
                      <th class="text-left font-medium px-3 py-2">时间</th>
                      <th class="text-left font-medium px-3 py-2">节点</th>
                      <th class="text-left font-medium px-3 py-2">操作人</th>
                      <th class="text-left font-medium px-3 py-2">动作</th>
                      <th class="text-left font-medium px-3 py-2">意见</th>
                      <th class="text-left font-medium px-3 py-2">字段修改</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="h in currentInstance.history" :key="h.time+h.action">
                      <tr class="border-t border-line-soft">
                        <td class="px-3 py-2 text-ink-secondary whitespace-nowrap" x-text="h.time"></td>
                        <td class="px-3 py-2" x-text="h.node"></td>
                        <td class="px-3 py-2" x-text="h.operator"></td>
                        <td class="px-3 py-2"><span class="text-xs px-2 py-0.5 rounded" :class="actionClass(h.action)" x-text="h.action"></span></td>
                        <td class="px-3 py-2" x-text="h.comment || '—'"></td>
                        <td class="px-3 py-2 text-ink-tertiary" x-text="h.fieldSummary || '—'"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </template>
      </section>

      <!-- ===== 业务页审批视图 ===== -->
      <section x-show="page==='biz'" class="space-y-4">
        <template x-if="bizDoc">
          <div class="bg-white rounded-lg shadow-card border border-line-soft overflow-hidden">
            <div class="px-5 py-4 border-b border-line-soft flex flex-wrap items-center justify-between gap-3 sticky top-14 bg-white z-10">
              <div>
                <div class="text-xs text-ink-tertiary mb-1">原业务页审批视图 · 非 OA 重建表单</div>
                <h1 class="text-base font-semibold flex items-center gap-2">
                  <span x-text="bizDoc.pageTitle"></span>
                  <span class="text-xs px-2 py-0.5 rounded" :class="statusClass(bizDoc.status)" x-text="bizDoc.status"></span>
                </h1>
              </div>
              <button @click="go('todo')" class="text-sm text-ink-secondary hover:text-primary">← 返回我的审批</button>
            </div>
            <div class="p-5 grid lg:grid-cols-3 gap-5">
              <div class="lg:col-span-2 space-y-4">
                <div class="rounded-lg border border-warning bg-warning-bg px-4 py-3 text-sm text-warning" x-show="bizDoc.status==='审批中'">
                  单据审批中，仅可编辑授权字段（节点白名单）。本期无加签、转交。
                </div>
                <div class="rounded-lg border border-line-soft p-4 space-y-4">
                  <h2 class="text-sm font-semibold">业务信息</h2>
                  <div class="grid sm:grid-cols-2 gap-4 text-sm">
                    <template x-for="f in bizDoc.fields" :key="f.key">
                      <label class="space-y-1">
                        <div class="text-xs text-ink-secondary flex items-center gap-1">
                          <span x-text="f.label"></span>
                          <span x-show="f.editable && !bizDoc.requireReview" class="text-[10px] text-primary bg-primary-bg px-1 rounded">可编辑</span>
                          <span x-show="bizDoc.requireReview" class="text-[10px] text-ink-tertiary">上推须审只读</span>
                        </div>
                        <input
                          type="text"
                          x-model="f.value"
                          :disabled="!f.editable || bizDoc.requireReview || bizDoc.status!=='审批中' || !bizDoc.isAssignee"
                          class="w-full border rounded-md px-3 py-2 text-sm disabled:bg-fill disabled:text-ink-disabled"
                          :class="f.editable && !bizDoc.requireReview && bizDoc.isAssignee ? 'border-primary focus:ring-2 focus:ring-primary/30' : 'border-line'"
                        />
                      </label>
                    </template>
                  </div>
                </div>
              </div>
              <div class="space-y-4">
                <div class="rounded-lg border border-line-soft p-4 text-sm space-y-2">
                  <div class="font-semibold text-sm">审批上下文</div>
                  <div class="text-xs text-ink-secondary">类型：<span class="text-ink" x-text="bizDoc.type"></span></div>
                  <div class="text-xs text-ink-secondary">编码：<span class="text-ink" x-text="bizDoc.bizCode"></span></div>
                  <div class="text-xs text-ink-secondary">当前节点：<span class="text-ink" x-text="bizDoc.node"></span></div>
                  <div class="text-xs text-ink-secondary">处理人：<span class="text-ink" x-text="bizDoc.assignee"></span></div>
                </div>
                <!-- 变更类：本次修改对照 -->
                <div class="rounded-lg border border-line-soft p-4 text-sm space-y-3" x-show="bizDoc.isChangeFlow">
                  <div class="flex items-center justify-between gap-2">
                    <div class="font-semibold text-sm">本次修改对照</div>
                    <span class="text-[10px] text-ink-tertiary">变更流程</span>
                  </div>
                  <p class="text-[11px] text-ink-tertiary leading-relaxed">展示本单改过的字段：从什么 → 到什么，以及哪个节点操作。</p>
                  <template x-if="!bizDoc.changeDiffs || bizDoc.changeDiffs.length === 0">
                    <div class="text-xs text-ink-tertiary py-2">暂无字段变更记录</div>
                  </template>
                  <ul class="space-y-2.5" x-show="bizDoc.changeDiffs && bizDoc.changeDiffs.length">
                    <template x-for="(d, idx) in bizDoc.changeDiffs" :key="idx">
                      <li class="rounded-md bg-fill border border-line-soft px-3 py-2.5 space-y-1">
                        <div class="text-xs font-medium text-ink" x-text="d.fieldName"></div>
                        <div class="text-xs text-ink-secondary flex flex-wrap items-center gap-1">
                          <span class="line-through text-ink-tertiary" x-text="d.beforeValue || '（空）'"></span>
                          <span class="text-ink-tertiary">→</span>
                          <span class="text-primary font-medium" x-text="d.afterValue || '（空）'"></span>
                        </div>
                        <div class="text-[11px] text-ink-tertiary">
                          节点：<span class="text-ink-secondary" x-text="d.nodeName"></span>
                          <span x-show="d.operatorName"> · <span x-text="d.operatorName"></span></span>
                        </div>
                      </li>
                    </template>
                  </ul>
                </div>
                <div class="rounded-lg border border-dashed border-line-soft p-4 text-xs text-ink-tertiary" x-show="!bizDoc.isChangeFlow">
                  新建类流程：按业务字段审阅即可，无需修改对照。
                </div>
              </div>
            </div>
            <!-- Approval action bar -->
            <div class="border-t border-line-soft bg-fill px-5 py-4 sticky bottom-0" x-show="bizDoc.isAssignee && bizDoc.status==='审批中'">
              <div class="max-w-4xl space-y-3">
                <label class="block text-xs text-ink-secondary space-y-1">
                  <span>审批意见</span>
                  <textarea x-model="approveComment" rows="2" placeholder="可选填写同意意见；驳回时必填" class="w-full border border-line rounded-md px-3 py-2 text-sm"></textarea>
                </label>
                <div class="flex flex-wrap gap-2 justify-end">
                  <button @click="openFlow(bizDoc.instanceId); flowBack='biz'" class="px-4 py-2 text-sm rounded-md border border-line hover:bg-white">查看流程</button>
                  <button @click="openReject()" class="px-4 py-2 text-sm rounded-md border border-danger text-danger hover:bg-danger-bg">驳回</button>
                  <button @click="doApprove()" :disabled="actionLoading" class="px-4 py-2 text-sm rounded-md bg-primary text-white hover:bg-primary-hover disabled:opacity-60">
                    <span x-show="!actionLoading">同意</span>
                    <span x-show="actionLoading">处理中…</span>
                  </button>
                </div>
              </div>
            </div>
            <div class="border-t border-line-soft px-5 py-4 text-sm text-ink-tertiary" x-show="!bizDoc.isAssignee || bizDoc.status!=='审批中'">
              当前账号非本节点待办人，或单据已结束，仅可查看。
            </div>
          </div>
        </template>
      </section>

      <!-- ===== 闸门演示 ===== -->
      <section x-show="page==='gate'" class="space-y-4 max-w-xl">
        <div class="bg-white rounded-lg shadow-card border border-line-soft p-5 space-y-4">
          <h1 class="text-base font-semibold">提交闸门演示（Q9）</h1>
          <p class="text-sm text-ink-secondary">模拟业务域提交：类型启停 + 组织是否具备审批中心菜单。</p>
          <label class="block text-xs space-y-1">
            <span class="text-ink-secondary">审批类型启停</span>
            <select x-model="gate.typeEnabled" class="w-full border border-line rounded-md px-3 py-2 text-sm">
              <option value="ENABLED">已启用</option>
              <option value="DISABLED">未启用（免审）</option>
            </select>
          </label>
          <label class="flex items-center gap-2 text-sm">
            <input type="checkbox" x-model="gate.hasMenu" class="rounded border-line text-primary" />
            组织具备审批中心菜单
          </label>
          <button @click="runGate()" class="px-4 py-2 text-sm rounded-md bg-primary text-white hover:bg-primary-hover">模拟提交</button>
          <div x-show="gate.result" class="rounded-md border px-3 py-3 text-sm" :class="gate.ok ? 'border-success bg-success-bg text-success' : 'border-danger bg-danger-bg text-danger'" x-text="gate.result"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- Modal: Reject -->
  <div x-show="rejectOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4" x-cloak>
    <div class="absolute inset-0 bg-black/45" @click="rejectOpen=false"></div>
    <div class="relative bg-white rounded-lg shadow-xl w-full max-w-md p-5 space-y-4">
      <h3 class="text-base font-semibold">驳回</h3>
      <div class="space-y-2 text-sm">
        <label class="flex items-center gap-2"><input type="radio" value="TO_SUBMITTER" x-model="rejectMode" /> 驳回至发起人</label>
        <label class="flex items-center gap-2"><input type="radio" value="TO_NODE" x-model="rejectMode" /> 驳回到指定节点</label>
      </div>
      <label x-show="rejectMode==='TO_NODE'" class="block text-xs space-y-1">
        <span class="text-ink-secondary">目标节点</span>
        <select x-model="rejectNode" class="w-full border border-line rounded-md px-3 py-2 text-sm">
          <option value="">请选择</option>
          <option value="部门复核">部门复核</option>
          <option value="财务复核">财务复核</option>
        </select>
      </label>
      <label class="block text-xs space-y-1">
        <span class="text-ink-secondary">审批意见（必填）</span>
        <textarea x-model="rejectComment" rows="3" class="w-full border border-line rounded-md px-3 py-2 text-sm" placeholder="请说明驳回原因"></textarea>
        <span x-show="rejectError" class="text-danger" x-text="rejectError"></span>
      </label>
      <div class="flex justify-end gap-2 pt-2">
        <button @click="rejectOpen=false" class="px-3 py-1.5 text-sm rounded-md border border-line hover:bg-fill">取消</button>
        <button @click="doReject()" class="px-3 py-1.5 text-sm rounded-md bg-danger text-white hover:opacity-90">确认驳回</button>
      </div>
    </div>
  </div>

  <!-- Modal: Withdraw -->
  <div x-show="withdrawOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4" x-cloak>
    <div class="absolute inset-0 bg-black/45" @click="withdrawOpen=false"></div>
    <div class="relative bg-white rounded-lg shadow-xl w-full max-w-sm p-5 space-y-4">
      <h3 class="text-base font-semibold">撤回申请</h3>
      <p class="text-sm text-ink-secondary">撤回后单据将解锁，可修改后再次提交。确认撤回该审批申请？</p>
      <div class="flex justify-end gap-2">
        <button @click="withdrawOpen=false" class="px-3 py-1.5 text-sm rounded-md border border-line hover:bg-fill">取消</button>
        <button @click="doWithdraw()" class="px-3 py-1.5 text-sm rounded-md bg-primary text-white">确认撤回</button>
      </div>
    </div>
  </div>

  <!-- Modal: Force reject -->
  <div x-show="forceOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4" x-cloak>
    <div class="absolute inset-0 bg-black/45" @click="forceOpen=false"></div>
    <div class="relative bg-white rounded-lg shadow-xl w-full max-w-md p-5 space-y-4">
      <h3 class="text-base font-semibold text-danger">强制驳回</h3>
      <p class="text-sm text-ink-secondary">强制驳回将终止当前审批并退回发起人，已产生的审批意见仍保留在历史中。此操作不可撤销为进行中。</p>

              if (!k) return true;
              return (t.title + t.bizCode).includes(k);
            });
        },
        get pagedTodos() {
          const start = (this.todoPage - 1) * this.pageSize;
          return this.filteredTodos.slice(start, start + this.pageSize);
        },
        get filteredMine() {
          let list = this.mineList.map(m => ({ ...m }));
          if (this.role === 'DISTRIBUTOR') {
            list = this.allInstances.filter(r => r.submitter === '张三').slice(0, 8).map(r => ({
              id: r.id, type: r.type, title: r.title, bizCode: r.bizCode, submittedAt: r.submittedAt,
              status: r.status, node: r.node || '', latestComment: r.status === '已驳回' ? '请修改后重提' : '',
            }));
          }
          return list
            .filter(r => !this.filters.mine.status || r.status === this.filters.mine.status)
            .filter(r => {
              const k = (this.filters.mine.keyword || '').trim();
              if (!k) return true;
              return (r.title + r.bizCode).includes(k);
            });
        },
        get filteredQuery() {
          let list = this.allInstances.slice();
          if (this.role === 'BRAND_HQ') list = list.filter(r => r.org === '品牌总部' || r.org === '华东经销'); // 演示本组织：简化为非华南
          if (this.role === 'BRAND_HQ') list = list.filter(r => r.org !== '华南经销');
          const f = this.filters.query;
          return list
            .filter(r => !f.bizCode || r.bizCode.includes(f.bizCode))
            .filter(r => !f.submitter || r.submitter.includes(f.submitter))
            .filter(r => !f.type || r.type === f.type)
            .filter(r => !f.status || r.status === f.status);
        },

        init() {
          this.ensureFlows();
        },
        ensureFlows() {
          const base = (id, title, type, bizCode, submitter) => ({
            id, title, type, bizCode, submitter, status: '审批中',
            nodes: [
              { key: 'n0', name: '提交', state: 'done' },
              { key: 'n1', name: '部门复核', state: 'done' },
              { key: 'n2', name: '财务复核', state: 'current' },
              { key: 'n3', name: '终审', state: 'todo' },
            ],
            durationText: '部门复核 1h20m｜财务复核进行中｜整单累计 2h25m',
            history: [
              { time: '07-30 10:00', node: '提交', operator: submitter, action: '提交', comment: '', fieldSummary: '' },
              { time: '07-30 11:20', node: '部门复核', operator: '王五', action: '同意', comment: '同意', fieldSummary: '' },
              { time: '07-30 11:25', node: '财务复核', operator: '—', action: '待处理', comment: '', fieldSummary: '' },
            ],
          });
          this.flowStore['i1'] = base('i1', '打火机A改价', '商品变更', 'SKU001', '张三');
          this.flowStore['i2'] = {
            ...base('i2', '打火机B退市', '退市', 'SPU002', '李四'),
            nodes: [
              { key: 'n0', name: '提交', state: 'done' },
              { key: 'n1', name: '品牌终审', state: 'current' },
            ],
            durationText: '品牌终审进行中｜整单累计 1d',
            history: [
              { time: '07-29 16:20', node: '提交', operator: '李四', action: '提交', comment: '', fieldSummary: '' },
            ],
          };
          this.flowStore['i3'] = {
            ...base('i3', '经销商自建商品上推确权', '跨租户上推', 'SPU088', '张三'),
            nodes: [
              { key: 'n0', name: '提交', state: 'done' },
              { key: 'n1', name: '品牌确认', state: 'current' },
            ],
            durationText: '品牌确认进行中｜整单累计 30m',
            history: [
              { time: '07-30 14:00', node: '提交', operator: '张三', action: '提交', comment: '上推须审', fieldSummary: '' },
            ],
          };
          this.flowStore['i6'] = base('i6', '活动价调整', '价格', 'PRC01', '赵运营');
          this.flowStore['i7'] = {
            id: 'i7', title: '春季打火机', type: '新品提报', bizCode: 'SUB02', submitter: '赵运营', status: '已驳回',
            nodes: [
              { key: 'n0', name: '提交', state: 'done' },
              { key: 'n1', name: '品类审核', state: 'done' },
            ],
            durationText: '整单累计 6h',
            history: [
              { time: '07-28 11:00', node: '提交', operator: '赵运营', action: '提交', comment: '', fieldSummary: '' },
              { time: '07-28 17:00', node: '品类审核', operator: '王总部', action: '驳回至发起人', comment: '类目有误', fieldSummary: '' },
            ],
          };
          this.flowStore['i9'] = base('i9', '他组织退市单', '退市', 'SPU999', '王五');
        },
        taskVisible(t) {
          if (this.role === 'PLATFORM_ADMIN') return t.status === 'DONE' ? true : false; // 默认不当业务审批人：待办少
          if (this.role === 'BRAND_OPERATOR') return t.assigneeRole === 'BRAND_OPERATOR' || t.status === 'DONE';
          if (this.role === 'DISTRIBUTOR') return false;
          return t.assigneeRole === 'BRAND_HQ' || t.status === 'DONE';
        },
        go(id) {
          this.page = id;
          if (id === 'todo') this.todoPage = 1;
        },
        onRoleChange() {
          if (this.page === 'query' && !this.canQuery) this.page = 'todo';
          this.toast('已切换当前角色「' + this.roleLabel + '」，待办可见范围已立即刷新（非角色并集）');
        },
        refreshList() {
          this.loading = true;
          setTimeout(() => { this.loading = false; this.toast('列表已刷新'); }, 400);
        },
        toast(msg, type = 'ok') {
          const id = Date.now() + Math.random();
          this.toasts.push({ id, msg, type });
          setTimeout(() => { this.toasts = this.toasts.filter(t => t.id !== id); }, 2800);
        },
        statusClass(s) {
          if (s === '审批中') return 'bg-primary-bg text-primary';
          if (s === '已通过') return 'bg-success-bg text-success';
          if (s === '已驳回') return 'bg-primary-bg text-primary';
          if (s === '已撤销') return 'bg-fill text-ink-secondary';
          return 'bg-fill text-ink-secondary';
        },
        actionClass(a) {
          if (a.includes('驳回') || a === '强制驳回') return 'bg-primary-bg text-primary';
          if (a === '同意' || a === '提交') return 'bg-success-bg text-success';
          if (a === '撤回') return 'bg-fill text-ink-secondary border border-line';
          return 'bg-fill text-ink-secondary';
        },
        openFlow(id) {
          this.ensureFlows();
          const inst = this.flowStore[id] || this.allInstances.find(x => x.id === id);
          if (!inst && !this.flowStore[id]) {
            this.toast('无权查看或单据不存在', 'error');
            return;
          }
          this.currentInstance = this.flowStore[id] || {
            ...inst,
            nodes: [{ key: 'n0', name: '提交', state: 'done' }, { key: 'n1', name: '处理中', state: 'current' }],
            durationText: '—',
            history: [{ time: inst.submittedAt, node: '提交', operator: inst.submitter, action: '提交', comment: '', fieldSummary: '' }],
          };
          this.flowBack = ['todo', 'mine', 'query', 'biz'].includes(this.page) ? this.page : 'todo';
          this.page = 'flow';
        },
        isChangeApprovalType(type) {
          return ['商品变更', '价格'].includes(type) || (type && String(type).includes('变更'));
        },
        buildChangeDiffs(row) {
          if (!this.isChangeApprovalType(row.type)) return [];
          const submitter = row.submitter || '发起人';
          if (row.type === '价格' || (row.title && row.title.includes('价'))) {
            return [
              { fieldName: '渠道专供价', beforeValue: '128.00', afterValue: '118.00', nodeName: '提交', operatorName: submitter, source: 'SUBMIT' },
              { fieldName: '生效日期', beforeValue: '2026-07-01', afterValue: '2026-08-01', nodeName: '提交', operatorName: submitter, source: 'SUBMIT' },
            ];
          }
          return [
            { fieldName: '卖点', beforeValue: '经典款', afterValue: '经典机型升级款', nodeName: '提交', operatorName: submitter, source: 'SUBMIT' },
            { fieldName: '成本价', beforeValue: '80.00', afterValue: '86.00', nodeName: '品牌初审', operatorName: '李四', source: 'APPROVE' },
            { fieldName: '商品名称', beforeValue: '经典铬色机身', afterValue: row.title || '经典铬色机身文案修订', nodeName: '提交', operatorName: submitter, source: 'SUBMIT' },
          ];
        },
        openBiz(row, readonly = false) {
          const requireReview = !!row.requireReview;
          const isChangeFlow = this.isChangeApprovalType(row.type);
          this.bizDoc = {
            instanceId: row.instanceId || row.id,
            pageTitle: row.type === '退市' ? '退市申请详情' : row.type === '跨租户上推' ? '商品上推确权' : '商品详情（审批态）',
            type: row.type,
            title: row.title,
            bizCode: row.bizCode,
            status: row.status === 'DONE' ? '已通过' : (row.status === 'PENDING' ? '审批中' : (row.status || '审批中')),
            node: row.node,
            assignee: this.currentUser.name,
            isAssignee: row.status === 'PENDING' && this.taskVisible(row),
            requireReview,
            isChangeFlow,
            changeDiffs: this.buildChangeDiffs(row),
            fields: [
              { key: 'name', label: '商品名称', value: row.title, editable: false },
              { key: 'code', label: '业务编码', value: row.bizCode, editable: false },
              { key: 'sellingPoint', label: '卖点', value: '经典机型升级款', editable: !requireReview },
              { key: 'cost', label: '成本价', value: '86.00', editable: !requireReview },
              { key: 'remark', label: '备注', value: '审批中锁定', editable: false },
            ],
          };
          if (row.status === 'DONE') this.bizDoc.isAssignee = false;
          this.approveComment = '';
          this.page = 'biz';
        },
        openReject() {
          if (!this.bizDoc?.isAssignee) {
            this.toast('您不是当前审批人', 'error');
            return;
          }
          this.rejectOpen = true;
          this.rejectMode = 'TO_SUBMITTER';
          this.rejectNode = '';
          this.rejectComment = '';
          this.rejectError = '';
        },
        doApprove() {
          if (!this.bizDoc?.isAssignee) {
            this.toast('您不是当前审批人', 'error');
            return;
          }
          // 模拟非白名单拦截：若用户改了备注（不可编辑字段被禁用，跳过）
          this.actionLoading = true;
          setTimeout(() => {
            const task = this.tasks.find(t => (t.instanceId || t.id) === this.bizDoc.instanceId && t.status === 'PENDING');
            if (task) task.status = 'DONE';
            const inst = this.flowStore[this.bizDoc.instanceId];
            if (inst) {
              const edited = this.bizDoc.fields.filter(f => f.editable).map(f => f.label + '→' + f.value).join('；');
              inst.history.push({
                time: '刚刚', node: this.bizDoc.node, operator: this.currentUser.name, action: '同意',
                comment: this.approveComment || '同意', fieldSummary: edited || '',
              });
              inst.nodes.forEach((n, i) => {
                if (n.state === 'current') {
                  n.state = 'done';
                  if (inst.nodes[i + 1]) inst.nodes[i + 1].state = 'current';
                  else inst.status = '已通过';
                }
              });
              if (inst.nodes.every(n => n.state === 'done')) inst.status = '已通过';
            }
            this.actionLoading = false;
            this.toast('已同意，返回我的审批');
            this.go('todo');
            this.todoTab = 'pending';
          }, 600);
        },
        doReject() {
          if (!this.rejectComment.trim()) {
            this.rejectError = '请填写驳回原因';
            return;
          }
          if (this.rejectMode === 'TO_NODE' && !this.rejectNode) {
            this.rejectError = '请选择目标节点';
            return;
          }
          this.rejectError = '';
          const id = this.bizDoc.instanceId;
          const task = this.tasks.find(t => (t.instanceId || t.id) === id && t.status === 'PENDING');
          if (task) {
            if (this.rejectMode === 'TO_SUBMITTER') task.status = 'DONE';
            else { task.node = this.rejectNode; task.stay = '0m'; }
          }
          const inst = this.flowStore[id];
          if (inst) {
            inst.history.push({
              time: '刚刚', node: this.bizDoc.node, operator: this.currentUser.name,
              action: this.rejectMode === 'TO_NODE' ? '驳回到指定节点' : '驳回至发起人',
              comment: this.rejectComment, fieldSummary: '',
            });
            if (this.rejectMode === 'TO_SUBMITTER') {
              inst.status = '已驳回';
              inst.nodes.forEach(n => { if (n.state === 'current') n.state = 'done'; });
            }
          }
          this.rejectOpen = false;
          this.toast('已驳回');
          this.go('todo');
        },
        openWithdraw(row) {
          this.withdrawTarget = row;
          this.withdrawOpen = true;
        },
        doWithdraw() {
          if (this.withdrawTarget.status !== '审批中') {
            this.toast('申请已结束，无法撤回', 'error');
            this.withdrawOpen = false;
            return;
          }
          this.withdrawTarget.status = '已撤销';
          this.withdrawTarget.node = '';
          this.withdrawOpen = false;
          this.toast('已撤回，单据已解锁');
        },
        doForceReject() {
          if (!this.canForceReject) {
            this.toast('无强制驳回权限', 'error');
            return;
          }
          if (!this.forceComment.trim()) {
            this.forceError = '请填写强制驳回意见';
            return;
          }
          if (this.currentInstance.status !== '审批中') {
            this.toast('单据已结束，无法强制驳回', 'error');
            return;
          }
          this.currentInstance.status = '已驳回';
          this.currentInstance.history.push({
            time: '刚刚', node: '系统', operator: this.currentUser.name, action: '强制驳回',
            comment: this.forceComment, fieldSummary: '',
          });
          this.currentInstance.nodes.forEach(n => { if (n.state === 'current') n.state = 'done'; });
          const task = this.tasks.find(t => t.instanceId === this.currentInstance.id);
          if (task) task.status = 'DONE';
          this.forceOpen = false;
          this.toast('已强制驳回');
        },
        runGate() {
          if (this.gate.typeEnabled === 'DISABLED') {
            this.gate.ok = true;
            this.gate.result = '免审直通：类型未启用，不创建审批单，业务继续后续流程。';
            return;
          }
          if (!this.gate.hasMenu) {
            this.gate.ok = false;
            this.gate.result = '禁止提交：本组织未开通审批权限，请联系管理员（422-APR-MENU_DENIED）';
            return;
          }
          this.gate.ok = true;
          this.gate.result = '校验通过：已创建审批单与待办，业务单据置为审批中并锁定。';
        },
      };
    }
  </script>
</body>

<script>
/* ZIPPO_GLOBAL_SHELL_V2 */
(function(){
  if(window.__zippoShellV2) return;
  window.__zippoShellV2 = 1;
  document.querySelectorAll('.card').forEach(function(card){
    if(card.querySelector('.table-wrap table')) card.classList.add('has-table');
  });
  document.querySelectorAll('.pager, .pagination').forEach(function(p){
    p.classList.add('zippo-pager-sticky');
  });
  function wrapAvatar(el){
    if(!el || el.closest('.zippo-user-menu')) return;
    var wrap = document.createElement('div');
    wrap.className = 'zippo-user-menu';
    var panel = document.createElement('div');
    panel.className = 'zippo-user-menu-panel';
    panel.innerHTML = '<button type="button" data-act="profile">个人中心</button><button type="button" data-act="logout">退出登录</button>';
    el.parentNode.insertBefore(wrap, el);
    wrap.appendChild(el);
    wrap.appendChild(panel);
    el.style.cursor = 'pointer';
    el.addEventListener('click', function(e){ e.stopPropagation(); wrap.classList.toggle('open'); });
    panel.querySelector('[data-act=profile]').onclick = function(){
      wrap.classList.remove('open');
      var t=document.getElementById('toast'); if(t){t.textContent='个人中心';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);} else alert('个人中心');
    };
    panel.querySelector('[data-act=logout]').onclick = function(){
      wrap.classList.remove('open');
      var t=document.getElementById('toast'); if(t){t.textContent='已退出登录';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);} else alert('已退出登录');
    };
    document.addEventListener('click', function(){ wrap.classList.remove('open'); });
  }
  document.querySelectorAll('[aria-label="账号"], [title="管理员"], .d05-avatar, .d03-avatar, .zippo-avatar-trigger').forEach(wrapAvatar);
  document.querySelectorAll('.top-right span[title], .global-topbar .top-right > span[style*="border-radius:50%"]').forEach(function(el){
    if(el.textContent && el.textContent.length<=2) wrapAvatar(el);
  });
  document.querySelectorAll('.w-8.h-8.rounded-full, .rounded-full.bg-primary').forEach(function(el){
    if(el.closest('header') && !el.closest('.zippo-user-menu')) wrapAvatar(el);
  });
})();
</script>

<script src="view-guard.js"></script>
